      <button class="btn small ghost" id="resetGameBtn">Reset Game</button>`;
    this.panelContent.querySelectorAll('[data-upgrade]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!g.spendUpgradePoint(btn.dataset.upgrade)) return;
        this.renderCharacterPanel();
      });
    });
    this.panelContent.querySelectorAll('[data-buff]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (g.buyBuff(btn.dataset.buff)) this.renderCharacterPanel();
      });
    });
    this.panelContent.querySelector('#resetGameBtn').addEventListener('click', () => {
      this.confirmAction('Reset ALL progress — level, gear, materials, everything? This cannot be undone.', () => g.hardReset());
    });
  }

  // Gear ----------------------------------------------------------------
  renderGearPanel() {
    const g = this.game, save = g.save;
    const slots = Object.keys(SLOT_LABELS);
    this.panelContent.innerHTML = `<div class="gear-grid">${slots.map(slot => {
      const defId = save.loadout[slot];
      const def = defId ? getById(EQUIPMENT, defId) : null;
      const tier = def ? (this.findItemByDefEquipped(slot)?.tier || def.tier) : null;
      return `<div class="gear-slot" data-slot="${slot}">
        <div class="gear-slot-label">${SLOT_LABELS[slot]}</div>
        <div class="gear-slot-item" style="border-color:${tier ? TIERS[tierIndex(tier)].color : 'rgba(255,255,255,0.15)'}">
          ${def ? def.name : 'Empty'}
        </div>
      </div>`;
    }).join('')}</div>
    <div id="gearPicker"></div>`;
    this.panelContent.querySelectorAll('.gear-slot').forEach(el => {
      el.addEventListener('click', () => this.renderGearPicker(el.dataset.slot));
    });
  }
  findItemByDefEquipped(slot) {
    return this.game.save.inventory.items.find(i => i.defId === this.game.save.loadout[slot]);
  }
  renderGearPicker(slot) {
    const g = this.game, save = g.save;
    const owned = save.inventory.items.filter(i => {
      const def = getById(EQUIPMENT, i.defId);
      return def && def.slot === slot;
    });
    const target = this.panelContent.querySelector('#gearPicker');
    target.innerHTML = `<div class="picker-title">Select for ${SLOT_LABELS[slot]}</div>
      <div class="picker-list">
        <button class="btn small" data-unequip="1">Unequip</button>
        ${owned.map(item => {
          const def = getById(EQUIPMENT, item.defId);
          return `<div class="equip-picker-item detail-openable" data-uid="${item.uid}" style="border-color:${TIERS[tierIndex(item.tier)].color}">
            <span>${def.name} <small>${TIERS[tierIndex(item.tier)].name} Lv.${item.level}</small></span>
            <button class="info-btn" data-info-uid="${item.uid}">i</button>
          </div>`;
        }).join('') || '<div class="empty-note">No items for this slot yet — check the Smith or defeat enemies for loot.</div>'}
      </div>`;
    target.querySelector('[data-unequip]').addEventListener('click', () => {
      save.loadout[slot] = null;
      g.player.stats = computeStats(save); g.persist();
      this.renderGearPanel();
    });
    const equip = (item) => {
      save.loadout[slot] = item.defId;
      g.player.stats = computeStats(save); g.persist();
      this.renderGearPanel();
    };
    target.querySelectorAll('.equip-picker-item').forEach(row => {
      row.addEventListener('click', (e) => {
        const item = owned.find(i => i.uid === row.dataset.uid);
        if (e.target.closest('[data-info-uid]')) {
          const def = getById(EQUIPMENT, item.defId);
          this.showItemDetail(def, { item, actions: [{ label: 'Equip', onClick: () => { equip(item); this.closeItemDetail(); } }] });
          return;
        }
        equip(item);
      });
    });
  }

  // Smith -----------------------------------------------------------------
  renderSmithPanel() {
    const g = this.game, save = g.save;
    const items = save.inventory.items;
    const platformCost = platformSlotCost(save.meta.platformSlots);
    const atMaxPlatforms = save.meta.platformSlots >= MAX_PLATFORM_SLOTS;
    this.panelContent.innerHTML = `
      <div class="cores-row">Cores <b>${formatNum(save.meta.cores)}</b></div>
      <div class="section-label">Base Expansion</div>
      <div class="expand-row">
        <div>Building Platforms <small>${save.meta.platformSlots}/${MAX_PLATFORM_SLOTS}${atMaxPlatforms ? ' · Maxed' : ''}</small></div>
        ${atMaxPlatforms ? '' : `<div class="cost">${platformCost} Cores</div>`}
        <button class="btn small" id="expandPlatformBtn" ${!atMaxPlatforms && save.meta.cores >= platformCost ? '' : 'disabled'}>${atMaxPlatforms ? 'Maxed' : 'Expand'}</button>
      </div>
      ${this.materialsRow()}
      <div class="section-label">Craft (uses Recipes + Materials)</div>
      <div class="craft-list">${save.unlocked.recipes.map(id => {
        const def = getById([...EQUIPMENT, ...BUILDINGS], id);
        if (!def) return '';
        const cost = this.craftCost(def);
        const canAfford = this.canAfford(cost);
        return `<div class="craft-row detail-openable" data-defid="${id}">
          <div>${def.name} <small>${TIERS[tierIndex(def.tier)].name}</small></div>
          <div class="cost">${Object.entries(cost).filter(([, c]) => c > 0).map(([m, c]) => `${c} ${getById(MATERIALS, m).name}`).join(', ')}</div>
          <button class="btn small" data-craft="${id}" ${canAfford ? '' : 'disabled'}>Craft</button>
        </div>`;
      }).join('')}</div>
      <div class="section-label">Your Equipment</div>
      <div class="smith-list">${items.map(item => {
        const def = getById(EQUIPMENT, item.defId);
        const tierInfo = TIERS[tierIndex(item.tier)];
        const upCost = this.upgradeItemCost(item);
        return `<div class="smith-row detail-openable" data-uid="${item.uid}" style="border-color:${tierInfo.color}">
          <div>${def.name} <small>${tierInfo.name} Lv.${item.level}</small></div>
          <div class="smith-actions">
            <button class="btn small" data-upgrade-item="${item.uid}" ${this.canAfford(upCost) ? '' : 'disabled'}>Upgrade</button>
            <button class="btn small ghost" data-dismantle="${item.uid}">Dismantle</button>
          </div>
        </div>`;
      }).join('') || '<div class="empty-note">No equipment yet.</div>'}</div>`;

    this.panelContent.querySelectorAll('.craft-row').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('[data-craft]')) return;
        const def = getById([...EQUIPMENT, ...BUILDINGS], row.dataset.defid);
        this.showItemDetail(def, { actions: [{ label: 'Craft', onClick: () => { this.craftItem(row.dataset.defid); this.closeItemDetail(); } }] });
      });
    });
    this.panelContent.querySelectorAll('.smith-row').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('[data-upgrade-item], [data-dismantle]')) return;
        const item = items.find(i => i.uid === row.dataset.uid);
        const def = getById(EQUIPMENT, item.defId);
        this.showItemDetail(def, {
          item,
          actions: [
            { label: 'Upgrade', onClick: () => { this.upgradeItem(item.uid); this.closeItemDetail(); } },
            { label: 'Dismantle', cls: 'ghost', onClick: () => {
              this.closeItemDetail();
              this.confirmAction(`Dismantle ${def.name}? This cannot be undone.`, () => this.dismantleItem(item.uid));
            } },
          ],
        });
      });
    });
    this.panelContent.querySelectorAll('[data-craft]').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); this.craftItem(btn.dataset.craft); });
    });
    this.panelContent.querySelectorAll('[data-upgrade-item]').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); this.upgradeItem(btn.dataset.upgradeItem); });
    });
    this.panelContent.querySelectorAll('[data-dismantle]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const item = items.find(i => i.uid === btn.dataset.dismantle);
        const def = getById(EQUIPMENT, item.defId);
        this.confirmAction(`Dismantle ${def.name}? This cannot be undone.`, () => this.dismantleItem(btn.dataset.dismantle));
      });
    });
    const expandBtn = this.panelContent.querySelector('#expandPlatformBtn');
    if (expandBtn) expandBtn.addEventListener('click', () => { if (g.expandPlatforms()) this.renderSmithPanel(); });
  }
  // Smith economy — tune these formulas (or the item-level cap of 5 before
  // tier-up, hardcoded in upgradeItem() below) to rebalance crafting/upgrade
  // costs. They're the only place those costs are computed.
  craftCost(def) {
    const t = tierIndex(def.tier);
    return { m_scrap: 15 + t * 10, m_metal: t * 6 };
  }
  upgradeItemCost(item) {
    const t = tierIndex(item.tier);
    return { m_scrap: 8 + item.level * 4 + t * 5, m_component: t >= 2 ? 2 + item.level : 0 };
  }
  canAfford(cost) {
    const mats = this.game.save.inventory.materials;
    return Object.entries(cost).every(([id, amt]) => (mats[id] || 0) >= amt);
  }
  spend(cost) {
    const mats = this.game.save.inventory.materials;
    for (const [id, amt] of Object.entries(cost)) mats[id] = (mats[id] || 0) - amt;
  }
  craftItem(defId) {
    const def = getById([...EQUIPMENT, ...BUILDINGS], defId);
    const cost = this.craftCost(def);
    if (!this.canAfford(cost)) return;
    this.spend(cost);
    if (WEAPONS.includes(def) || ARMOR.includes(def)) {
      this.game.save.inventory.items.push({ uid: uid('item'), defId, tier: def.tier, level: 1 });
      this.game.recordLedger(defId, def.tier);
    } else {
      if (!this.game.save.unlocked.buildings.includes(defId)) this.game.save.unlocked.buildings.push(defId);
    }
    this.game.persist();
    this.renderSmithPanel();
    this.toast(`Crafted ${def.name}`);
  }
  upgradeItem(uidVal) {
    const item = this.game.save.inventory.items.find(i => i.uid === uidVal);
    if (!item) return;
    const cost = this.upgradeItemCost(item);
    if (!this.canAfford(cost)) return;
    this.spend(cost);
    item.level += 1;
    if (item.level > 5) { item.level = 1; item.tier = nextTier(item.tier).id; }
    this.game.recordLedger(item.defId, item.tier);
    this.game.player.stats = computeStats(this.game.save);
    this.game.persist();
    this.renderSmithPanel();
  }
  dismantleItem(uidVal) {
    const idx = this.game.save.inventory.items.findIndex(i => i.uid === uidVal);
    if (idx < 0) return;
    const item = this.game.save.inventory.items[idx];
    const t = tierIndex(item.tier);
    this.game.save.inventory.materials.m_scrap = (this.game.save.inventory.materials.m_scrap || 0) + 10 + t * 8;
    // unequip if worn
    for (const slot of Object.keys(SLOT_LABELS)) {
      if (this.game.save.loadout[slot] === item.defId) this.game.save.loadout[slot] = null;
    }
    this.game.save.inventory.items.splice(idx, 1);
    this.game.player.stats = computeStats(this.game.save);
    this.game.persist();
    this.renderSmithPanel();
  }

  // Abilities ---------------------------------------------------------------
  renderAbilitiesPanel() {
    const g = this.game, save = g.save;
    const owned = save.unlocked.abilities;
    const actives = ABILITIES.filter(a => a.type === 'active' && owned.includes(a.id));
    const passives = ABILITIES.filter(a => a.type === 'passive' && owned.includes(a.id));
    const activeSlots = 3, passiveSlots = 3;
    this.panelContent.innerHTML = `
      <div class="section-label">Active (equip up to ${activeSlots})</div>
      <div class="ability-list">${actives.map(a => `<div class="ability-row ${save.loadout.abilitiesActive.includes(a.id) ? 'equipped' : ''}" data-ab="${a.id}" data-kind="active">
        <div>${a.name}<small>CD ${a.cooldown}s · Cost ${a.cost}</small></div>
        <span class="check">${save.loadout.abilitiesActive.includes(a.id) ? '✓' : ''}</span>
      </div>`).join('')}</div>
      <div class="section-label">Passive (equip up to ${passiveSlots})</div>
      <div class="ability-list">${passives.map(a => `<div class="ability-row ${save.loadout.abilitiesPassive.includes(a.id) ? 'equipped' : ''}" data-ab="${a.id}" data-kind="passive">
        <div>${a.name}<small>Passive bonus</small></div>
        <span class="check">${save.loadout.abilitiesPassive.includes(a.id) ? '✓' : ''}</span>
      </div>`).join('')}</div>`;
    this.panelContent.querySelectorAll('.ability-row').forEach(row => {
      row.addEventListener('click', () => {
        const id = row.dataset.ab, kind = row.dataset.kind;
        const key = kind === 'active' ? 'abilitiesActive' : 'abilitiesPassive';
        const limit = kind === 'active' ? activeSlots : passiveSlots;
        const list = save.loadout[key];
        const i = list.indexOf(id);
        if (i >= 0) list.splice(i, 1);
        else { if (list.length >= limit) list.shift(); list.push(id); }
        g.player.stats = computeStats(save);
        g.persist();
        this.renderAbilitiesPanel();
      });
    });
  }

  // Inventory ---------------------------------------------------------------
  renderInventoryPanel() {
    const g = this.game, save = g.save;
    const ledgerCount = Object.keys(save.ledger.equipment).length;
    this.panelContent.innerHTML = `
      ${this.materialsRow()}
      <div class="section-label">Items</div>
      <div class="inv-list">${save.inventory.items.map(item => {
        const def = getById(EQUIPMENT, item.defId);
        const tierInfo = TIERS[tierIndex(item.tier)];
        const equippedSlot = Object.keys(SLOT_LABELS).find(s => save.loadout[s] === item.defId);
        return `<div class="inv-row detail-openable" data-uid="${item.uid}" style="border-color:${tierInfo.color}">
          <div>${def.name}<small>${tierInfo.name} Lv.${item.level} ${equippedSlot ? '· Equipped' : ''}</small></div>
          <div class="inv-actions">
            <button class="btn small ghost" data-sell="${item.uid}">Sell</button>
          </div>
        </div>`;
      }).join('') || '<div class="empty-note">Inventory empty — defeat enemies for loot.</div>'}</div>
      <div class="ledger-header" id="ledgerToggle">
        <span>Ledger — Discovered Gear <small>(${ledgerCount}/${EQUIPMENT.length})</small></span>
        <span class="ledger-chevron">${this.ledgerExpanded ? '▾' : '▸'}</span>
      </div>
      <div class="ledger-body" ${this.ledgerExpanded ? '' : 'style="display:none"'}>${this.renderLedgerGroups()}</div>`;
    this.panelContent.querySelectorAll('.inv-row').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('[data-sell]')) return; // let the Sell button handle its own click
        const item = save.inventory.items.find(i => i.uid === row.dataset.uid);
        const def = getById(EQUIPMENT, item.defId);
        this.showItemDetail(def, {
          item,
          actions: [{ label: 'Sell', cls: 'ghost', onClick: () => {
            this.closeItemDetail();
            this.confirmAction(`Sell ${def.name}?`, () => this.sellItem(item.uid));
          } }],
        });
      });
    });
    this.panelContent.querySelectorAll('[data-sell]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const item = save.inventory.items.find(i => i.uid === btn.dataset.sell);
        const def = getById(EQUIPMENT, item.defId);
        this.confirmAction(`Sell ${def.name}?`, () => this.sellItem(btn.dataset.sell));
      });
    });
    this.panelContent.querySelector('#ledgerToggle').addEventListener('click', () => {
      this.ledgerExpanded = !this.ledgerExpanded;
      this.renderInventoryPanel();
    });
    if (this.ledgerExpanded) {
      this.panelContent.querySelectorAll('.ledger-item[data-defid]').forEach(el => {
        el.addEventListener('click', () => {
          const def = getById(EQUIPMENT, el.dataset.defid);
          this.showItemDetail(def, { item: { tier: save.ledger.equipment[def.id], level: 1 } });
        });
      });
    }
  }

  // Groups every EQUIPMENT def by slot for the Ledger — discovered pieces
  // (present in save.ledger.equipment, which never loses an entry even
  // after the item itself is sold/dismantled — see Game.recordLedger())
  // show their name and best tier seen; everything else shows as a "???"
  // silhouette so the ledger doubles as a discovery checklist.
  renderLedgerGroups() {
    const g = this.game;
    const slots = ['main', 'secondary', 'helmet', 'armor', 'gloves', 'boots', 'accessory'];
    const groupLabels = { main: 'Main Weapons', secondary: 'Secondary Weapons', helmet: 'Helmets', armor: 'Armor', gloves: 'Gloves', boots: 'Boots', accessory: 'Accessories' };
    return slots.map(slot => {
      const defs = EQUIPMENT.filter(e => e.slot === slot);
      const items = defs.map(def => {
        const seenTier = g.save.ledger.equipment[def.id];
        if (seenTier) {
          const tierInfo = TIERS[tierIndex(seenTier)];
          return `<div class="ledger-item" data-defid="${def.id}" style="border-color:${tierInfo.color}"><span>${def.name}</span><small>${tierInfo.name}</small></div>`;
        }
        return `<div class="ledger-item undiscovered"><span>???</span><small>Undiscovered</small></div>`;
      }).join('');
      return `<div class="ledger-group">
        <div class="ledger-group-label">${groupLabels[slot]}</div>
        <div class="ledger-grid">${items}</div>
      </div>`;
    }).join('');
  }

  sellItem(uid) {
    const g = this.game, save = g.save;
    const idx = save.inventory.items.findIndex(i => i.uid === uid);
    if (idx < 0) return;
    const item = save.inventory.items[idx];
    const t = tierIndex(item.tier);
    save.inventory.materials.m_scrap = (save.inventory.materials.m_scrap || 0) + 6 + t * 5;
    for (const slot of Object.keys(SLOT_LABELS)) if (save.loadout[slot] === item.defId) save.loadout[slot] = null;
    save.inventory.items.splice(idx, 1);
    g.player.stats = computeStats(save);
    g.persist();
    this.renderInventoryPanel();
  }

  // Dungeon ---------------------------------------------------------------
  renderDungeonPanel() {
    const g = this.game, save = g.save;
    const rewardLabels = { gear: 'Gear', materials: 'Materials', gems: 'Gems', xp: 'Experience' };
    this.panelContent.innerHTML = `
      <div class="empty-note">Endless trials against an invincible boss. You can't win — survive as long as you can, and your reward scales with the depth you reach.</div>
      <div class="section-label">Depth Rewards</div>
      <div class="depth-legend">${DUNGEON_TIERS.map(t => `<span class="depth-chip">${t.label} <small>${t.atSeconds}s</small></span>`).join('')}</div>
      <div class="section-label">Trials</div>
      <div class="dungeon-list">${DUNGEONS.map(d => {
        const unlocked = save.unlocked.dungeons.includes(d.id);
        const meetsLevel = g.player.level >= d.minLevel;
        return `<div class="dungeon-row ${unlocked ? '' : 'locked'}">
          <div>${d.name}<small>Rewards ${rewardLabels[d.rewardType] || d.rewardType}${d.minLevel > 1 ? ` · Requires Lv.${d.minLevel}` : ''}</small></div>
          <button class="btn small" data-dungeon="${d.id}" ${unlocked && meetsLevel ? '' : 'disabled'}>${unlocked ? 'Enter' : 'Locked'}</button>
        </div>`;
      }).join('')}</div>`;
    this.panelContent.querySelectorAll('[data-dungeon]').forEach(btn => {
      btn.addEventListener('click', () => {
        this.game.enterDungeon(btn.dataset.dungeon);
        this.closePanel();
      });
    });
  }

  formatCountdown(ms) {
    const total = Math.ceil(ms / 1000);
    const m = Math.floor(total / 60);
    const s = total % 60;
    return `${m}:${s.toString().padStart(2, '0')}`;
  }

  // --- Build modal ---------------------------------------------------------
  openBuildModal(platIdx) {
    const g = this.game, save = g.save;
    const existing = g.buildings[platIdx];
    const owned = save.unlocked.buildings;
    const mats = save.inventory.materials;
    this.buildModal.classList.add('show');
    const list = owned.map(id => {
      const def = getById(BUILDINGS, id);
      const cost = def.cost || {};
      const costStr = Object.entries(cost).filter(([, c]) => c > 0).map(([m, c]) => `${c} ${getById(MATERIALS, m).name}`).join(', ');
      const canAfford = Object.entries(cost).every(([m, c]) => (mats[m] || 0) >= c);
      return `<div class="equip-picker-item ${canAfford ? 'detail-openable' : 'disabled'}" data-defid="${id}" style="border-color:${TIERS[tierIndex(def.tier)].color}">
        <span>${def.name}<small>${def.category} · ${TIERS[tierIndex(def.tier)].name}${costStr ? ` · ${costStr}` : ''}</small></span>
        <button class="info-btn" data-info-defid="${id}">i</button>
      </div>`;
    }).join('');
    this.buildModal.querySelector('#buildModalBody').innerHTML = `
      <div class="picker-title">Platform ${platIdx + 1}${existing ? ` — ${existing.def.name} (Lv.${existing.level})` : ''}</div>
      ${existing ? '<button class="btn small ghost" id="removeBuildingBtn">Remove</button>' : ''}
      <div class="picker-list">${list || '<div class="empty-note">No buildings unlocked yet — defeat enemies for blueprint drops.</div>'}</div>`;
    const place = (id) => { if (g.placeBuilding(platIdx, id)) this.closeBuildModal(); };
    this.buildModal.querySelector('#buildModalBody').querySelectorAll('.equip-picker-item').forEach(row => {
      row.addEventListener('click', (e) => {
        const id = row.dataset.defid;
        if (e.target.closest('[data-info-defid]')) {
          const def = getById(BUILDINGS, id);
          const cost = def.cost || {};
          const canAfford = Object.entries(cost).every(([m, c]) => (mats[m] || 0) >= c);
          this.showItemDetail(def, { actions: [{ label: 'Place', onClick: () => { place(id); this.closeItemDetail(); }, ...(canAfford ? {} : { cls: 'ghost' }) }] });
          return;
        }
        if (row.classList.contains('disabled')) return;
        place(id);
      });
    });
    const removeBtn = this.buildModal.querySelector('#removeBuildingBtn');
    if (removeBtn) removeBtn.addEventListener('click', () => { g.removeBuilding(platIdx); this.closeBuildModal(); });
  }
  closeBuildModal() { this.buildModal.classList.remove('show'); }
}

return { UIManager };
})();

/* ---------- js/main.js ---------- */
// js/main.js
// Bootstrap only — this file wires Game + UIManager together and starts the
// loop. You shouldn't need to add game content or systems here; see
// js/core/Game.js's header for where a new per-frame system belongs, and
// js/data/gameData.js's header for where new content belongs.
const { Game } = MOD_Game;
const { UIManager } = MOD_UIManager;

const canvas = document.getElementById('gameCanvas');
const battleView = document.getElementById('battleView');
const game = new Game(canvas);

function fitCanvas() {
  const rect = battleView.getBoundingClientRect();
  game.resize(rect.width, rect.height);
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

const ui = new UIManager(game, document.body);

function uiLoop() {
  ui.tick();
  requestAnimationFrame(uiLoop);
}
uiLoop();

game.start();

// Expose for debugging from the console.
window.__game = game;


})();

</script>
</body>

      main: 'w_mg', secondary: 'w_sidearm', helmet: null, armor: null, gloves: null, boots: null,
      accessory1: null, accessory2: null,
      abilitiesActive: ['ab_heal'],
      abilitiesPassive: ['pa_atkspeed'],
      buildings: [null, null, null, null], // length must track meta.platformSlots — see Game.expandPlatforms()
    },
    inventory: {
      // A small starting stash so a fresh save can immediately afford its
      // default-unlocked starter buildings (b_mg_turret/b_mine/b_medbay cost
      // scrap; b_amp_atk costs metal) — see placeBuilding() in Game.js,
      // which now actually deducts `cost` on placement rather than being
      // purely decorative.
      materials: { m_scrap: 60, m_metal: 15 },   // id -> count
      items: [],       // {uid, defId, kind, tier, level}
    },
    settings: { musicVolume: 0.6, sfxVolume: 0.8 },
  };
}

// Sections merged one level deep by load()/migrateSave() — add a new
// top-level object here (with how its nested collections should combine)
// any time defaultSave() grows a new section, or an old save's stored copy
// will wholesale override your new defaults for that section, silently
// hiding any field you added inside it.
function mergeSave(fresh, stored) {
  const s = stored || {};
  return {
    ...fresh, ...s,
    meta: { ...fresh.meta, ...(s.meta || {}) },
    run: { ...fresh.run, ...(s.run || {}) },
    ledger: { equipment: { ...fresh.ledger.equipment, ...((s.ledger || {}).equipment || {}) } },
    activeBuffs: { ...fresh.activeBuffs, ...(s.activeBuffs || {}) },
    character: {
      ...fresh.character, ...(s.character || {}),
      upgrades: { ...fresh.character.upgrades, ...((s.character || {}).upgrades || {}) },
    },
    unlocked: { ...fresh.unlocked, ...(s.unlocked || {}) },
    loadout: { ...fresh.loadout, ...(s.loadout || {}) },
    inventory: {
      ...fresh.inventory, ...(s.inventory || {}),
      materials: { ...fresh.inventory.materials, ...((s.inventory || {}).materials || {}) },
    },
    settings: { ...fresh.settings, ...(s.settings || {}) },
  };
}

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultSave();
    const parsed = JSON.parse(raw);
    if (!parsed.version || parsed.version !== SAVE_VERSION) {
      return migrateSave(parsed);
    }
    return mergeSave(defaultSave(), parsed);
  } catch (err) {
    console.warn('Save load failed, starting fresh.', err);
    return defaultSave();
  }
}

function save(state) {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    return true;
  } catch (err) {
    console.warn('Save write failed.', err);
    return false;
  }
}

function wipe() {
  localStorage.removeItem(SAVE_KEY);
}

function migrateSave(old) {
  // Placeholder migration path for future save-format changes.
  return { ...mergeSave(defaultSave(), old), version: SAVE_VERSION };
}

return { defaultSave, load, save, wipe };
})();

/* ---------- js/render/Renderer.js ---------- */
const MOD_Renderer = (function () {
// js/render/Renderer.js
// All Canvas drawing lives here, as one big render() call per frame that
// draws layer by layer (background -> hex platforms -> telegraphs ->
// buildings -> loot -> enemies -> player -> projectiles -> particles ->
// damage numbers). Nothing in here mutates game state — it only reads the
// `state` object Game.draw() hands it each frame.
//
// HOW TO EXTEND THIS FILE
//   - New enemy `role` color: add a key to ENEMY_COLORS below (roles come
//     from the ENEMIES entries' `role` field in gameData.js).
//   - New projectile `visual`: add a key to the colorMap inside
//     drawProjectiles(); unrecognized visuals just fall back to cyan.
//   - New rarity color: comes from TIERS in gameData.js automatically
//     (buildings/health bars/etc. already read tier colors generically).
//   - New draw layer (e.g. weather, screen-space UI): add a new
//     `draw<Thing>(ctx, ...)` method and call it from render() at the right
//     point in the layer order — order matters, later calls draw on top.
//   - New camera-shake or telegraph-warning trigger: call
//     `renderer.addShake(amount)` / emit a `'telegraph'` bus event (see
//     Game.js's bus.on('telegraph', ...) wiring) rather than touching this
//     file directly; addTelegraph()/the shake decay already handle the timing.
const { hexPath, clamp } = MOD_utils;
const { TIERS, tierIndex } = MOD_gameData;

const ENEMY_COLORS = {
  basic: '#c9553d', ranged: '#d98c3d', melee: '#c93d6a', special: '#7a3dc9',
};

class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.shake = 0;
    this.telegraphs = [];
    this.t = 0;
  }

  resize(w, h) {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    this.canvas.width = w * dpr;
    this.canvas.height = h * dpr;
    this.canvas.style.width = w + 'px';
    this.canvas.style.height = h + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.w = w; this.h = h;
  }

  addShake(amount) { this.shake = Math.min(24, this.shake + amount); }
  addTelegraph(t) { this.telegraphs.push({ ...t, elapsed: 0 }); }

  render(state, dt) {
    this.t += dt;
    const ctx = this.ctx;
    const { w, h } = this;
    this.shake = Math.max(0, this.shake - dt * 40);
    ctx.save();
    if (this.shake > 0.2) {
      ctx.translate((Math.random() - 0.5) * this.shake, (Math.random() - 0.5) * this.shake);
    }

    this.drawBackground(ctx, w, h);
    this.drawHexPlatforms(ctx, state.platforms);
    this.drawTelegraphs(ctx, dt);
    this.drawBuildings(ctx, state.buildings);
    this.drawLootPickups(ctx, state.pickups);
    this.drawEnemies(ctx, state.enemies);
    this.drawPlayer(ctx, state.player);
    this.drawProjectiles(ctx, state.projectiles);
    this.drawParticles(ctx, state.particles);
    this.drawDamageNumbers(ctx, state.dmgNumbers);
    ctx.restore();
  }

  drawBackground(ctx, w, h) {
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#0a0e1a');
    grad.addColorStop(1, '#0d1524');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // subtle grid
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.06)';
    ctx.lineWidth = 1;
    const grid = 48;
    const offset = (this.t * 8) % grid;
    for (let x = -grid; x < w + grid; x += grid) {
      ctx.beginPath(); ctx.moveTo(x + offset, 0); ctx.lineTo(x + offset, h); ctx.stroke();
    }
    for (let y = -grid; y < h + grid; y += grid) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    // vignette
    const rad = ctx.createRadialGradient(w / 2, h * 0.6, h * 0.2, w / 2, h * 0.6, h * 0.9);
    rad.addColorStop(0, 'rgba(0,0,0,0)');
    rad.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = rad;
    ctx.fillRect(0, 0, w, h);
  }

  drawHexPlatforms(ctx, platforms) {
    for (const plat of platforms) {
      hexPath(ctx, plat.x, plat.y, plat.size);
      ctx.fillStyle = plat.building ? 'rgba(56,189,248,0.08)' : 'rgba(255,255,255,0.03)';
      ctx.fill();
      ctx.strokeStyle = plat.building ? 'rgba(56,189,248,0.55)' : 'rgba(159,179,200,0.35)';
      ctx.lineWidth = 2;
      ctx.stroke();
      if (!plat.building) {
        ctx.fillStyle = 'rgba(159,179,200,0.5)';
        ctx.font = '11px "Rajdhani", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('+', plat.x, plat.y + 4);
      }
    }
  }

  drawTelegraphs(ctx, dt) {
    for (let i = this.telegraphs.length - 1; i >= 0; i--) {
      const t = this.telegraphs[i];
      t.elapsed += dt;
      const p = clamp(t.elapsed / t.time, 0, 1);
      ctx.save();
      ctx.globalAlpha = 0.55 * (1 - p * 0.3);
      if (t.radius) {
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.radius * (0.4 + p * 0.6), 0, Math.PI * 2);
        ctx.strokeStyle = '#ffb020';
        ctx.lineWidth = 3;
        ctx.stroke();
      } else if (t.target) {
        ctx.strokeStyle = t.wide ? 'rgba(255,70,85,0.8)' : 'rgba(255,176,32,0.8)';
        ctx.lineWidth = t.wide ? 10 : 2;
        ctx.setLineDash(t.wide ? [] : [6, 6]);
        ctx.beginPath();
        ctx.moveTo(t.x, t.y);
        ctx.lineTo(t.target.x, t.target.y);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.restore();
      if (t.elapsed >= t.time) this.telegraphs.splice(i, 1);
    }
  }

  drawBuildings(ctx, buildings) {
    for (const b of buildings) {
      if (!b || b.hp <= 0) continue;
      const catColor = { attack: '#ff8a3d', buff: '#b96bff', heal: '#3ddc84', material: '#ffd23d' }[b.def.category] || '#9fb3c8';
      ctx.save();
      ctx.translate(b.x, b.y);
      hexPath(ctx, 0, 0, b.radius);
      ctx.fillStyle = 'rgba(15,22,36,0.9)';
      ctx.fill();
      ctx.strokeStyle = catColor;
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.fillStyle = catColor;
      ctx.beginPath();
      ctx.arc(0, 0, b.radius * 0.38, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      this.drawHealthBar(ctx, b.x, b.y - b.radius - 10, 34, 4, b.hp / b.maxHp, catColor);
    }
  }

  drawLootPickups(ctx, pickups) {
    if (!pickups) return;
    for (const p of pickups) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(this.t * 2);
      ctx.fillStyle = p.color || '#ffd23d';
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        const a = (Math.PI / 2) * i;
        ctx.lineTo(Math.cos(a) * 6, Math.sin(a) * 6);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  drawEnemies(ctx, enemies) {
    for (const e of enemies) {
      if (e.dead) continue;
      const color = e.isElite ? (e.eliteMods[0]?.color || '#ffb020') : (ENEMY_COLORS[e.def.role] || '#c9553d');
      ctx.save();
      ctx.translate(e.x, e.y);
      if (e.isBoss) {
        this.drawBoss(ctx, e, color);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        if (e.isElite) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
        if (e.telegraphing) {
          ctx.strokeStyle = 'rgba(255,176,32,0.9)';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(0, 0, e.radius + 5 + Math.sin(this.t * 10) * 2, 0, Math.PI * 2); ctx.stroke();
        }
      }
      ctx.restore();
      if (!e.isBoss) this.drawHealthBar(ctx, e.x, e.y - e.radius - 8, 24, 3, e.hp / e.maxHp, '#ff4655');
      if (e.hasStatus && e.hasStatus('freeze')) this.statusRing(ctx, e, '#8be9ff');
      if (e.hasStatus && e.hasStatus('stun')) this.statusRing(ctx, e, '#ffd23d');
    }
  }

  statusRing(ctx, e, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.globalAlpha = 0.6;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.radius + 4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  drawBoss(ctx, e, color) {
    const pulse = 1 + Math.sin(this.t * 4) * 0.03;
    ctx.save();
    ctx.scale(pulse, pulse);
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (Math.PI * 2 / 8) * i + this.t * 0.3;
      const r = e.radius * (i % 2 === 0 ? 1 : 0.75);
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = e.major ? '#ffd23d' : '#fff';
    ctx.lineWidth = e.major ? 4 : 2;
    ctx.stroke();
    ctx.restore();
  }

  drawPlayer(ctx, p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.aimAngle + Math.PI / 2);
    ctx.beginPath();
    ctx.moveTo(0, -p.radius);
    ctx.lineTo(p.radius * 0.8, p.radius * 0.7);
    ctx.lineTo(0, p.radius * 0.3);
    ctx.lineTo(-p.radius * 0.8, p.radius * 0.7);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, -p.radius, 0, p.radius);
    grad.addColorStop(0, '#38bdf8');
    grad.addColorStop(1, '#1a4d73');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#e0f7ff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    if (p.shield > 0) {
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = '#8be9ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius + 8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  drawProjectiles(ctx, projectiles) {
    for (const pr of projectiles) {
      if (pr.dead) continue;
      const colorMap = {
        bullet: '#ffe9a8', pellet: '#ffe9a8', beam: '#8be9ff', rail: '#c8f7ff', plasma: '#9dfcc0',
        rocket: '#ff8a3d', blade: '#e8e8e8', saw: '#c9c9c9', lance: '#ffd23d', flare: '#ff8a3d',
        railshot: '#ff4655', buildingBolt: '#38bdf8',
      };
      const color = pr.owner === 'enemy' ? '#ff4655' : (colorMap[pr.visual] || '#38bdf8');
      ctx.save();
      ctx.translate(pr.x, pr.y);
      ctx.rotate(pr.angle);
      ctx.fillStyle = color;
      if (pr.visual === 'beam' || pr.visual === 'rail' || pr.visual === 'lance') {
        ctx.fillRect(-14, -1.5, 28, 3);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, pr.radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  drawParticles(ctx, particles) {
    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  drawDamageNumbers(ctx, nums) {
    for (const d of nums) {
      ctx.save();
      ctx.globalAlpha = clamp(d.life / d.maxLife, 0, 1);
      ctx.fillStyle = d.crit ? '#ffd23d' : d.color;
      ctx.font = d.crit ? 'bold 18px "Rajdhani", sans-serif' : '13px "Rajdhani", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(d.text || d.amount, d.x, d.y);
      ctx.restore();
    }
  }

  drawHealthBar(ctx, cx, y, width, height, pct, color) {
    pct = clamp(pct, 0, 1);
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(cx - width / 2, y, width, height);
    ctx.fillStyle = color;
    ctx.fillRect(cx - width / 2, y, width * pct, height);
    ctx.restore();
  }
}

return { Renderer };
})();

/* ---------- js/core/Game.js ---------- */
const MOD_Game = (function () {
// js/core/Game.js
// The main loop and the owner of all live gameplay state (player, enemies,
// projectiles, buildings, pickups). Every other gameplay file is a stateless
// (or self-contained) helper that Game.js calls into each frame — this file
// is where their outputs get wired together and where save data becomes
// live entities and back again.
//
// HOW TO EXTEND THIS FILE
//   - Frame order matters: update() runs status/regen -> spawning ->
//     enemies -> buildings -> player combat -> projectiles -> hit
//     resolution -> resolveDeaths() -> pickups -> particles/fx -> cleanup().
//     If you add a new per-frame system, insert its call in the spot that
//     makes sense (e.g. anything that can kill an enemy should run BEFORE
//     resolveDeaths(), which must stay the single place death is resolved —
//     see the note in entities.js).
//   - New event the UI/renderer should react to: `this.bus.emit('yourEvent',
//     payload)` from wherever it happens, then listen for it either in the
//     constructor here (for engine-side reactions like screen shake) or in
//     UIManager's constructor (for UI reactions like toasts).
//   - New per-run stat: add a field to freshRunStats(), update it wherever
//     the relevant thing happens, and it'll show up in showDeathScreen()
//     automatically once you also add a row for it in UIManager.js.
//   - New permanent-unlock reward on death: see onPlayerDeath() below.
const { EventBus, dist, angleTo, clamp, lerp, choice, uid, randRange } = MOD_utils;
const { Renderer } = MOD_Renderer;
const { Player, Enemy, Boss, Projectile, Building } = MOD_entities;
const { CollisionSystem, ParticleSystem, DamageNumberSystem, LootSystem } = MOD_systems;
const { computeStats, upgradeCost } = MOD_progression;
const { fireWeapon, resolveChain, executeAbility, updateBuilding, getBuildingBuffs } = MOD_combat;
const { StageManager, isMajorBossStage, difficultyScale } = MOD_StageManager;
const { EnemyManager } = MOD_EnemyManager;
const SaveSystem = MOD_SaveSystem;
const {
  WEAPONS, ARMOR, BUILDINGS, ABILITIES, ENEMIES, BOSSES, MATERIALS, DUNGEONS, EQUIPMENT,
  getById, TIERS, tierIndex, nextTier, MAX_PLATFORM_SLOTS, platformSlotCost, BUFFS, DUNGEON_TIERS,
} = MOD_gameData;

// Dungeons are endless endurance trials (see the DUNGEONS header comment in
// gameData.js): their invincible boss is present from the very start, so
// there's no "climax spawn" delay any more.

// "Fleet" fodder that continuously escorts ANY active boss (main-stage or a
// dungeon's climax boss) — see Game.updateBossFleet(). Deliberately the
// weakest, most basic enemies: the boss is the real threat here, this is
// just a relentless stream of chip damage and visual chaos so the fight
// never fully quiets down until the boss itself dies.
const FLEET_ENEMY_IDS = ['e_walker', 'e_runner', 'e_swarm'];
const FLEET_SPAWN_INTERVAL = [1.0, 1.8]; // seconds, randomized each spawn
const FLEET_SOFT_CAP = 30; // skip a spawn (not the timer) if the field's already this crowded with non-boss enemies

// Arranges N hex build platforms in a fan above the player — used both for
// the initial 4 and for however many expandPlatforms() has unlocked since
// (up to MAX_PLATFORM_SLOTS). Radius grows slightly with count so added
// platforms don't crowd the original four, but is capped by `maxRadius`
// (the caller passes battlefield width so it never fans wider than the
// screen — without that cap the outer platforms on an 8-slot base run off
// a narrow phone screen entirely).
function platformOffsets(count, maxRadius = 220) {
  const radius = Math.min(150 + Math.max(0, count - 4) * 16, maxRadius);
  const startAngle = -Math.PI * 0.90, endAngle = -Math.PI * 0.10;
  const offsets = [];
  for (let i = 0; i < count; i++) {
    const t = count === 1 ? 0.5 : i / (count - 1);
    const angle = startAngle + (endAngle - startAngle) * t;
    offsets.push({ x: Math.cos(angle) * radius, y: Math.sin(angle) * radius * 0.5 });
  }
  return offsets;
}

class Game {
  constructor(canvas) {
    this.bus = new EventBus();
    this.renderer = new Renderer(canvas);
    this.collision = new CollisionSystem();
    this.particles = new ParticleSystem(500);
    this.dmgNumbers = new DamageNumberSystem();
    this.enemyManager = new EnemyManager();
    this.stageManager = new StageManager(this.bus);

    this.save = SaveSystem.load();
    this.player = null;
    this.enemies = [];
    this.projectiles = [];
    this.buildings = []; // sized to save.meta.platformSlots by layoutPlatforms() below
    this.pickups = [];
    this.platforms = [];
    this.aimPoint = null;
    this.priorityTarget = null;
    this.priorityTimer = 0;

    this.mode = 'stage'; // 'stage' | 'dungeon'
    this.dungeonCtx = null;
    this.running = false;
    this.lastTime = 0;
    this.autosaveTimer = 5;
    this.fleetSpawnTimer = 0; // see updateBossFleet()

    this.runStats = this.freshRunStats();
    this.onStateChange = null; // UIManager hooks in

    this.bus.on('waveStart', (d) => { this.notify(`Wave ${d.wave} incoming`); this.saveRunProgress(d.stage, d.wave); });
    this.bus.on('stageStart', (d) => { this.notify(`Stage ${d.stage}`); this.saveRunProgress(d.stage, 1); });
    this.bus.on('stageComplete', (d) => { this.notify(`Stage ${d.stage} cleared!`); });
    this.bus.on('bossStart', (d) => this.startBossFight(d));
    this.bus.on('bossPhase', () => { this.renderer.addShake(10); this.notify('Boss phase shift!'); });
    this.bus.on('telegraph', (t) => this.renderer.addTelegraph(t));
    this.bus.on('shake', (s) => this.renderer.addShake(s.amount));
    this.bus.on('gravityWell', (g) => this.applyGravityWell(g));

    this.buildPlayer();
    this.layoutPlatforms();
    this.restoreRunProgress();
  }

  freshRunStats() {
    return { stageReached: 1, highestWave: 1, enemiesDefeated: 0, bossesDefeated: 0, damageDealt: 0, damageReceived: 0, materialsEarned: 0, xpEarned: 0, lootObtained: 0, timeSurvived: 0 };
  }

  notify(msg) { this.bus.emit('toast', msg); }

  buildPlayer() {
    const stats = computeStats(this.save);
    const w = this.renderer.w || 400, h = this.renderer.h || 600;
    this.player = new Player(w / 2, h - 150, stats);
    this.player.level = this.save.character.level;
    this.player.xp = this.save.character.xp;
    this.player.upgradePoints = this.save.character.upgradePoints;
    this.player.hp = stats.maxHp;
    this.player.resource = stats.maxResource;
  }

  layoutPlatforms() {
    const p = this.player;
    const count = this.save.meta.platformSlots || 4;
    // In case an old save's loadout array is shorter than its unlocked
    // slot count (shouldn't normally happen, but keeps the two in sync).
    while (this.save.loadout.buildings.length < count) this.save.loadout.buildings.push(null);
    const offsets = platformOffsets(count, (this.renderer.w || 420) / 2 - 60);
    this.platforms = offsets.map((o, i) => ({ idx: i, x: p.x + o.x, y: p.y + o.y, size: 34, building: null }));
    this.buildings = new Array(count).fill(null);
    // restore buildings from loadout
    this.save.loadout.buildings.forEach((defId, i) => {
      if (defId) this.placeBuilding(i, defId, false);
    });
  }

  resize(w, h) {
    this.renderer.resize(w, h);
    if (this.player) {
      this.player.x = w / 2; this.player.y = h - 150;
      this.layoutPlatformsOnly();
    }
  }
  // Repositions existing platforms/buildings around the player's current
  // spot (resize) and grows the arrays if the unlocked slot count has
  // increased since they were last built (expandPlatforms()) — but never
  // touches save.loadout or re-runs placement, so it's safe to call anytime
  // without accidentally re-triggering material costs. layoutPlatforms()
  // (above) is the one that restores from save on a fresh build/retry.
  layoutPlatformsOnly() {
    const p = this.player;
    const count = this.save.meta.platformSlots || 4;
    const offsets = platformOffsets(count, (this.renderer.w || 420) / 2 - 60);
    while (this.platforms.length < count) {
      const i = this.platforms.length;
      this.platforms.push({ idx: i, x: p.x, y: p.y, size: 34, building: null });
      this.buildings.push(null);
    }
    this.platforms.forEach((plat, i) => { plat.x = p.x + offsets[i].x; plat.y = p.y + offsets[i].y; });
    for (const b of this.buildings) if (b) { b.x = this.platforms[b.platformIdx].x; b.y = this.platforms[b.platformIdx].y; }
  }

  // Permanent (cross-run) base upgrade: unlocks one more hex build platform
  // for Cores, the currency earned on death. Returns false without effect
  // if already at MAX_PLATFORM_SLOTS or the player can't afford it.
  expandPlatforms() {
    const current = this.save.meta.platformSlots;
    if (current >= MAX_PLATFORM_SLOTS) return false;
    const cost = platformSlotCost(current);
    if (this.save.meta.cores < cost) return false;
    this.save.meta.cores -= cost;
    this.save.meta.platformSlots++;
    this.save.loadout.buildings.push(null);
    this.layoutPlatformsOnly();
    this.persist();
    return true;
  }

  start() {
    this.running = true;
    this.lastTime = performance.now();
    requestAnimationFrame(this.loop.bind(this));
  }

  loop(now) {
    if (!this.running) return;
    const dt = Math.min(0.05, (now - this.lastTime) / 1000);
    this.lastTime = now;
    this.update(dt);
    this.draw(dt);
    requestAnimationFrame(this.loop.bind(this));
  }

  // ------------------------------------------------------------------
  // One frame, in order. If you add a new system that can damage/kill
  // enemies, call it BEFORE resolveDeaths() so its kills get processed in
  // the same frame; if it can damage the player, call it before the final
  // `if (this.player.hp <= 0)` check below so death is caught the same frame.
  update(dt) {
    if (this.player.hp <= 0) return; // frozen on death screen
    this.runStats.timeSurvived += dt;
    this.priorityTimer -= dt;
    if (this.priorityTimer <= 0) this.priorityTarget = null;

    this.updateStatusAndRegen(dt);
    this.updateActiveBuffs(dt);
    this.updateSpawning(dt);
    this.updateEnemies(dt);
    this.updateBossFleet(dt);
    this.updateBuildings(dt);
    this.updatePlayerCombat(dt);
    this.updateProjectiles(dt);
    this.resolveProjectileHits();
    this.resolveDeaths();
    this.updatePickups(dt);
    this.particles.update(dt);
    this.dmgNumbers.update(dt);
    this.cleanup();

    this.autosaveTimer -= dt;
    if (this.autosaveTimer <= 0) { this.autosaveTimer = 8; this.persist(); }

    if (this.player.hp <= 0) {
      if (this.mode === 'dungeon') this.onDungeonFailure();
      else this.onPlayerDeath();
    }
  }

  updateStatusAndRegen(dt) {
    const p = this.player;
    p.updateStatus(dt);
    const berserk = p.statusEffects.find(s => s.type === 'berserk');
    p.hp = clamp(p.hp + p.stats.regen * dt, 0, p.stats.maxHp);
    p.resource = clamp(p.resource + 6 * dt, 0, p.stats.maxResource);
    for (const key of Object.keys(p.abilityCooldowns)) {
      p.abilityCooldowns[key] = Math.max(0, p.abilityCooldowns[key] - dt);
    }
    this._berserk = berserk;
    this._rapidfire = p.statusEffects.find(s => s.type === 'rapidfire');
  }

  // Ticks down save.activeBuffs (bought with Gems — see buyBuff() below)
  // in real gameplay seconds and drops any that expire. Recomputes
  // player.stats whenever the set of running buffs actually changes so
  // an expiring buff's bonus disappears immediately rather than lingering
  // until some unrelated stat recompute happens to fire.
  updateActiveBuffs(dt) {
    const buffs = this.save.activeBuffs;
    let changed = false;
    for (const id of Object.keys(buffs)) {
      buffs[id] -= dt;
      if (buffs[id] <= 0) { delete buffs[id]; changed = true; }
    }
    if (changed) { this.player.stats = computeStats(this.save); this.persist(); }
  }

  updateSpawning(dt) {
    if (this.mode === 'dungeon') { this.updateDungeonSpawning(dt); return; }
    const spawns = this.stageManager.update(dt);
    for (const s of spawns) this.spawnEnemyInstance(s.def, s.scale);
  }

  // Dungeons are ENDLESS endurance trials (see the DUNGEONS header comment
  // in gameData.js): minions from `def.enemyPool` spawn forever at an
  // ever-increasing rate/strength, alongside an invincible boss spawned up
  // front by enterDungeon(). There is no timer and no clear — the run ends
  // only when the player dies, and how long they lasted (ctx.elapsed) is
  // what determines the reward tier in completeDungeon().
  // Difficulty keeps climbing past `rampSeconds` rather than plateauing, so
  // every attempt eventually ends; the question is how deep you got.
  updateDungeonSpawning(dt) {
    const ctx = this.dungeonCtx;
    ctx.elapsed += dt;
    const ramp = clamp(ctx.elapsed / (ctx.def.rampSeconds || 150), 0, 1);
    // Past full ramp, keep scaling slowly and without bound so the trial
    // always terminates eventually.
    const overtime = Math.max(0, ctx.elapsed - (ctx.def.rampSeconds || 150)) / 120;

    ctx.spawnTimer -= dt;
    if (ctx.spawnTimer <= 0) {
      ctx.spawnTimer = Math.max(0.12, lerp(1.1, 0.3, ramp) - overtime * 0.05);
      const enemyDef = getById(ENEMIES, choice(ctx.def.enemyPool));
      const scale = {
        hp: 1 + ramp * 2.2 + overtime * 1.5,
        dmg: 1 + ramp * 1.0 + overtime * 0.6,
        speed: 1 + ramp * 0.35,
        atkCdMult: 1, xpMult: 1,
      };
      this.spawnEnemyInstance(enemyDef, scale);
    }
  }

  // Which DUNGEON_TIERS entry the current attempt has reached — the deepest
  // one whose `atSeconds` the player has survived past. Used for the live
  // HUD readout and for the final reward multiplier.
  dungeonProgressTier(seconds) {
    let tier = DUNGEON_TIERS[0];
    for (const t of DUNGEON_TIERS) if (seconds >= t.atSeconds) tier = t;
    return tier;
  }


  spawnEnemyInstance(def, scale, atX = null, atY = null) {
    const w = this.renderer.w, h = this.renderer.h;
    let x, y;
    if (atX !== null) { x = atX; y = atY; }
    else {
      const side = Math.random();
      if (side < 0.6) { x = randRange(20, w - 20); y = -30; }
      else if (side < 0.8) { x = -30; y = randRange(h * 0.15, h * 0.6); }
      else { x = w + 30; y = randRange(h * 0.15, h * 0.6); }
    }
    const e = this.enemyManager.spawnEnemy(def, scale, x, y);
    this.enemies.push(e);
    return e;
  }

  spawnBossInstance(bossDef, scale) {
    const w = this.renderer.w;
    // Bosses are stationary (see the BOSSES header comment in gameData.js)
    // and never reposition, so they need to spawn within actual engagement
    // range of the (also-stationary) player — spawning at the very top of
    // the screen like a regular enemy would put them permanently out of
    // range of the starting weapon (420) and most turrets, making the
    // fight literally unwinnable by normal fire. 240px keeps it well
    // inside the starter weapon's range with buffer for turrets on hex
    // platforms (offset from the player, so their effective distance to
    // the boss is a bit more than the player's own).
    const y = clamp(this.player.y - 240, 60, this.renderer.h - 60);
    const boss = new Boss(bossDef, w / 2, y, scale);
    this.enemies.push(boss);
    return boss;
  }

  startBossFight(d) {
    const bossDef = this.stageManager.pickBossDef();
    const scale = this.stageManager.buildSpawnScale([]);
    const boss = this.spawnBossInstance(bossDef, scale);
    this.activeBoss = boss;
    this.notify(`${d.major ? 'MAJOR BOSS' : 'BOSS'}: ${bossDef.name}`);
  }

  enemyCtx() {
    return {
      player: this.player, enemies: this.enemies, buildings: this.buildings.filter(Boolean),
      spawnProjectile: (proj) => this.projectiles.push(proj),
      particles: this.particles, dmgNumbers: this.dmgNumbers,
      spawnEnemyAt: (def, x, y, scale) => this.spawnEnemyInstance(def, scale, clamp(x, 10, this.renderer.w - 10), clamp(y, 10, this.renderer.h - 10)),
      bus: this.bus, w: this.renderer.w, h: this.renderer.h,
      onPlayerDamaged: (dealt) => { this.runStats.damageReceived += dealt; },
    };
  }

  updateEnemies(dt) {
    const ctx = this.enemyCtx();
    for (const e of this.enemies) {
      if (e.dead) continue;
      this.enemyManager.updateEnemy(e, dt, ctx);
      if (e.isBoss && e.hp <= 0) this.onBossDefeated(e);
      else if (!e.isBoss && e.hp <= 0) this.onEnemyDefeated(e);
    }
  }

  // While ANY boss is alive on the field (main-stage or a dungeon's climax
  // boss — this just checks this.enemies, not which mode triggered it), a
  // steady trickle of weak FLEET_ENEMY_IDS spawns alongside it so the fight
  // never fully quiets down until the boss itself dies. Scaled off the
  // current stage (or a flat low scale in dungeon mode, which has no stage
  // number of its own) but deliberately toned down — these are meant to be
  // numerous chip damage, not a real threat on their own.
  updateBossFleet(dt) {
    const bossAlive = this.enemies.some(e => e.isBoss && !e.dead);
    if (!bossAlive) { this.fleetSpawnTimer = 0; return; }
    this.fleetSpawnTimer -= dt;
    if (this.fleetSpawnTimer > 0) return;
    this.fleetSpawnTimer = randRange(FLEET_SPAWN_INTERVAL[0], FLEET_SPAWN_INTERVAL[1]);
    if (this.enemies.filter(e => !e.isBoss).length >= FLEET_SOFT_CAP) return; // too crowded — try again next timer
    const def = getById(ENEMIES, choice(FLEET_ENEMY_IDS));
    const base = difficultyScale(this.mode === 'dungeon' ? 1 : this.stageManager.stage);
    const scale = { hp: Math.max(1, base.hp * 0.5), dmg: Math.max(1, base.dmg * 0.6), speed: base.speed, atkCdMult: 1, xpMult: 0.5 };
    this.spawnEnemyInstance(def, scale);
  }

  // Player XP/level/upgradePoints live on `this.player` during a run (see
  // Player.gainXp() in entities.js); this copies the current values into
  // `save.character` so they're correct for autosave/death and so any UI
  // reading save data (rather than the live player object) stays current.
  // Call this any time gainXp() runs, not just at death.
  syncCharacterToSave() {
    this.save.character.level = this.player.level;
    this.save.character.xp = this.player.xp;
    this.save.character.upgradePoints = this.player.upgradePoints;
  }

  // Spends upgrade points to raise a stat one rank. The cost scales with
  // that stat's current level via upgradeCost() (js/systems/progression.js)
  // and is computed HERE rather than passed in, so the UI can't charge a
  // stale price if its rendered label is out of date. Mutates the live
  // player object (the source of truth during a run) and mirrors the
  // result into save data. Returns false without effect if unaffordable.
  spendUpgradePoint(key) {
    const currentLevel = this.save.character.upgrades[key] || 0;
    const cost = upgradeCost(key, currentLevel);
    if (this.player.upgradePoints < cost) return false;
    this.player.upgradePoints -= cost;
    this.save.character.upgrades[key] = currentLevel + 1;
    this.syncCharacterToSave();
    this.player.stats = computeStats(this.save);
    this.persist();
    return true;
  }

  onEnemyDefeated(e) {
    e.dead = true;
    this.enemyManager.onDeath(e, this.enemyCtx());
    // Dungeon-swarm kills don't belong to the main endless run's wave —
    // only tell the StageManager about kills happening in 'stage' mode.
    if (this.mode !== 'dungeon') this.stageManager.notifyEnemyDied();
    this.runStats.enemiesDefeated++;
    const leveled = this.player.gainXp(e.xp);
    this.runStats.xpEarned += e.xp;
    if (leveled) { this.notify(`Level up! Lv.${this.player.level}`); this.syncCharacterToSave(); }
    const luck = this.player.stats.lootChance || 0;
    const drops = LootSystem.rollMaterials(e.def.loot || [], luck);
    for (const [matId, count] of Object.entries(drops)) {
      this.addMaterial(matId, count);
      this.runStats.materialsEarned += count;
    }
    const tier = LootSystem.rollEquipmentTier(0.015, luck * 0.05);
    if (tier) this.dropRandomEquipment(tier, e.x, e.y);
    if (Math.random() < 0.01 + luck * 0.01) this.unlockRandomBuilding();
    this.particles.emit(e.x, e.y, { color: '#ff8a3d', count: 8, life: 0.35 });
  }

  onBossDefeated(boss) {
    boss.dead = true;
    this.runStats.bossesDefeated++;
    this.player.gainXp(boss.xp);
    this.syncCharacterToSave();
    for (const matId of (boss.def?.loot || [])) this.addMaterial(matId, Math.ceil(randRange(3, 7)));
    const tier = LootSystem.rollEquipmentTier(0.35, 0.1) || 'rare';
    this.dropRandomEquipment(tier, boss.x, boss.y);
    if (Math.random() < 0.6) this.unlockRandomBuilding();
    this.renderer.addShake(18);
    this.notify(`${boss.def?.name || 'Boss'} defeated!`);
    // In dungeon mode a boss kill is just a bonus (the loot above) — the
    // swarm keeps going and the trial only ends via its 60s timer or an
    // early death (see updateDungeonSpawning()/onDungeonFailure()).
    if (this.mode !== 'dungeon') this.stageManager.notifyBossDefeated();
  }

  // Picks a random equipment SLOT first (main/secondary/helmet/armor/
  // gloves/boots/accessory), then a random item within that slot — rather
  // than picking uniformly across all of EQUIPMENT. Main weapons outnumber
  // every other slot (31 of 76 pieces), so a flat pick over the whole list
  // made helmets/accessories feel like they almost never dropped even
  // though they were technically possible; weighting by slot instead gives
  // every gear category a roughly equal shot regardless of how many items
  // happen to exist in it.
  dropRandomEquipment(tier, x, y) {
    const slots = [...new Set(EQUIPMENT.map(e => e.slot))];
    const slot = choice(slots);
    const pool = EQUIPMENT.filter(e => e.slot === slot);
    const def = choice(pool);
    const item = { uid: uid('item'), defId: def.id, kind: WEAPONS.includes(def) ? 'weapon' : 'armor', tier, level: 1 };
    this.save.inventory.items.push(item);
    this.recordLedger(def.id, tier);
    this.runStats.lootObtained++;
    this.notify(`Loot: ${TIERS[tierIndex(tier)].name} ${def.name}`);
    if (this.onStateChange) this.onStateChange('loot', item);
  }

  // Permanent "collection log" entry — see the comment on save.ledger in
  // SaveSystem.defaultSave(). Called from dropRandomEquipment() above and
  // from UIManager.craftItem() (the two places a WEAPONS/ARMOR item is ever
  // created); keeps the best tier seen, never downgrades it.
  recordLedger(defId, tier) {
    const existing = this.save.ledger.equipment[defId];
    if (!existing || tierIndex(tier) > tierIndex(existing)) {
      this.save.ledger.equipment[defId] = tier;
    }
  }

  // --- Buffs (spent from Gems) ---------------------------------------------
  buyBuff(buffId) {
    const buff = getById(BUFFS, buffId);
    if (!buff) return false;
    if (this.save.meta.gems < buff.cost) return false;
    this.save.meta.gems -= buff.cost;
    this.save.activeBuffs[buffId] = (this.save.activeBuffs[buffId] || 0) + buff.duration;
    this.player.stats = computeStats(this.save);
    this.persist();
    return true;
  }

  // --- Full reset ("restart my game") --------------------------------------
  // Wipes the save entirely and reloads — simplest way to guarantee every
  // piece of in-memory state (platforms, buildings, stats, run progress...)
  // ends up truly fresh rather than trying to manually reset each one.
  hardReset() {
    SaveSystem.wipe();
    window.location.reload();
  }

  addMaterial(id, amount) {
    this.save.inventory.materials[id] = (this.save.inventory.materials[id] || 0) + amount;
  }

  updateBuildings(dt) {
    const ctx = {
      player: this.player, collision: this.collision, enemies: this.enemies,
      buildings: this.buildings.filter(Boolean),
      spawnProjectile: (proj) => this.projectiles.push(proj),
      addMaterial: (id, amt) => this.addMaterial(id, amt),
    };
    this.collision.rebuild(this.enemies);
    for (const b of this.buildings) if (b) updateBuilding(b, dt, ctx);
  }

  updatePlayerCombat(dt) {
    const p = this.player;
    this.collision.rebuild(this.enemies);
    let target = this.priorityTarget && !this.priorityTarget.dead ? this.priorityTarget : null;
    const mainWeapon = getById(WEAPONS, this.save.loadout.main);
    const range = (mainWeapon ? mainWeapon.range : 400) * p.stats.range;
    if (!target) target = this.collision.findNearestEnemy(p.x, p.y, range, this.enemies);
    if (target) p.aimAngle = angleTo(p.x, p.y, target.x, target.y);

    const buffs = getBuildingBuffs(this.buildings.filter(Boolean), p.x, p.y);
    const rapidMult = this._rapidfire ? this._rapidfire.fireRateMult : 1;
    const berserkAtk = this._berserk ? this._berserk.atkMult : 1;

    p.fireCooldown -= dt;
    if (target && mainWeapon && p.fireCooldown <= 0) {
      const fireRate = mainWeapon.fireRate * p.stats.fireRate * (1 + (buffs.fireRatePct || 0)) * rapidMult;
      p.fireCooldown = 1 / Math.max(0.1, fireRate);
      const effWeapon = { ...mainWeapon, damage: mainWeapon.damage * berserkAtk * (1 + (buffs.atkPct || 0)) };
      const item = this.save.inventory.items.find(i => i.uid === this.save.loadout.mainItemUid);
      const level = item ? item.level : 1;
      if (mainWeapon.behavior === 'chain') {
        resolveChain(p, target, effWeapon, effWeapon.damage * (p.stats.atk / 8), p.stats.crit + (buffs.critPct || 0), p.stats.critMult + (buffs.critMultPct || 0),
          { collision: this.collision, dmgNumbers: this.dmgNumbers, particles: this.particles });
      } else {
        fireWeapon(effWeapon, mainWeapon.tier, level, p, target, { spawnProjectile: (proj) => this.projectiles.push(proj) });
      }
    }

    const secWeapon = getById(WEAPONS, this.save.loadout.secondary);
    p.secondaryCooldown -= dt;
    if (target && secWeapon && p.secondaryCooldown <= 0 && dist(p.x, p.y, target.x, target.y) <= secWeapon.range) {
      p.secondaryCooldown = 1 / Math.max(0.1, secWeapon.fireRate * p.stats.fireRate * 0.6);
      fireWeapon(secWeapon, secWeapon.tier, 1, p, target, { spawnProjectile: (proj) => this.projectiles.push(proj) });
    }
  }

  updateProjectiles(dt) {
    for (const pr of this.projectiles) {
      if (pr.dead) continue;
      pr.update(dt);
      if (pr.x < -60 || pr.x > this.renderer.w + 60 || pr.y < -60 || pr.y > this.renderer.h + 60) pr.dead = true;
    }
  }

  resolveProjectileHits() {
    this.collision.rebuild(this.enemies);
    // player-owned projectiles vs enemies
    const hits = this.collision.checkProjectileHits(this.projectiles, this.enemies);
    const splashApplied = new Set();
    for (const { proj, enemy } of hits) {
      // Invincible dungeon bosses (see enterDungeon()) absorb hits without
      // taking damage — the projectile is still consumed and shows an
      // "IMMUNE" marker so it reads as deliberate rather than broken.
      if (enemy.invincible) {
        proj.hitIds.add(enemy.id);
        this.dmgNumbers.add(enemy.x, enemy.y - 16, 0, { color: '#9fb3c8', text: 'IMMUNE' });
        this.particles.emit(enemy.x, enemy.y, { color: '#9fb3c8', count: 3 });
        if (proj.pierce > 0) proj.pierce--; else proj.dead = true;
        continue;
      }
      const dealt = enemy.takeDamage(proj.damage, proj.dmgType);
      this.runStats.damageDealt += dealt;
      this.dmgNumbers.add(enemy.x, enemy.y - 16, dealt, { crit: proj.crit, color: proj.crit ? '#ffd23d' : '#38bdf8' });
      this.particles.emit(enemy.x, enemy.y, { color: proj.crit ? '#ffd23d' : '#38bdf8', count: proj.crit ? 10 : 4 });
      proj.hitIds.add(enemy.id);
      if (proj.splash > 0 && !splashApplied.has(proj.id)) {
        splashApplied.add(proj.id);
        for (const other of this.collision.enemiesInRadius(enemy.x, enemy.y, proj.splash)) {
          if (other.id === enemy.id) continue;
          const falloff = 1 - (dist(enemy.x, enemy.y, other.x, other.y) / proj.splash) * (proj.splashFalloff || 0.5);
          const splashDealt = other.takeDamage(proj.damage * clamp(falloff, 0.2, 1), proj.dmgType);
          this.runStats.damageDealt += splashDealt;
          this.dmgNumbers.add(other.x, other.y - 16, splashDealt, { color: '#ff8a3d' });
        }
        this.particles.emit(enemy.x, enemy.y, { color: '#ff8a3d', count: 14, life: 0.4 });
      }
      if (proj.pierce > 0) { proj.pierce--; } else { proj.dead = true; }
      if (enemy.hp <= 0 && !enemy.dead) {
        if (enemy.isBoss) this.onBossDefeated(enemy); else this.onEnemyDefeated(enemy);
      }
    }

    // enemy-owned projectiles vs player
    for (const pr of this.projectiles) {
      if (pr.dead || pr.owner !== 'enemy') continue;
      if (dist(pr.x, pr.y, this.player.x, this.player.y) <= this.player.radius + pr.radius) {
        const dealt = this.player.takeDamage(pr.damage, pr.dmgType);
        this.runStats.damageReceived += dealt;
        this.dmgNumbers.add(this.player.x, this.player.y - 20, dealt, { color: '#ff4655' });
        this.particles.emit(this.player.x, this.player.y, { color: '#ff4655', count: 8 });
        if (pr.splash > 0) {
          for (const e of []) {} // player splash is single-target; enemies don't splash onto themselves
        }
        if (pr.pierce > 0) pr.pierce--; else pr.dead = true;
      }
    }
  }

  updatePickups(dt) {
    for (const pk of this.pickups) {
      const d = dist(pk.x, pk.y, this.player.x, this.player.y);
      if (d < 140) {
        const ang = angleTo(pk.x, pk.y, this.player.x, this.player.y);
        pk.x += Math.cos(ang) * 260 * dt; pk.y += Math.sin(ang) * 260 * dt;
      }
      if (d < 18) pk.dead = true;
    }
    this.pickups = this.pickups.filter(p => !p.dead);
  }

  applyGravityWell(g) {
    for (const e of this.collision.enemiesInRadius(g.x, g.y, g.radius)) {
      const ang = angleTo(e.x, e.y, g.x, g.y);
      e.x += Math.cos(ang) * g.pull * 0.15; e.y += Math.sin(ang) * g.pull * 0.15;
    }
  }

  // Single source of truth for enemy death: whatever dealt the killing blow
  // (a direct hit, splash, chain lightning, an ability, a building turret),
  // this is the one place that decides an enemy is actually gone — it
  // grants XP/loot, updates run stats, and tells the StageManager so waves
  // can complete. Entities never flag themselves dead from takeDamage().
  resolveDeaths() {
    for (const e of this.enemies) {
      // Invincible dungeon bosses can never die, no matter what route the
      // damage took (splash, abilities, chain lightning) — belt-and-braces
      // alongside the direct-hit guard in resolveProjectileHits().
      if (e.invincible) { e.hp = e.maxHp; continue; }
      if (e.dead || e.hp > 0) continue;
      if (e.isBoss) this.onBossDefeated(e); else this.onEnemyDefeated(e);
    }
  }

  cleanup() {
    this.enemies = this.enemies.filter(e => !e.dead || e === this.activeBoss && false);
    this.enemies = this.enemies.filter(e => !e.dead);
    this.projectiles = this.projectiles.filter(p => !p.dead);
  }

  // --- Buildings placement -------------------------------------------
  // Called by UIManager when the player taps an empty platform and picks a
  // building. Add a new building by adding it to BUILDINGS (gameData.js);
  // new content is discovered via unlockRandomBuilding() below, not
  // auto-added to `unlocked.buildings` for everyone — see that method for
  // how "unlockables" grow over a run.
  // `persist=true` (a real player choice) checks/deducts def.cost in
  // materials; `persist=false` (restoring already-owned placements from
  // save on game start/retry) never charges anything. Returns false without
  // effect if the def is missing or the player can't afford the cost, so
  // UIManager can leave the build modal open rather than silently no-op.
  placeBuilding(platformIdx, buildingDefId, persist = true) {
    const def = getById(BUILDINGS, buildingDefId);
    if (!def) return false;
    if (persist && def.cost) {
      const mats = this.save.inventory.materials;
      const canAfford = Object.entries(def.cost).every(([id, amt]) => (mats[id] || 0) >= amt);
      if (!canAfford) { this.notify('Not enough materials'); return false; }
      for (const [id, amt] of Object.entries(def.cost)) mats[id] -= amt;
    }
    const plat = this.platforms[platformIdx];
    const b = new Building(def, platformIdx, plat.x, plat.y, def.tier);
    this.buildings[platformIdx] = b;
    plat.building = b;
    if (persist) { this.save.loadout.buildings[platformIdx] = buildingDefId; this.persist(); }
    return true;
  }
  removeBuilding(platformIdx) {
    this.buildings[platformIdx] = null;
    this.platforms[platformIdx].building = null;
    this.save.loadout.buildings[platformIdx] = null;
    this.persist();
  }

  // Discovering new buildings: a small chance per regular kill, and a
  // (near-)guaranteed chance per boss kill, to unlock one random building
  // the player doesn't have yet — mirrors dropRandomEquipment() but for
  // BUILDINGS instead of EQUIPMENT. This is what makes the 50+ generated
  // buildings in gameData.js actually reachable over the course of play.
  unlockRandomBuilding() {
    const locked = BUILDINGS.filter(b => !this.save.unlocked.buildings.includes(b.id));
    if (!locked.length) return;
    const def = locked[Math.floor(Math.random() * locked.length)];
    this.save.unlocked.buildings.push(def.id);
    this.notify(`Blueprint unlocked: ${def.name}`);
  }

  // --- Abilities --------------------------------------------------------
  // Called by UIManager when an ability button is tapped. The actual effect
  // logic lives in executeAbility() (js/systems/combat.js) — this method
  // just enforces cooldown/cost and builds the ctx object that gives that
  // function everything it needs. New abilities don't need changes here.
  triggerAbility(abilityId) {
    const ability = getById(ABILITIES, abilityId);
    if (!ability || ability.type !== 'active') return false;
    const cd = this.player.abilityCooldowns[abilityId] || 0;
    if (cd > 0) return false;
    if (this.player.resource < ability.cost) return false;
    this.player.resource -= ability.cost;
    this.player.abilityCooldowns[abilityId] = ability.cooldown;
    executeAbility(ability, {
      player: this.player, enemies: this.enemies, collision: this.collision, particles: this.particles,
      dmgNumbers: this.dmgNumbers, spawnProjectile: (p) => this.projectiles.push(p), buildings: this.buildings.filter(Boolean),
      bus: this.bus, w: this.renderer.w, h: this.renderer.h, aimPoint: this.priorityTarget || null,
      deployTurret: (a) => this.deployTempTurret(a),
    });
    return true;
  }

  deployTempTurret(ability) {
    const b = new Building({ id: 'temp_turret', name: 'Deployed Turret', category: 'attack', tier: 'common', hp: 9999, range: 260, damage: ability.damage, fireRate: ability.fireRate }, -1, this.player.x + randRange(-60, 60), this.player.y - 40, 'common');
    b.temp = true; b.expires = ability.duration;
    this.buildings.push(b); // extra slot beyond the 4 platform ones (temporary)
    this.tempTurrets = this.tempTurrets || [];
    this.tempTurrets.push(b);
  }

  // --- Input --------------------------------------------------------
  setPriorityTarget(x, y) {
    let best = null, bestD = 40;
    for (const e of this.enemies) {
      if (e.dead) continue;
      const d = dist(x, y, e.x, e.y);
      if (d < bestD) { bestD = d; best = e; }
    }
    if (best) { this.priorityTarget = best; this.priorityTimer = 6; return best; }
    return null;
  }
  tapPlatform(x, y) {
    for (const plat of this.platforms) {
      if (dist(x, y, plat.x, plat.y) <= plat.size) return plat.idx;
    }
    return -1;
  }

  // --- Death / results ------------------------------------------------
  // Reconciles the run back into permanent save data and hands the results
  // to UIManager (via onStateChange) to render the death screen. To add a
  // new permanent-progression reward on death (e.g. a currency besides
  // cores, or unlocking content at a stage milestone), add it here — this
  // is the only place a run's outcome gets written back to `this.save`.
  onPlayerDeath() {
    this.running = false;
    this.syncCharacterToSave();
    this.save.meta.totalRuns++;
    this.save.meta.totalKills += this.runStats.enemiesDefeated;
    this.save.meta.totalBossKills += this.runStats.bossesDefeated;
    const stage = this.stageManager.stage;
    this.save.meta.highestStage = Math.max(this.save.meta.highestStage, stage);
    const coresEarned = Math.max(1, Math.floor(stage * 1.5 + this.runStats.bossesDefeated * 8));
    this.save.meta.cores += coresEarned;
    this.save.run = { stage: 1, wave: 1 }; // dying ends the run — next one starts fresh
    this.persist();
    if (this.onStateChange) this.onStateChange('death', { ...this.runStats, stageReached: stage, coresEarned });
  }

  retry() {
    this.enemies = []; this.projectiles = []; this.pickups = [];
    this.stageManager.reset();
    this.runStats = this.freshRunStats();
    this.buildPlayer();
    this.layoutPlatforms();
    this.running = true;
    this.lastTime = performance.now();
  }

  // --- Dungeon mode -----------------------------------------------------
  // Endless endurance trial (see the DUNGEONS header in gameData.js): an
  // invincible boss plus a forever-escalating minion stream. You cannot
  // win — you fight until you die, and how long you lasted decides the
  // reward tier. Each dungeon pays out a single currency (`rewardType`).
  // The main run's enemies/projectiles are parked in `savedMainState` and
  // restored when the trial ends (always via death — onDungeonFailure()).
  enterDungeon(dungeonId) {
    const def = getById(DUNGEONS, dungeonId);
    if (!def) return;
    this.mode = 'dungeon';
    this.savedMainState = { enemies: this.enemies, projectiles: this.projectiles };
    this.enemies = []; this.projectiles = [];
    this.dungeonCtx = { def, elapsed: 0, startDamage: this.runStats.damageDealt, spawnTimer: 0 };
    if (def.boss) {
      const bossDef = getById(BOSSES, def.boss);
      const boss = this.spawnBossInstance(bossDef, { hp: 1, dmg: 1, speed: 1, atkCdMult: 1, xpMult: 1 });
      // Invincible: resolveProjectileHits() skips damage entirely for this
      // flag, so the boss is a permanent hazard rather than a kill target.
      boss.invincible = !!def.bossInvincible;
    }
    this.notify(`${def.name} — survive as long as you can!`);
  }

  // Ends the trial (always on death) and pays out the one currency this
  // dungeon grants, scaled by the depth tier reached. Since there's no win
  // state, even a short attempt banks something — the tier multiplier just
  // scales with survival time.
  completeDungeon() {
    const ctx = this.dungeonCtx;
    const def = ctx.def;
    const seconds = ctx.elapsed;
    const tier = this.dungeonProgressTier(seconds);
    const lvl = this.player.level;
    const mult = tier.mult;
    let summary;

    if (def.rewardType === 'materials') {
      const pool = def.materialPool || ['m_scrap'];
      // Deeper runs unlock the rarer end of this dungeon's material pool.
      const depth = Math.min(pool.length - 1, Math.floor(mult));
      const matId = pool[depth];
      const amount = Math.ceil((8 + lvl) * mult);
      this.addMaterial(matId, amount);
      summary = `+${amount} ${getById(MATERIALS, matId).name}`;
    } else if (def.rewardType === 'gems') {
      const gems = Math.ceil((3 + lvl * 0.4) * mult);
      this.save.meta.gems += gems;
      summary = `+${gems} Gems`;
    } else if (def.rewardType === 'gear') {
      // Gear tier comes from depth reached, floored by level so a strong
      // character isn't handed junk for a deep run.
      const byDepth = ['common', 'uncommon', 'rare', 'epic', 'legendary', 'mythic'];
      const idx = Math.min(byDepth.length - 1, Math.max(
        DUNGEON_TIERS.findIndex(t => t.label === tier.label),
        Math.floor(lvl / 12)));
      const gearTier = byDepth[clamp(idx, 0, byDepth.length - 1)];
      this.dropRandomEquipment(gearTier, this.player.x, this.player.y);
      summary = `${TIERS[tierIndex(gearTier)].name} gear`;
    } else { // 'xp'
      const xp = Math.ceil((25 + lvl * 10) * mult);
      if (this.player.gainXp(xp)) this.syncCharacterToSave();
      summary = `+${xp} XP`;
    }

    this.notify(`${def.name}: ${tier.label} depth (${Math.floor(seconds)}s) — ${summary}`);
    this.mode = 'stage';
    this.enemies = this.savedMainState.enemies;
    this.projectiles = this.savedMainState.projectiles;
    this.dungeonCtx = null;
    this.persist();
  }

  // Dying inside a dungeon doesn't end the whole endless run — it's a side
  // encounter, not a run-ending risk. Bank the depth-scaled reward and pull
  // the player back into the main run at partial HP rather than showing the
  // death screen.
  onDungeonFailure() {
    this.completeDungeon();
    this.player.hp = Math.max(1, Math.floor(this.player.stats.maxHp * 0.5));
  }

  persist() { SaveSystem.save(this.save); }

  // Keeps save.run in sync with the live StageManager so a page reload
  // mid-run resumes at the right stage/wave instead of restarting at
  // stage 1 — see the 'waveStart'/'stageStart' bus listeners in the
  // constructor that call this, and restoreRunProgress() below for the
  // other half. Persists immediately rather than waiting for the next
  // autosave tick (every 8s) — stage/wave transitions are infrequent
  // enough that this is cheap, and without it, closing the tab in that
  // ~8s window after a transition would silently lose it.
  saveRunProgress(stage, wave) {
    this.save.run.stage = stage;
    this.save.run.wave = wave;
    this.persist();
  }

  // Called once at startup (after buildPlayer()/layoutPlatforms()): if
  // save.run says a previous session got past stage 1, fast-forward the
  // freshly-constructed StageManager to that stage/wave rather than
  // starting the enemies/spawn loop from scratch. In-flight enemies from
  // the old session aren't preserved (there's nothing to restore them
  // from) — the resumed run starts at the beginning of that wave.
  restoreRunProgress() {
    const run = this.save.run;
    if (run && run.stage > 1) {
      this.stageManager.stage = run.stage;
      this.stageManager.wave = clamp(run.wave || 1, 1, 8);
    }
  }

  draw(dt) {
    this.renderer.render({
      player: this.player, enemies: this.enemies, projectiles: this.projectiles,
      particles: this.particles.particles, dmgNumbers: this.dmgNumbers.items,
      buildings: this.buildings, platforms: this.platforms, pickups: this.pickups,
    }, dt);
  }
}

return { Game };
})();

/* ---------- js/ui/UIManager.js ---------- */
const MOD_UIManager = (function () {
// js/ui/UIManager.js
// All DOM UI: the HUD (stage/wave/hp/xp/resource/ability bar/toasts/boss
// bar), the six bottom-nav panels (Character/Smith/Gear/Abilities/
// Inventory/Dungeon), the build modal, and the death screen. This file only
// reads/writes `game.save` and calls plain methods on `game` — it never
// touches battlefield entities directly (that's Game.js's job).
//
// HOW TO EXTEND THIS FILE
//   - New bottom-nav panel: add a button to index.html's #controlPanel with
//     a `data-panel="yourPanel"` attribute, add a title to the `titles`
//     object in renderPanel(), add a `renderYourPanel()` method following
//     the pattern of the existing ones (build an HTML string from save
//     data, set panelContent.innerHTML, then attach listeners to the
//     elements you just created — always re-attach after each innerHTML
//     write, since it destroys the old DOM nodes and their listeners).
//   - New stat row on the Character panel: comes from UPGRADE_EFFECTS
//     (js/systems/progression.js) automatically — no change needed here.
//   - New gear slot: add it to SLOT_LABELS/SLOT_DEF_LIST below, add the slot
//     name to the `slots` array in Game.js's progression.js computeStats()
//     loop... actually that loop already iterates whatever's in SLOT_LABELS'
//     keys via renderGearPanel(), but computeStats() has its own hardcoded
//     `slots` array (js/systems/progression.js) — keep the two in sync.
//   - New toast/notification trigger: `game.bus.emit('toast', 'message')`
//     from anywhere (Game.js, EnemyManager.js, etc.) — this file already
//     listens for 'toast' in the constructor and queues it.
const {
  WEAPONS, ARMOR, EQUIPMENT, BUILDINGS, ABILITIES, MATERIALS, DUNGEONS,
  TIERS, tierIndex, nextTier, getById, MAX_PLATFORM_SLOTS, platformSlotCost, BUFFS, DUNGEON_TIERS,
} = MOD_gameData;
const { UPGRADE_EFFECTS, computeStats, upgradeCost } = MOD_progression;
const { formatNum, clamp, uid } = MOD_utils;

const SLOT_LABELS = { main: 'Main Weapon', secondary: 'Secondary', helmet: 'Helmet', armor: 'Armor', gloves: 'Gloves', boots: 'Boots', accessory1: 'Accessory 1', accessory2: 'Accessory 2' };
const SLOT_DEF_LIST = { main: WEAPONS.filter(w => w.slot === 'main'), secondary: WEAPONS.filter(w => w.slot === 'secondary'), helmet: ARMOR.filter(a => a.slot === 'helmet'), armor: ARMOR.filter(a => a.slot === 'armor'), gloves: ARMOR.filter(a => a.slot === 'gloves'), boots: ARMOR.filter(a => a.slot === 'boots'), accessory1: ARMOR.filter(a => a.slot === 'accessory'), accessory2: ARMOR.filter(a => a.slot === 'accessory') };

class UIManager {
  constructor(game, root) {
    this.game = game;
    this.root = root;
    this.activePanel = null;
    this.toastQueue = [];
    this.ledgerExpanded = false; // collapsed by default — see renderInventoryPanel()'s Ledger section
    this.buildElements();
    game.bus.on('toast', (msg) => this.toast(msg));
    game.onStateChange = (evt, data) => this.handleGameEvent(evt, data);
  }

  buildElements() {
    this.hud = this.root.querySelector('#hud');
    this.stageLabel = this.root.querySelector('#stageLabel');
    this.waveLabel = this.root.querySelector('#waveLabel');
    this.hpFill = this.root.querySelector('#hpFill');
    this.hpText = this.root.querySelector('#hpText');
    this.shieldFill = this.root.querySelector('#shieldFill');
    this.xpFill = this.root.querySelector('#xpFill');
    this.levelLabel = this.root.querySelector('#levelLabel');
    this.resourceFill = this.root.querySelector('#resourceFill');
    this.abilityBar = this.root.querySelector('#abilityBar');
    this.toastEl = this.root.querySelector('#toasts');
    this.bossBarWrap = this.root.querySelector('#bossBarWrap');
    this.bossBarFill = this.root.querySelector('#bossBarFill');
    this.bossName = this.root.querySelector('#bossName');
    this.panelOverlay = this.root.querySelector('#panelOverlay');
    this.panelContent = this.root.querySelector('#panelContent');
    this.panelTitle = this.root.querySelector('#panelTitle');
    this.deathScreen = this.root.querySelector('#deathScreen');
    this.buildModal = this.root.querySelector('#buildModal');
    this.itemDetailModal = this.root.querySelector('#itemDetailModal');
    this.confirmModal = this.root.querySelector('#confirmModal');
    this.confirmMessageEl = this.root.querySelector('#confirmMessage');
    this.confirmYesBtn = this.root.querySelector('#confirmYesBtn');
    this.confirmNoBtn = this.root.querySelector('#confirmNoBtn');
    this.canvas = this.root.querySelector('#gameCanvas');

    this.root.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => this.togglePanel(btn.dataset.panel));
    });
    this.root.querySelector('#panelClose').addEventListener('click', () => this.closePanel());
    this.root.querySelector('#panelOverlay').addEventListener('click', (e) => { if (e.target === this.panelOverlay) this.closePanel(); });
    this.root.querySelector('#buildModalClose').addEventListener('click', () => this.closeBuildModal());
    this.root.querySelector('#itemDetailClose').addEventListener('click', () => this.closeItemDetail());
    this.itemDetailModal.addEventListener('click', (e) => { if (e.target === this.itemDetailModal) this.closeItemDetail(); });
    this.confirmModal.addEventListener('click', (e) => { if (e.target === this.confirmModal) this.closeConfirm(); });

    this.canvas.addEventListener('pointerdown', (e) => this.handleCanvasTap(e));
  }

  handleCanvasTap(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const platIdx = this.game.tapPlatform(x, y);
    if (platIdx >= 0) { this.openBuildModal(platIdx); return; }
    this.game.setPriorityTarget(x, y);
  }

  // --- HUD ---------------------------------------------------------------
  tick() {
    const g = this.game, p = g.player;
    if (g.mode === 'dungeon') {
      const ctx = g.dungeonCtx;
      const seconds = Math.floor(ctx.elapsed);
      const tier = g.dungeonProgressTier(ctx.elapsed);
      this.stageLabel.textContent = ctx.def.name.toUpperCase();
      this.waveLabel.textContent = `${seconds}s · ${tier.label.toUpperCase()}`;
    } else {
      const mgr = g.stageManager;
      this.stageLabel.textContent = `STAGE ${mgr.stage}`;
      this.waveLabel.textContent = mgr.bossActive ? 'BOSS FIGHT' : `WAVE ${mgr.wave}/8`;
    }
    this.hpFill.style.width = `${clamp(p.hp / p.stats.maxHp, 0, 1) * 100}%`;
    this.hpText.textContent = `${Math.ceil(p.hp)}/${Math.floor(p.stats.maxHp)}`;
    this.shieldFill.style.width = `${clamp(p.shield / Math.max(1, p.stats.maxHp * 0.5), 0, 1) * 100}%`;
    this.xpFill.style.width = `${clamp(p.xp / p.xpToNext, 0, 1) * 100}%`;
    this.levelLabel.textContent = `Lv.${p.level}`;
    this.resourceFill.style.width = `${clamp(p.resource / p.stats.maxResource, 0, 1) * 100}%`;

    const boss = g.enemies.find(e => e.isBoss && !e.dead);
    if (boss) {
      this.bossBarWrap.classList.add('show');
      this.bossBarFill.style.width = `${clamp(boss.hp / boss.maxHp, 0, 1) * 100}%`;
      this.bossName.textContent = boss.def?.name || 'Boss';
    } else {
      this.bossBarWrap.classList.remove('show');
    }
    this.renderAbilityBar();
    this.flushToasts();
  }

  renderAbilityBar() {
    const g = this.game;
    const ids = g.save.loadout.abilitiesActive || [];
    const key = ids.join(',');
    if (this._abilityBarKey !== key) {
      // Loadout changed (or first render) — rebuild the buttons once.
      this._abilityBarKey = key;
      this.abilityBar.innerHTML = ids.map(id => {
        const ab = getById(ABILITIES, id);
        if (!ab) return '';
        return `<button class="ability-btn" data-ab="${id}">
          <span class="ability-name">${ab.name}</span>
          <span class="ability-cd"></span>
        </button>`;
      }).join('');
      this.abilityBar.querySelectorAll('.ability-btn').forEach(btn => {
        btn.addEventListener('click', () => { this.game.triggerAbility(btn.dataset.ab); });
      });
    }
    // Every frame: just update cooldown fill/text on the existing nodes.
    this.abilityBar.querySelectorAll('.ability-btn').forEach(btn => {
      const id = btn.dataset.ab;
      const ab = getById(ABILITIES, id);
      if (!ab) return;
      const cd = g.player.abilityCooldowns[id] || 0;
      const pct = clamp(cd / ab.cooldown, 0, 1);
      btn.style.setProperty('--cd', pct);
      btn.querySelector('.ability-cd').textContent = cd > 0 ? cd.toFixed(1) : '';
    });
  }

  toast(msg) { this.toastQueue.push({ msg, life: 2.4 }); }
  flushToasts() {
    if (this.toastQueue.length && !this._toastBusy) {
      this._toastBusy = true;
      const t = this.toastQueue.shift();
      const el = document.createElement('div');
      el.className = 'toast'; el.textContent = t.msg;
      this.toastEl.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => { el.classList.remove('show'); setTimeout(() => { el.remove(); this._toastBusy = false; }, 300); }, 1800);
    }
  }

  handleGameEvent(evt, data) {
    if (evt === 'death') this.showDeathScreen(data);
    if (evt === 'loot') { /* toast already emitted by game via bus */ }
  }

  showDeathScreen(stats) {
    this.deathScreen.innerHTML = `
      <div class="death-card">
        <h2>Base Overrun</h2>
        <div class="death-stats">
          <div><span>Stage Reached</span><b>${stats.stageReached}</b></div>
          <div><span>Enemies Defeated</span><b>${stats.enemiesDefeated}</b></div>
          <div><span>Bosses Defeated</span><b>${stats.bossesDefeated}</b></div>
          <div><span>Damage Dealt</span><b>${formatNum(stats.damageDealt)}</b></div>
          <div><span>Damage Taken</span><b>${formatNum(stats.damageReceived)}</b></div>
          <div><span>Materials Earned</span><b>${formatNum(stats.materialsEarned)}</b></div>
          <div><span>XP Earned</span><b>${formatNum(stats.xpEarned)}</b></div>
          <div><span>Loot Obtained</span><b>${stats.lootObtained}</b></div>
          <div><span>Time Survived</span><b>${Math.floor(stats.timeSurvived)}s</b></div>
          <div class="cores-earned"><span>Cores Earned</span><b>+${stats.coresEarned}</b></div>
        </div>
        <div class="death-actions">
          <button id="retryBtn" class="btn primary">Retry</button>
          <button id="baseBtn" class="btn">Return to Base</button>
        </div>
      </div>`;
    this.deathScreen.classList.add('show');
    this.root.querySelector('#retryBtn').addEventListener('click', () => { this.deathScreen.classList.remove('show'); this.game.retry(); this.renderAll(); });
    this.root.querySelector('#baseBtn').addEventListener('click', () => { this.deathScreen.classList.remove('show'); this.game.retry(); this.openPanel('character'); });
  }

  // --- Panels --------------------------------------------------------------
  togglePanel(name) {
    if (this.activePanel === name && this.panelOverlay.classList.contains('show')) { this.closePanel(); return; }
    this.openPanel(name);
  }
  openPanel(name) {
    this.activePanel = name;
    this.panelOverlay.classList.add('show');
    this.renderPanel(name);
  }
  closePanel() { this.panelOverlay.classList.remove('show'); this.activePanel = null; }

  renderPanel(name) {
    const titles = { character: 'Character', smith: 'Smith', gear: 'Gear', abilities: 'Abilities', inventory: 'Inventory', dungeon: 'Dungeon' };
    this.panelTitle.textContent = titles[name] || '';
    const renderers = {
      character: () => this.renderCharacterPanel(),
      smith: () => this.renderSmithPanel(),
      gear: () => this.renderGearPanel(),
      abilities: () => this.renderAbilitiesPanel(),
      inventory: () => this.renderInventoryPanel(),
      dungeon: () => this.renderDungeonPanel(),
    };
    (renderers[name] || (() => { this.panelContent.innerHTML = ''; }))();
  }
  renderAll() { if (this.activePanel) this.renderPanel(this.activePanel); }

  materialsRow() {
    const mats = this.game.save.inventory.materials;
    return `<div class="mat-row">${MATERIALS.map(m => `<div class="mat-chip" title="${m.name}"><span class="dot" style="background:${TIERS[tierIndex(m.tier)].color}"></span>${m.name.split(' ')[0]}: ${formatNum(mats[m.id] || 0)}</div>`).join('')}</div>`;
  }

  // --- Item detail modal ---------------------------------------------------
  // Shared "what does this actually do" view used by Inventory, Smith, Gear,
  // and the build modal — anywhere the person can tap an item/building to
  // see its real numbers rather than just a name and a rarity color.
  //
  // `def` is a WEAPONS/ARMOR/BUILDINGS entry from gameData.js. `item` is the
  // optional owned instance ({tier, level}) — if omitted (e.g. a Smith
  // recipe not yet owned, or a building not yet placed) stats are shown at
  // the def's base tier, level 1. `actions` is an optional array of
  // {label, cls?, onClick} rendered as buttons at the bottom (Equip/Sell/
  // Craft/Place/etc.) so this same view can be opened from anywhere without
  // duplicating each panel's action logic.
  showItemDetail(def, { item = null, actions = [] } = {}) {
    const tier = item ? item.tier : def.tier;
    const level = item ? item.level : 1;
    const tierInfo = TIERS[tierIndex(tier)];

    let subtitle, rows;
    if (def.behavior) { // weapon
      subtitle = SLOT_LABELS[def.slot] || def.slot;
      rows = this.weaponDetailRows(def, tier, level);
    } else if (def.stats) { // armor / accessory
      // ARMOR entries use `slot: 'accessory'` (singular) since one accessory
      // item can go in either equip slot — SLOT_LABELS only has the two
      // specific equip-slot keys (accessory1/accessory2), so special-case it
      // here rather than adding 'accessory' to SLOT_LABELS, which would add
      // a bogus 9th slot to the Gear panel (it iterates SLOT_LABELS' keys).
      subtitle = def.slot === 'accessory' ? 'Accessory' : (SLOT_LABELS[def.slot] || def.slot);
      rows = this.armorDetailRows(def, tier, level);
    } else { // building
      subtitle = `${def.category} building`;
      rows = this.buildingDetailRows(def, tier, level);
    }

    const actionsHtml = actions.length
      ? `<div class="item-detail-actions">${actions.map((a, i) => `<button class="btn ${a.cls || ''}" data-detail-action="${i}">${a.label}</button>`).join('')}</div>`
      : '';

    this.itemDetailModal.querySelector('#itemDetailBody').innerHTML = `
      <div class="item-detail-header" style="border-color:${tierInfo.color}">
        <div class="item-detail-name">${def.name}</div>
        <div class="item-detail-meta">${tierInfo.name}${item ? ` · Lv.${level}` : ''} · ${subtitle}</div>
      </div>
      <div class="item-detail-stats">${rows}</div>
      ${actionsHtml}`;
    this.itemDetailModal.querySelectorAll('[data-detail-action]').forEach(btn => {
      btn.addEventListener('click', () => actions[+btn.dataset.detailAction].onClick());
    });
    this.itemDetailModal.classList.add('show');
  }
  closeItemDetail() { this.itemDetailModal.classList.remove('show'); }

  // Generic yes/no confirmation for destructive actions (Sell/Dismantle).
  // Re-binds the Yes/No handlers fresh each call and removes them on close
  // — via whichever path closes it (Yes, No, or a backdrop tap) — since the
  // action to confirm is different every time this is opened; leaving stale
  // listeners bound would fire an old confirm's action on a later click.
  confirmAction(message, onConfirm) {
    this.confirmMessageEl.textContent = message;
    const cleanup = () => {
      this.confirmModal.classList.remove('show');
      this.confirmYesBtn.removeEventListener('click', onYes);
      this.confirmNoBtn.removeEventListener('click', onNo);
      this._confirmCleanup = null;
    };
    const onYes = () => { cleanup(); onConfirm(); };
    const onNo = () => cleanup();
    this.confirmYesBtn.addEventListener('click', onYes);
    this.confirmNoBtn.addEventListener('click', onNo);
    this._confirmCleanup = cleanup;
    this.confirmModal.classList.add('show');
  }
  closeConfirm() {
    // Backdrop-tap cancel path — routes through the same cleanup as No so
    // the bound Yes/No listeners are actually removed, not just hidden.
    if (this._confirmCleanup) this._confirmCleanup();
    else this.confirmModal.classList.remove('show');
  }

  detailRow(label, value) { return `<div class="detail-row"><span>${label}</span><b>${value}</b></div>`; }

  weaponDetailRows(def, tier, level) {
    const tierMult = TIERS[tierIndex(tier)].mult;
    const lvlMult = 1 + (level - 1) * 0.08;
    const dmg = def.damage * tierMult * lvlMult;
    const rows = [
      this.detailRow('Damage', dmg.toFixed(1)),
      this.detailRow('Fire Rate', `${def.fireRate.toFixed(2)}/s`),
      this.detailRow('Crit Chance', `${(def.crit * 100).toFixed(1)}%`),
      this.detailRow('Crit Damage', `${(def.critMult * 100).toFixed(0)}%`),
      this.detailRow('Range', Math.round(def.range)),
      this.detailRow('Damage Type', def.dmgType),
    ];
    if (def.pierce) rows.push(this.detailRow('Pierce', def.pierce));
    if (def.splash) rows.push(this.detailRow('Splash Radius', Math.round(def.splash)));
    if (def.pellets) rows.push(this.detailRow('Pellets', def.pellets));
    if (def.chainCount) rows.push(this.detailRow('Chain Targets', def.chainCount));
    if (def.chargeTime) rows.push(this.detailRow('Charge Time', `${def.chargeTime.toFixed(2)}s`));
    return rows.join('');
  }

  armorDetailRows(def, tier, level) {
    const tierMult = TIERS[tierIndex(tier)].mult;
    const lvlMult = 1 + (level - 1) * 0.08;
    const labels = {
      hp: 'Max HP', defense: 'Defense', crit: 'Crit Chance', critMult: 'Crit Damage',
      fireRate: 'Attack Speed', atk: 'Attack', move: 'Move Speed', regen: 'Regeneration',
      abilityPower: 'Ability Power', resource: 'Resource Capacity', range: 'Range',
      lootChance: 'Loot Chance', shield: 'Shield',
    };
    const percentKeys = new Set(['crit', 'critMult', 'fireRate', 'move', 'abilityPower', 'lootChance', 'range']);
    return Object.entries(def.stats).map(([key, base]) => {
      const scaled = base * tierMult * lvlMult;
      const display = percentKeys.has(key) ? `+${(scaled * 100).toFixed(1)}%` : `+${scaled.toFixed(1)}`;
      return this.detailRow(labels[key] || key, display);
    }).join('');
  }

  buildingDetailRows(def, tier, level) {
    const tierMult = TIERS[tierIndex(tier)].mult;
    const lvlMult = 1 + (level - 1) * 0.15;
    const buffLabels = { atkPct: 'Attack', critPct: 'Crit Chance', critMultPct: 'Crit Damage', fireRatePct: 'Fire Rate', defensePct: 'Defense' };
    const rows = [this.detailRow('HP', Math.round(def.hp * lvlMult))];
    if (def.range) rows.push(this.detailRow('Range', Math.round(def.range)));
    if (def.category === 'attack') {
      rows.push(this.detailRow('Damage', (def.damage * tierMult * lvlMult).toFixed(1)));
      rows.push(this.detailRow('Fire Rate', `${(def.fireRate * lvlMult).toFixed(2)}/s`));
      rows.push(this.detailRow('Damage Type', def.dmgType));
      if (def.pierce) rows.push(this.detailRow('Pierce', def.pierce));
      if (def.splash) rows.push(this.detailRow('Splash Radius', Math.round(def.splash)));
    } else if (def.category === 'buff') {
      const [key, val] = Object.entries(def.buff)[0];
      rows.push(this.detailRow('Buff', `${buffLabels[key] || key} +${(val * 100).toFixed(1)}%`));
    } else if (def.category === 'heal') {
      if (def.healPerSec) rows.push(this.detailRow('Heal', `${(def.healPerSec * lvlMult).toFixed(1)}/s`));
      if (def.shieldPerSec) {
        rows.push(this.detailRow('Shield', `${(def.shieldPerSec * lvlMult).toFixed(1)}/s`));
        rows.push(this.detailRow('Shield Cap', def.shieldCap));
      }
      if (def.buildingRepairPerSec) rows.push(this.detailRow('Repair', `${(def.buildingRepairPerSec * lvlMult).toFixed(1)}/s`));
    } else if (def.category === 'material') {
      const [matId, rate] = Object.entries(def.produces)[0];
      rows.push(this.detailRow('Produces', `${(rate * tierMult * lvlMult).toFixed(2)}/s ${getById(MATERIALS, matId).name}`));
    }
    if (def.cost) {
      const costStr = Object.entries(def.cost).filter(([, c]) => c > 0).map(([m, c]) => `${c} ${getById(MATERIALS, m).name}`).join(', ');
      if (costStr) rows.push(this.detailRow('Cost', costStr));
    }
    return rows.join('');
  }

  // Character ---------------------------------------------------------------
  renderCharacterPanel() {
    const g = this.game, p = g.player, save = g.save;
    const stats = p.stats;
    // Upgrade points earned are tracked live on the player object during a
    // run (Player.gainXp() in entities.js) — read from there, not
    // save.character, so this panel reflects points earned since the run
    // started rather than only what was last synced at death.
    const points = p.upgradePoints;
    const rows = Object.entries(UPGRADE_EFFECTS).map(([key, meta]) => {
      const lvl = save.character.upgrades[key] || 0;
      // Cost rises with the stat's own level (see upgradeCost() in
      // progression.js) — recomputed per row on every render so the label
      // and the disabled state always reflect the current rank.
      const cost = upgradeCost(key, lvl);
      return `<div class="upgrade-row">
        <div class="upgrade-info"><span>${meta.label}</span><small>Lv.${lvl} → Lv.${lvl + 1}</small></div>
        <button class="btn small" data-upgrade="${key}" ${points < cost ? 'disabled' : ''}>+ (${cost}pt)</button>
      </div>`;
    }).join('');
    this.panelContent.innerHTML = `
      <div class="stat-grid">
        <div>HP <b>${Math.floor(stats.maxHp)}</b></div>
        <div>Defense <b>${Math.floor(stats.defense)}</b></div>
        <div>Attack <b>${Math.floor(stats.atk)}</b></div>
        <div>Atk Speed <b>${stats.fireRate.toFixed(2)}x</b></div>
        <div>Crit <b>${(stats.crit * 100).toFixed(1)}%</b></div>
        <div>Crit Dmg <b>${(stats.critMult * 100).toFixed(0)}%</b></div>
        <div>Regen <b>${stats.regen.toFixed(1)}/s</b></div>
        <div>Ability Pwr <b>${(stats.abilityPower * 100).toFixed(0)}%</b></div>
        <div>Resource <b>${Math.floor(stats.maxResource)}</b></div>
        <div>Move <b>${Math.floor(stats.move)}</b></div>
      </div>
      <div class="section-label">Upgrade Points: <b>${points}</b></div>
      <div class="upgrade-list">${rows}</div>
      <div class="cores-row">Gems <b class="gem-amount">${formatNum(save.meta.gems)}</b></div>
      <div class="section-label">Active Buffs</div>
      <div class="buff-list">${BUFFS.map(b => {
        const remaining = save.activeBuffs[b.id] || 0;
        const active = remaining > 0;
        return `<div class="upgrade-row">
          <div class="upgrade-info"><span>${b.name}</span><small>${b.desc}${active ? ` · ${this.formatCountdown(remaining * 1000)} left` : ` · ${Math.round(b.duration / 60)}min`}</small></div>
          <button class="btn small" data-buff="${b.id}" ${save.meta.gems < b.cost ? 'disabled' : ''}>${active ? '+' : ''}${b.cost} Gem${b.cost === 1 ? '' : 's'}</button>
        </div>`;
      }).join('')}</div>
      <div class="section-label">Danger Zone</div>

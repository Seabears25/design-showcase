<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>HEXFRONT — Endless Base Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   HEXFRONT — visual theme
   Palette: deep-space navy (#0a0e1a) / electric cyan (#38bdf8)
   amber warning (#ffb020) / crimson danger (#ff4655)
   emerald heal/xp (#3ddc84). Rajdhani for display, JetBrains
   Mono for numeric HUD readouts — a technical, readable pairing
   for a battlefield that stays legible when crowded.
   =========================================================== */

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }

:root {
  --bg-deep: #0a0e1a;
  --bg-panel: rgba(16, 24, 42, 0.92);
  --bg-panel-soft: rgba(19, 28, 48, 0.85);
  --cyan: #38bdf8;
  --cyan-dim: rgba(56, 189, 248, 0.35);
  --amber: #ffb020;
  --crimson: #ff4655;
  --emerald: #3ddc84;
  --violet: #b96bff;
  --text: #e7f3ff;
  --text-muted: #7f93ab;
  --border: rgba(56, 189, 248, 0.22);
  --radius: 10px;
  --font-display: 'Rajdhani', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

html, body { height: 100%; background: var(--bg-deep); overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--font-display); color: var(--text); }

#app {
  height: 100dvh;
  width: 100vw;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ===================== BATTLE VIEW ===================== */
#battleView {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  background: var(--bg-deep);
  touch-action: none;
}
#gameCanvas { position: absolute; inset: 0; display: block; }

#hud {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: max(10px, env(safe-area-inset-top)) 12px 10px;
  pointer-events: none;
}

.hud-top { display: flex; justify-content: space-between; align-items: flex-start; }

.stage-block { background: var(--bg-panel-soft); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 12px; backdrop-filter: blur(6px); }
#stageLabel { font-weight: 700; font-size: 15px; letter-spacing: 1.5px; color: var(--cyan); }
#waveLabel { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 1px; }

.level-block { background: var(--bg-panel-soft); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 10px; min-width: 96px; backdrop-filter: blur(6px); }
#levelLabel { font-weight: 700; font-size: 13px; text-align: right; color: var(--text); }

.bar { position: relative; height: 8px; border-radius: 5px; background: rgba(255,255,255,0.08); overflow: hidden; margin-top: 4px; }
.bar-fill { position: absolute; inset: 0; width: 0%; border-radius: 5px; transition: width 0.15s ease-out; }
.xp-bar .bar-fill { background: linear-gradient(90deg, #2a9d5c, var(--emerald)); }
.boss-bar { height: 10px; }
.boss-bar .bar-fill { background: linear-gradient(90deg, #a11c2a, var(--crimson)); }
.resource-bar { height: 6px; }
.resource-bar .bar-fill { background: linear-gradient(90deg, #1c6fa1, var(--cyan)); }
.hp-bar { height: 14px; border-radius: 7px; }
.hp-bar .bar-fill.shield { background: rgba(139, 233, 255, 0.55); z-index: 1; }
.hp-bar .bar-fill.hp { background: linear-gradient(90deg, #8a1420, var(--crimson)); z-index: 2; }
.bar-text { position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 10px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

#bossBarWrap { align-self: center; width: min(420px, 90%); opacity: 0; transform: translateY(-8px); transition: all 0.25s; pointer-events: none; }
#bossBarWrap.show { opacity: 1; transform: translateY(0); }
#bossName { text-align: center; font-weight: 700; letter-spacing: 2px; font-size: 13px; color: var(--amber); text-shadow: 0 0 8px rgba(255,176,32,0.6); }

#toasts { position: absolute; top: 74px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; }
.toast { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px; padding: 6px 16px; font-size: 12px; color: var(--text); opacity: 0; transition: opacity 0.3s, transform 0.3s; transform: translateY(-6px); white-space: nowrap; }
.toast.show { opacity: 1; transform: translateY(0); }

.hud-bottom { display: flex; flex-direction: column; gap: 8px; }
.player-vitals { background: var(--bg-panel-soft); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; backdrop-filter: blur(6px); }

#abilityBar { display: flex; gap: 8px; overflow-x: auto; pointer-events: auto; padding-bottom: 2px; }
.ability-btn {
  position: relative; flex: 0 0 auto; min-width: 76px; padding: 8px 10px;
  background: var(--bg-panel); border: 1px solid var(--cyan-dim); border-radius: 9px;
  color: var(--text); font-family: var(--font-display); font-size: 11px; font-weight: 600;
  overflow: hidden; text-align: left;
}
.ability-btn::before {
  content: ''; position: absolute; left: 0; bottom: 0; height: 3px; width: 100%;
  background: var(--cyan); transform: scaleX(var(--cd, 0)); transform-origin: left; opacity: 0.85;
}
.ability-name { display: block; }
.ability-cd { display: block; font-family: var(--font-mono); color: var(--amber); font-size: 10px; margin-top: 2px; }

/* ===================== CONTROL PANEL (bottom nav) ===================== */
#controlPanel {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  background: var(--bg-panel);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn {
  background: none; border: none; color: var(--text-muted);
  font-family: var(--font-display); font-size: 11px; font-weight: 600;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 9px 2px 8px; cursor: pointer;
}
.nav-btn:active { background: rgba(56,189,248,0.08); }
.nav-icon { font-size: 17px; color: var(--cyan); line-height: 1; }

/* ===================== PANEL OVERLAY (sheet) ===================== */
#panelOverlay, #buildModal, #itemDetailModal {
  position: fixed; inset: 0; background: rgba(4,7,14,0.72);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
  z-index: 50;
}
#itemDetailModal { z-index: 60; } /* sits above build/craft/gear pickers it was opened from */
#panelOverlay.show, #buildModal.show, #itemDetailModal.show { opacity: 1; pointer-events: auto; }

#panelSheet, #buildModalSheet, #itemDetailSheet {
  width: 100%; max-width: 560px; max-height: 78vh;
  background: var(--bg-panel); border: 1px solid var(--border); border-bottom: none;
  border-radius: 16px 16px 0 0; display: flex; flex-direction: column;
  transform: translateY(12px); transition: transform 0.2s;
  padding-bottom: env(safe-area-inset-bottom);
}
#panelOverlay.show #panelSheet, #buildModal.show #buildModalSheet, #itemDetailModal.show #itemDetailSheet { transform: translateY(0); }

#panelHeader { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); }
#panelTitle { font-weight: 700; font-size: 17px; letter-spacing: 1px; color: var(--cyan); }
#panelClose, #buildModalClose, #itemDetailClose { background: none; border: none; color: var(--text-muted); font-size: 16px; padding: 4px 8px; }

#panelContent, #buildModalBody, #itemDetailBody { padding: 14px 16px 24px; overflow-y: auto; }

/* --- shared bits inside panels --- */
.section-label { font-size: 12px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; margin: 14px 0 8px; }
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; font-size: 13px; color: var(--text-muted); }
.stat-grid b { color: var(--text); font-family: var(--font-mono); float: right; }
.mat-row { display: flex; flex-wrap: wrap; gap: 6px; }
.cores-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-muted); padding: 6px 2px 10px; }
.cores-row b { color: var(--amber); font-family: var(--font-mono); font-size: 15px; }
.depth-legend { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; }
.depth-chip { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 12px; padding: 3px 9px; font-size: 10px; color: var(--text); }
.depth-chip small { color: var(--text-muted); font-family: var(--font-mono); margin-left: 3px; }

.mat-chip { display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 14px; padding: 4px 10px; font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); }
.mat-chip .dot { width: 7px; height: 7px; border-radius: 50%; }

.btn { background: var(--bg-panel-soft); border: 1px solid var(--cyan-dim); color: var(--text); border-radius: 7px; padding: 8px 14px; font-family: var(--font-display); font-weight: 600; font-size: 13px; }
.btn.small { padding: 5px 10px; font-size: 11px; }
.btn.ghost { border-color: rgba(255,70,85,0.35); color: #ff9aa3; }
.btn.primary { background: linear-gradient(90deg, #1c6fa1, var(--cyan)); border-color: transparent; color: #04121c; }
.btn:disabled { opacity: 0.35; }

.upgrade-row, .craft-row, .smith-row, .inv-row, .ability-row, .dungeon-row, .expand-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 10px; border: 1px solid var(--border); border-radius: 9px; margin-bottom: 7px; font-size: 13px; }
.upgrade-info small, .smith-row small, .inv-row small, .ability-row small, .dungeon-row small, .expand-row small { display: block; color: var(--text-muted); font-size: 10px; margin-top: 2px; }
.craft-row .cost, .expand-row .cost { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); flex: 1; text-align: right; margin-right: 8px; }
.smith-actions, .inv-actions { display: flex; gap: 6px; }
.ability-row.equipped { border-color: var(--cyan); background: rgba(56,189,248,0.08); }
.ability-row .check { color: var(--cyan); font-weight: 700; }
.dungeon-row.locked { opacity: 0.45; }
.empty-note { color: var(--text-muted); font-size: 12px; padding: 10px 0; }

/* --- collapsible Ledger (Inventory panel) --- */
.ledger-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 4px; margin-top: 6px; border-top: 1px solid var(--border);
  cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text);
}
.ledger-header small { color: var(--text-muted); font-weight: 500; font-family: var(--font-mono); margin-left: 4px; }
.ledger-chevron { color: var(--cyan); font-size: 11px; }
.ledger-body { padding-bottom: 6px; }
.ledger-group { margin-bottom: 12px; }
.ledger-group-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.ledger-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.ledger-item {
  border: 1px solid var(--border); border-left-width: 3px; border-radius: 7px;
  padding: 6px 8px; font-size: 11px; color: var(--text); cursor: pointer;
  background: var(--bg-panel-soft);
}
.ledger-item small { display: block; color: var(--text-muted); font-size: 9px; margin-top: 1px; }
.ledger-item.undiscovered { opacity: 0.4; border-left-color: var(--border) !important; cursor: default; color: var(--text-muted); }


.gear-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.gear-slot { border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; }
.gear-slot-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.gear-slot-item { margin-top: 4px; border: 1px solid; border-radius: 6px; padding: 6px 8px; font-size: 13px; font-weight: 600; }
.picker-title { font-size: 12px; color: var(--text-muted); margin: 14px 0 8px; }
.picker-list { display: flex; flex-direction: column; gap: 6px; }
.picker-item { text-align: left; background: var(--bg-panel-soft); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-family: var(--font-display); font-size: 13px; color: var(--text); }
.picker-item small { display: block; color: var(--text-muted); font-size: 10px; margin-top: 2px; }

.equip-picker-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: var(--bg-panel-soft); border: 1px solid var(--border); border-left-width: 3px;
  border-radius: 8px; padding: 8px 10px; font-family: var(--font-display); font-size: 13px; color: var(--text);
}
.equip-picker-item small { display: block; color: var(--text-muted); font-size: 10px; margin-top: 2px; }
.equip-picker-item.disabled { opacity: 0.4; }
.equip-picker-item.disabled .info-btn { pointer-events: auto; } /* info button stays tappable even when unaffordable */

/* Rows that open the item detail modal on tap (inventory/smith lists) get
   a pointer cursor and a subtle hover/active tint so it's clear they're
   tappable, separate from their action buttons which stopPropagation. */
.detail-openable { cursor: pointer; }
.detail-openable:active { background: rgba(56,189,248,0.06); }

/* Small circular "info" affordance placed next to rows whose primary tap
   action is something else (equip/place) — opens the same detail modal
   without triggering that primary action. */
.info-btn {
  flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%;
  background: rgba(56,189,248,0.12); border: 1px solid var(--cyan-dim);
  color: var(--cyan); font-size: 11px; font-weight: 700; line-height: 1;
  display: flex; align-items: center; justify-content: center; padding: 0;
}

/* --- item detail modal content --- */
.item-detail-header { border-left: 3px solid; padding: 4px 0 4px 12px; margin-bottom: 14px; }
.item-detail-name { font-weight: 700; font-size: 16px; color: var(--text); }
.item-detail-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
.detail-row { display: flex; justify-content: space-between; padding: 8px 2px; border-bottom: 1px dashed rgba(255,255,255,0.06); font-size: 13px; color: var(--text-muted); }
.detail-row b { color: var(--text); font-family: var(--font-mono); }
.item-detail-actions { display: flex; gap: 10px; margin-top: 16px; }
.item-detail-actions .btn { flex: 1; text-align: center; }

/* ===================== CONFIRM DIALOG ===================== */
/* Small centered yes/no card — sits above every other overlay (including
   the item detail modal it's usually triggered from) since it's a quick
   decision, not something to browse. */
#confirmModal {
  position: fixed; inset: 0; background: rgba(4,6,12,0.75);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.15s;
  z-index: 90; padding: 20px;
}
#confirmModal.show { opacity: 1; pointer-events: auto; }
#confirmCard {
  background: var(--bg-panel); border: 1px solid var(--border); border-radius: 14px;
  padding: 20px; width: 100%; max-width: 320px;
  transform: scale(0.96); transition: transform 0.15s;
}
#confirmModal.show #confirmCard { transform: scale(1); }
#confirmMessage { font-size: 14px; color: var(--text); text-align: center; margin-bottom: 18px; line-height: 1.4; }
#confirmActions { display: flex; gap: 10px; }
#confirmActions .btn { flex: 1; text-align: center; }

/* ===================== DEATH SCREEN ===================== */
#deathScreen { position: fixed; inset: 0; background: rgba(4,6,12,0.9); display: none; align-items: center; justify-content: center; z-index: 80; padding: 20px; }
#deathScreen.show { display: flex; }
.death-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; padding: 24px 22px; width: 100%; max-width: 380px; }
.death-card h2 { text-align: center; color: var(--crimson); letter-spacing: 2px; font-size: 20px; margin-bottom: 16px; text-shadow: 0 0 12px rgba(255,70,85,0.5); }
.death-stats { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
.death-stats div { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); border-bottom: 1px dashed rgba(255,255,255,0.06); padding-bottom: 5px; }
.death-stats b { color: var(--text); font-family: var(--font-mono); }
.death-stats .cores-earned { color: var(--amber); border-bottom: none; margin-top: 4px; }
.death-stats .cores-earned b { color: var(--amber); }
.death-actions { display: flex; gap: 10px; }
.death-actions .btn { flex: 1; text-align: center; }

@media (min-width: 700px) {
  #panelSheet, #buildModalSheet, #itemDetailSheet { border-radius: 16px; margin-bottom: 24px; }
  #panelOverlay, #buildModal, #itemDetailModal { align-items: center; }
}

</style>
</head>
<body>
  <div id="app">
    <!-- ===================== BATTLE VIEW ===================== -->
    <div id="battleView">
      <canvas id="gameCanvas"></canvas>

      <div id="hud">
        <div class="hud-top">
          <div class="stage-block">
            <div id="stageLabel">STAGE 1</div>
            <div id="waveLabel">WAVE 1/8</div>
          </div>
          <div class="level-block">
            <div id="levelLabel">Lv.1</div>
            <div class="bar xp-bar"><div id="xpFill" class="bar-fill"></div></div>
          </div>
        </div>

        <div id="bossBarWrap">
          <div id="bossName">Boss</div>
          <div class="bar boss-bar"><div id="bossBarFill" class="bar-fill"></div></div>
        </div>

        <div id="toasts"></div>

        <div class="hud-bottom">
          <div class="player-vitals">
            <div class="bar hp-bar"><div id="shieldFill" class="bar-fill shield"></div><div id="hpFill" class="bar-fill hp"></div><span id="hpText" class="bar-text">0/0</span></div>
            <div class="bar resource-bar"><div id="resourceFill" class="bar-fill"></div></div>
          </div>
          <div id="abilityBar"></div>
        </div>
      </div>
    </div>

    <!-- ===================== BOTTOM CONTROL PANEL ===================== -->
    <nav id="controlPanel">
      <button class="nav-btn" data-panel="character"><span class="nav-icon">◈</span>Character</button>
      <button class="nav-btn" data-panel="smith"><span class="nav-icon">⚒</span>Smith</button>
      <button class="nav-btn" data-panel="gear"><span class="nav-icon">⛨</span>Gear</button>
      <button class="nav-btn" data-panel="abilities"><span class="nav-icon">✦</span>Abilities</button>
      <button class="nav-btn" data-panel="inventory"><span class="nav-icon">▤</span>Inventory</button>
      <button class="nav-btn" data-panel="dungeon"><span class="nav-icon">⬡</span>Dungeon</button>
    </nav>

    <!-- ===================== PANEL OVERLAY ===================== -->
    <div id="panelOverlay">
      <div id="panelSheet">
        <div id="panelHeader">
          <div id="panelTitle">Character</div>
          <button id="panelClose">✕</button>
        </div>
        <div id="panelContent"></div>
      </div>
    </div>

    <!-- ===================== BUILD MODAL ===================== -->
    <div id="buildModal">
      <div id="buildModalSheet">
        <div id="panelHeader">
          <div>Build</div>
          <button id="buildModalClose">✕</button>
        </div>
        <div id="buildModalBody"></div>
      </div>
    </div>

    <!-- ===================== ITEM DETAIL MODAL ===================== -->
    <div id="itemDetailModal">
      <div id="itemDetailSheet">
        <div id="panelHeader">
          <div>Details</div>
          <button id="itemDetailClose">✕</button>
        </div>
        <div id="itemDetailBody"></div>
      </div>
    </div>

    <!-- ===================== CONFIRM DIALOG ===================== -->
    <!-- Generic yes/no confirmation, used for destructive actions
         (Sell/Dismantle) — see UIManager.confirmAction(). -->
    <div id="confirmModal">
      <div id="confirmCard">
        <div id="confirmMessage"></div>
        <div id="confirmActions">
          <button id="confirmYesBtn" class="btn ghost">Yes</button>
          <button id="confirmNoBtn" class="btn">Cancel</button>
        </div>
      </div>
    </div>

    <!-- ===================== DEATH SCREEN ===================== -->
    <div id="deathScreen"></div>
  </div>

  <script>
// ===== AUTO-GENERATED BUNDLE — see bundle.js. Do not edit directly. =====
(function () {
"use strict";

/* ---------- js/core/utils.js ---------- */
const MOD_utils = (function () {
// js/core/utils.js
// Shared math, geometry and randomness helpers. Nothing in this file knows
// about game rules — it's pure utility so every other module can lean on it.
//
// HOW TO EXTEND THIS FILE
// You'll rarely need to touch this file to add game content (enemies,
// weapons, etc. — see js/data/gameData.js for that). Add something here
// only when several *other* files would need the same generic helper —
// e.g. a new geometry function, a new RNG distribution, a new pooling
// strategy. Keep everything in this file game-rule-agnostic: no imports
// from js/data or js/entities belong here.

function dist(ax, ay, bx, by) {
  return Math.hypot(ax - bx, ay - by);
}

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function angleTo(ax, ay, bx, by) {
  return Math.atan2(by - ay, bx - ax);
}

// Deterministic-ish RNG (mulberry32) so runs can eventually be seeded/replayed.
function makeRng(seed = Date.now()) {
  let a = seed >>> 0;
  return function rng() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const rng = makeRng();

function randRange(min, max, r = rng) {
  return min + r() * (max - min);
}

function randInt(min, max, r = rng) {
  return Math.floor(randRange(min, max + 1, r));
}

function choice(arr, r = rng) {
  return arr[Math.floor(r() * arr.length)];
}

// Weighted choice: items = [{item, weight}]
function weightedChoice(items, r = rng) {
  const total = items.reduce((s, i) => s + i.weight, 0);
  let roll = r() * total;
  for (const entry of items) {
    if (roll < entry.weight) return entry.item;
    roll -= entry.weight;
  }
  return items[items.length - 1].item;
}

// --- Hex geometry (flat-top hexagons, used for the four build platforms) ---
function hexCorner(cx, cy, size, i) {
  const angleDeg = 60 * i;
  const angleRad = (Math.PI / 180) * angleDeg;
  return { x: cx + size * Math.cos(angleRad), y: cy + size * Math.sin(angleRad) };
}

function hexPath(ctx, cx, cy, size) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const p = hexCorner(cx, cy, size, i);
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
}

function pointInCircle(px, py, cx, cy, r) {
  return dist(px, py, cx, cy) <= r;
}

function uid(prefix = 'id') {
  return `${prefix}_${Date.now().toString(36)}_${Math.floor(Math.random() * 1e6).toString(36)}`;
}

// Upgrade points awarded on REACHING a given level, as a staircase based on
// triangular numbers: level 1 -> 1pt, levels 2-3 -> 2pts each, levels 4-6 ->
// 3pts each, levels 7-10 -> 4pts each, and so on (the "landing" value V
// holds for V consecutive levels before stepping up to V+1). Used by
// Player.gainXp() in entities.js — this lives here rather than there since
// it's pure math, not entity state.
function pointsForLevel(level) {
  return Math.ceil((Math.sqrt(8 * level + 1) - 1) / 2);
}

function formatNum(n) {
  if (n < 1000) return Math.floor(n).toString();
  const units = ['K', 'M', 'B', 'T'];
  let u = -1;
  let v = n;
  do { v /= 1000; u++; } while (Math.abs(v) >= 1000 && u < units.length - 1);
  return v.toFixed(v < 10 ? 2 : 1) + units[u];
}

// Simple generic object pool to avoid GC churn for projectiles/particles.
class ObjectPool {
  constructor(factory, reset, initialSize = 32) {
    this.factory = factory;
    this.reset = reset;
    this.pool = [];
    for (let i = 0; i < initialSize; i++) this.pool.push(factory());
  }
  acquire() {
    const obj = this.pool.pop() || this.factory();
    return obj;
  }
  release(obj) {
    this.reset(obj);
    this.pool.push(obj);
  }
}

class EventBus {
  constructor() { this.listeners = new Map(); }
  on(evt, fn) {
    if (!this.listeners.has(evt)) this.listeners.set(evt, new Set());
    this.listeners.get(evt).add(fn);
    return () => this.listeners.get(evt).delete(fn);
  }
  emit(evt, payload) {
    const set = this.listeners.get(evt);
    if (!set) return;
    for (const fn of set) fn(payload);
  }
}

return { dist, clamp, lerp, angleTo, makeRng, rng, randRange, randInt, choice, weightedChoice, hexCorner, hexPath, pointInCircle, uid, pointsForLevel, formatNum, ObjectPool, EventBus };
})();

// Procedurally generates 50 more buildings on top of BUILDINGS_HAND above —
// 13 attack, 12 buff, 12 heal, 13 material — spread across all six tiers.
// Same deterministic-generation approach as generateWeapons()/generateArmor()
// above. New buildings aren't unlocked for anyone automatically; players
// find them as "blueprint" drops from combat (see Game.js's
// unlockRandomBuilding(), called from onEnemyDefeated()/onBossDefeated()).
function generateBuildings() {
  const ADJ = ['Auto', 'Mk-II', 'Sentinel', 'Ion', 'Photon', 'Graviton', 'Quantum', 'Cryo', 'Pyro', 'Volt'];
  const CATS = {
    attack: ['Blaster Nest', 'Flak Battery', 'Pulse Cannon', 'Needler Array', 'Arc Turret', 'Seeker Pod', 'Shredder Turret', 'Beam Spire', 'Cluster Launcher', 'Vortex Cannon', 'Shrapnel Nest', 'Singularity Gun', 'Havoc Battery'],
    buff: ['Overclock Node', 'Momentum Relay', 'Ferocity Beacon', 'Precision Grid', 'Adrenal Emitter', 'Warfront Standard', 'Tactical Uplink', 'Resonance Pylon', 'Command Spire', 'Battle Chorus', 'Zeal Conduit', 'Dominion Array'],
    heal: ['Nanite Bay', 'Trauma Pod', 'Aegis Field', 'Restoration Core', 'Life Weave', 'Sanctum Beacon', 'Mending Spire', 'Vital Relay', 'Cradle Unit', 'Renewal Grid', 'Barrier Chorus', 'Salvation Node'],
    material: ['Deep Drill', 'Fabricator', 'Salvage Claw', 'Harvest Array', 'Extraction Rig', 'Synth Vat', 'Ore Crawler', 'Vapor Condenser', 'Isotope Well', 'Mint Press', 'Yield Silo', 'Bounty Conduit', 'Alloy Kiln'],
  };
  // 13-slot tier pattern: 3 common, 3 uncommon, 3 rare, 2 epic, 1 legendary, 1 mythic
  const TIER_13 = ['common', 'common', 'common', 'uncommon', 'uncommon', 'uncommon', 'rare', 'rare', 'rare', 'epic', 'epic', 'legendary', 'mythic'];
  // 12-slot tier pattern: same but one fewer epic
  const TIER_12 = ['common', 'common', 'common', 'uncommon', 'uncommon', 'uncommon', 'rare', 'rare', 'rare', 'epic', 'legendary', 'mythic'];
  const ATTACK_DMG = ['physical', 'energy', 'explosive', 'electric'];
  const BUFF_KEYS = ['atkPct', 'critPct', 'fireRatePct', 'defensePct'];
  const MAT_LOW = ['m_scrap', 'm_metal'];
  const MAT_MID = ['m_energy', 'm_crystal'];
  const MAT_HIGH = ['m_alloy', 'm_core'];

  const out = [];
  let gid = 0;

  CATS.attack.forEach((noun, i) => {
    gid++;
    const tier = TIER_13[i];
    const t = tierIndex(tier);
    const adj = ADJ[i % ADJ.length];
    const dmgType = ATTACK_DMG[i % ATTACK_DMG.length];
    const cost = t <= 1 ? { m_scrap: 20 + t * 15 } : t <= 3 ? { m_energy: 10 + t * 6, m_crystal: 3 + t * 2 } : { m_alloy: 3 + (t - 4) * 2, m_core: t === 5 ? 2 : 0 };
    const entry = {
      id: `b_gen${gid}`, name: `${adj} ${noun}`, category: 'attack', tier,
      hp: 60 + t * 15, cost, range: 240 + t * 30, damage: Math.round(5 + t * 5),
      fireRate: +(1 + t * 0.4).toFixed(2), dmgType,
    };
    if (i % 4 === 0) entry.pierce = 1 + t;
    if (i % 4 === 2) entry.splash = 50 + t * 15;
    out.push(entry);
  });

  CATS.buff.forEach((noun, i) => {
    gid++;
    const tier = TIER_12[i];
    const t = tierIndex(tier);
    const adj = ADJ[(i + 3) % ADJ.length];
    const key = BUFF_KEYS[i % 4];
    const value = key === 'critPct' ? +(0.03 + t * 0.015).toFixed(3) : key === 'defensePct' ? +(0.1 + t * 0.04).toFixed(3) : +(0.08 + t * 0.03).toFixed(3);
    const cost = t <= 1 ? { m_metal: 10 + t * 6 } : t <= 3 ? { m_crystal: 4 + t * 2 } : { m_alloy: 2 + (t - 4) * 2 };
    out.push({ id: `b_gen${gid}`, name: `${adj} ${noun}`, category: 'buff', tier, hp: 50 + t * 12, cost, range: 150 + t * 15, buff: { [key]: value } });
  });

  CATS.heal.forEach((noun, i) => {
    gid++;
    const tier = TIER_12[i];
    const t = tierIndex(tier);
    const adj = ADJ[(i + 6) % ADJ.length];
    const cost = t <= 1 ? { m_scrap: 16 + t * 8 } : t <= 3 ? { m_energy: 10 + t * 5, m_crystal: 2 + t } : { m_component: 4 + t, m_alloy: 1 + (t - 4) };
    const entry = { id: `b_gen${gid}`, name: `${adj} ${noun}`, category: 'heal', tier, hp: 55 + t * 13, cost, range: 200 + t * 20 };
    const kind = i % 3;
    if (kind === 0) entry.healPerSec = +(2 + t * 1.5).toFixed(2);
    else if (kind === 1) { entry.shieldPerSec = +(2 + t * 1.2).toFixed(2); entry.shieldCap = 60 + t * 20; }
    else entry.buildingRepairPerSec = +(2 + t * 1).toFixed(2);
    out.push(entry);
  });

  CATS.material.forEach((noun, i) => {
    gid++;
    const tier = TIER_13[i];
    const t = tierIndex(tier);
    const adj = ADJ[(i + 9) % ADJ.length];
    const cost = t <= 1 ? { m_scrap: 15 + t * 10 } : t <= 3 ? { m_metal: 12 + t * 6 } : { m_component: 6 + (t - 4) * 3 };
    const matId = t <= 1 ? MAT_LOW[i % 2] : t <= 3 ? MAT_MID[i % 2] : MAT_HIGH[i % 2];
    const rate = t <= 1 ? +(0.8 + t * 0.3).toFixed(2) : t <= 3 ? +(0.3 + t * 0.15).toFixed(2) : +(0.1 + t * 0.05).toFixed(2);
    out.push({ id: `b_gen${gid}`, name: `${adj} ${noun}`, category: 'material', tier, hp: 45 + t * 10, cost, produces: { [matId]: rate } });
  });

  return out;
}

/* ---------- js/entities/entities.js ---------- */
const MOD_entities = (function () {
// js/entities/entities.js
// Runtime entity classes. Data objects from gameData.js are combined with
// tier/level scaling to produce live instances of these classes.
//
// HOW TO EXTEND THIS FILE
// You usually don't need new classes here to add game content — a new enemy
// archetype is data in gameData.js, interpreted by EnemyManager.js, using
// the existing `Enemy` class. Add a class here only for a genuinely new kind
// of battlefield object (e.g. a deployable turret with its own lifecycle, a
// destructible obstacle). Two rules that matter everywhere else in the code:
//   - Never set `this.dead = true` from inside a stat-mutating method like
//     takeDamage(). Death is decided in ONE place — Game.resolveDeaths()
//     (js/core/Game.js) — which checks `hp <= 0 && !dead` once per frame and
//     routes the entity through the proper onEnemyDefeated/onBossDefeated
//     handler (XP, loot, stage-wave bookkeeping). Self-flagging `dead` here
//     would let entities disappear without any of that running — this
//     exact bug once caused stages to never advance because kills were
//     silently uncounted.
//   - Status effects (freeze/stun/slow/burning/etc.) are generic: push
//     `{ type, duration, value? }` via addStatus() and read it back with
//     hasStatus()/slowFactor/isStunned. Add a new effect type by giving it a
//     `type` string and reading that string wherever it should have an
//     effect (e.g. EnemyManager checks `isStunned` before moving/attacking).
const { dist, angleTo, clamp, uid } = MOD_utils;

// Entity — shared base for anything that lives on the battlefield (player,
// enemies, bosses, projectiles, buildings). Owns position, a stable `id`,
// the `dead` flag cleanup() (Game.js) uses to sweep arrays, and the generic
// status-effect list every subclass inherits for free.
class Entity {
  constructor(x, y) {
    this.id = uid('ent');
    this.x = x; this.y = y;
    this.radius = 16;
    this.dead = false;
    this.statusEffects = []; // {type, duration, tick?, value}
  }
  updateStatus(dt) {
    for (let i = this.statusEffects.length - 1; i >= 0; i--) {
      const s = this.statusEffects[i];
      s.duration -= dt;
      if (s.tick !== undefined) {
        s._acc = (s._acc || 0) + dt;
        while (s._acc >= 1) { s._acc -= 1; if (s.onTick) s.onTick(this); }
      }
      if (s.duration <= 0) this.statusEffects.splice(i, 1);
    }
  }
  hasStatus(type) { return this.statusEffects.some(s => s.type === type); }
  addStatus(effect) {
    const existing = this.statusEffects.find(s => s.type === effect.type);
    if (existing) { existing.duration = Math.max(existing.duration, effect.duration); }
    else this.statusEffects.push(effect);
  }
  get slowFactor() {
    let f = 1;
    for (const s of this.statusEffects) if (s.type === 'slow' || s.type === 'freeze') f *= (1 - s.value);
    return Math.max(0.05, f);
  }
  get isStunned() { return this.hasStatus('stun'); }
}

// ---------------------------------------------------------------------------
// Player — the base/character. `stats` is a plain object computed fresh by
// computeStats() (js/systems/progression.js) any time upgrades or gear
// change; add a new stat by adding it to BASE_STATS there, not here.
class Player extends Entity {
  constructor(x, y, stats) {
    super(x, y);
    this.radius = 20;
    this.stats = stats; // computed stats object, see UpgradeSystem/EquipmentSystem
    this.hp = stats.maxHp;
    this.shield = 0;
    this.level = 1;
    this.xp = 0;
    this.xpToNext = 20;
    this.upgradePoints = 0;
    this.resource = stats.maxResource; // ability energy
    this.fireCooldown = 0;
    this.secondaryCooldown = 0;
    this.abilityCooldowns = {}; // id -> seconds remaining
    this.aimAngle = -Math.PI / 2;
    this.facing = { x: 0, y: -1 };
  }
  takeDamage(amount, dmgType) {
    if (amount <= 0) return 0;
    let dealt = amount;
    if (this.shield > 0) {
      const absorbed = Math.min(this.shield, dealt);
      this.shield -= absorbed;
      dealt -= absorbed;
    }
    this.hp = clamp(this.hp - dealt, 0, this.stats.maxHp);
    return dealt;
  }
  gainXp(amount) {
    this.xp += amount;
    let leveled = false;
    while (this.xp >= this.xpToNext) {
      this.xp -= this.xpToNext;
      this.level++;
      // One point per level; the staircase pattern lives on the COST side
      // instead (upgradeCost() in systems/progression.js), so a stat gets
      // progressively more expensive to raise rather than points piling up
      // faster. Scaling both would cancel out.
      this.upgradePoints += 1;
      this.xpToNext = Math.floor(this.xpToNext * 1.18 + 8);
      leveled = true;
    }
    return leveled;
  }
}

// ---------------------------------------------------------------------------
// Enemy — one live instance of an ENEMIES entry (js/data/gameData.js),
// combined with a `scale` object (hp/dmg/speed/etc. multipliers) computed by
// StageManager.buildSpawnScale(). All the actual behavior — how it moves,
// attacks, and uses `special` — lives in EnemyManager.js, not here; this
// class only holds derived numbers (maxHp, armor, speed...) and the small
// bits of per-instance runtime state (timers, elite flags) those behaviors
// read and mutate.
class Enemy extends Entity {
  constructor(def, x, y, scale) {
    super(x, y);
    this.def = def;
    this.scale = scale; // {hp, dmg, speed} multipliers from StageManager
    this.radius = def.role === 'special' && def.id === 'e_splitter' ? 14 : (def.hp > 60 ? 22 : 14);
    this.maxHp = Math.round(def.hp * scale.hp);
    this.hp = this.maxHp;
    this.armor = (def.armor || 0) + (scale.armorAdd || 0);
    this.speed = def.speed * (scale.speed || 1);
    this.damage = Math.round(def.damage * scale.dmg);
    this.atkCd = def.atkCd * (scale.atkCdMult || 1);
    this.atkTimer = Math.random() * this.atkCd;
    this.xp = def.xp * (scale.xpMult || 1);
    this.isElite = !!scale.elite;
    this.eliteMods = scale.eliteMods || [];
    this.shieldHp = scale.shieldAdd || 0;
    this.regenPerSec = (def.regenPerSec || 0) + (scale.regenAdd || 0);
    this.specialTimer = 1.5 + Math.random();
    this.teleportTimer = def.teleportCd || 0;
    this.telegraphTimer = 0;
    this.telegraphing = false;
    this.chargeTarget = null;
  }
  takeDamage(amount, dmgType) {
    let dealt = amount;
    if (dmgType === 'physical' || dmgType === undefined) {
      dealt = Math.max(1, amount - this.armor * 0.5);
    }
    if (this.shieldHp > 0) {
      const absorbed = Math.min(this.shieldHp, dealt);
      this.shieldHp -= absorbed;
      dealt -= absorbed;
    }
    this.hp -= dealt;
    return dealt;
  }
}

// Boss — an Enemy with a `phases` array instead of a single fixed behavior.
// updatePhase() picks the active phase purely from current HP%; the actual
// per-pattern logic (what a phase's `pattern` string does each frame) lives
// in EnemyManager.updateBoss()'s switch statement, not here.
class Boss extends Enemy {
  constructor(def, x, y, scale) {
    super({ ...def, armor: def.armor || 0, atkCd: def.atkCd, damage: def.damage, speed: def.speed, hp: def.hp, xp: def.xp || 200 }, x, y, scale);
    this.isBoss = true;
    this.major = !!def.major;
    // "Big" is part of the boss identity (slow + big + an endless escort
    // fleet, per the design brief) — sized well beyond the largest regular
    // enemy (~22px) so a boss is unmistakable on-screen even in a crowd.
    this.radius = def.major ? 70 : 52;
    this.phaseIndex = 0;
    this.phases = def.phases;
    this.currentPattern = this.phases[0].pattern;
    this.patternTimer = 1;
    this.weakpoint = def.weakpointHit || false;
    this.enraged = false;
    this.summonTimer = 3;
  }
  updatePhase() {
    const hpPct = this.hp / this.maxHp;
    let idx = this.phases.length - 1;
    for (let i = 0; i < this.phases.length; i++) {
      if (hpPct > this.phases[i].hpAbove) { idx = i; break; }
    }
    if (idx !== this.phaseIndex) {
      this.phaseIndex = idx;
      this.currentPattern = this.phases[idx].pattern;
      this.enraged = !!this.phases[idx].enrage;
      return true; // phase changed — caller can trigger VFX/announce
    }
    return false;
  }
}

// ---------------------------------------------------------------------------
// Projectile — a generic moving hit-scan/travel-time bolt used by the
// player, buildings, AND enemies (`owner` distinguishes who it can hit —
// see CollisionSystem/resolveProjectileHits in Game.js). `visual` is just a
// string key the Renderer looks up a color/shape for — add a new one there
// (colorMap in Renderer.drawProjectiles()) rather than adding a new class.
class Projectile extends Entity {
  constructor(opts) {
    super(opts.x, opts.y);
    Object.assign(this, {
      vx: 0, vy: 0, speed: opts.speed || 500, angle: opts.angle || 0,
      damage: opts.damage || 1, dmgType: opts.dmgType || 'physical', crit: opts.crit || false,
      owner: opts.owner || 'player', pierce: opts.pierce || 0, hitIds: new Set(),
      splash: opts.splash || 0, splashFalloff: opts.splashFalloff || 0.5,
      range: opts.range || 600, traveled: 0, radius: opts.radius || 5,
      visual: opts.visual || 'bullet', homing: opts.homing || null, life: opts.life || 4,
      statusOnHit: opts.statusOnHit || null, bounces: opts.bounces || 0,
    });
    this.vx = Math.cos(this.angle) * this.speed;
    this.vy = Math.sin(this.angle) * this.speed;
  }
  update(dt) {
    if (this.homing && !this.homing.dead) {
      const desired = angleTo(this.x, this.y, this.homing.x, this.homing.y);
      let diff = desired - this.angle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      this.angle += clamp(diff, -4 * dt, 4 * dt);
      this.vx = Math.cos(this.angle) * this.speed;
      this.vy = Math.sin(this.angle) * this.speed;
    }
    this.x += this.vx * dt; this.y += this.vy * dt;
    const d = this.speed * dt;
    this.traveled += d;
    this.life -= dt;
    if (this.traveled >= this.range || this.life <= 0) this.dead = true;
  }
}

// ---------------------------------------------------------------------------
// Building — one placed instance of a BUILDINGS entry, sitting on one of the
// four hex platforms (platformIdx). Its per-tick behavior is entirely in
// updateBuilding() (js/systems/combat.js), keyed off `def.category` — this
// class just holds hp/level/tier and small per-instance timers.
class Building extends Entity {
  constructor(def, platformIdx, x, y, tier) {
    super(x, y);
    this.def = def;
    this.platformIdx = platformIdx;
    this.tier = tier || def.tier;
    this.level = 1;
    this.radius = 22;
    this.maxHp = def.hp;
    this.hp = this.maxHp;
    this.fireCooldown = 0;
    this.produceAcc = 0;
  }
}

return { Entity, Player, Enemy, Boss, Projectile, Building };
})();

/* ---------- js/systems/systems.js ---------- */
const MOD_systems = (function () {
// js/systems/systems.js
// Generic gameplay systems that aren't tied to one specific entity type:
// collision detection, particles, floating damage numbers, damage/crit
// rolls, and loot rolls. Combat/ability/building *behavior* lives in
// js/systems/combat.js instead — this file is the lower-level toolkit that
// file (and Game.js) builds on.
//
// HOW TO EXTEND THIS FILE
//   - New collision query (e.g. "enemies in a cone/rectangle"): add a method
//     to CollisionSystem alongside findNearestEnemy()/enemiesInRadius().
//   - New visual effect built from many small dots (impacts, trails, etc.):
//     reuse ParticleSystem.emit() with different color/count/speed/shape —
//     you rarely need a new system for this, just a new emit() call site.
//   - New loot rule (e.g. guaranteed drops, pity timers): extend LootSystem;
//     both its methods are pure functions of (input, luck) -> result, so
//     keep new ones side-effect-free and let the caller (Game.js) apply them.
const { dist, clamp, randRange, weightedChoice, rng } = MOD_utils;
const { TIERS, tierIndex, MATERIALS } = MOD_gameData;

// --- Simple uniform-grid spatial hash for broad-phase collision -----------
class SpatialGrid {
  constructor(cellSize = 80) { this.cellSize = cellSize; this.map = new Map(); }
  key(x, y) { return `${Math.floor(x / this.cellSize)},${Math.floor(y / this.cellSize)}`; }
  clear() { this.map.clear(); }
  insert(entity) {
    const k = this.key(entity.x, entity.y);
    if (!this.map.has(k)) this.map.set(k, []);
    this.map.get(k).push(entity);
  }
  queryRadius(x, y, r) {
    const results = [];
    const cellR = Math.ceil(r / this.cellSize) + 1;
    const cx = Math.floor(x / this.cellSize), cy = Math.floor(y / this.cellSize);
    for (let dx = -cellR; dx <= cellR; dx++) {
      for (let dy = -cellR; dy <= cellR; dy++) {
        const bucket = this.map.get(`${cx + dx},${cy + dy}`);
        if (bucket) results.push(...bucket);
      }
    }
    return results;
  }
}

class CollisionSystem {
  constructor() { this.grid = new SpatialGrid(90); }
  rebuild(enemies) {
    this.grid.clear();
    for (const e of enemies) if (!e.dead) this.grid.insert(e);
  }
  findNearestEnemy(x, y, range, enemies) {
    let best = null, bestD = range;
    for (const e of this.grid.queryRadius(x, y, range)) {
      if (e.dead) continue;
      const d = dist(x, y, e.x, e.y);
      if (d < bestD) { bestD = d; best = e; }
    }
    return best;
  }
  enemiesInRadius(x, y, r) {
    return this.grid.queryRadius(x, y, r).filter(e => !e.dead && dist(x, y, e.x, e.y) <= r);
  }
  checkProjectileHits(projectiles, enemies) {
    const hits = []; // {proj, enemy}
    for (const p of projectiles) {
      if (p.dead || p.owner !== 'player') continue;
      const nearby = this.grid.queryRadius(p.x, p.y, 40);
      for (const e of nearby) {
        if (e.dead || p.hitIds.has(e.id)) continue;
        if (dist(p.x, p.y, e.x, e.y) <= e.radius + p.radius) {
          hits.push({ proj: p, enemy: e });
        }
      }
    }
    return hits;
  }
}

// --- Particles --------------------------------------------------------------
class ParticleSystem {
  constructor(maxParticles = 400) {
    this.particles = [];
    this.max = maxParticles;
  }
  emit(x, y, opts = {}) {
    if (this.particles.length >= this.max) this.particles.shift();
    const count = opts.count || 1;
    for (let i = 0; i < count; i++) {
      const angle = opts.angle !== undefined ? opts.angle + randRange(-0.3, 0.3) : randRange(0, Math.PI * 2);
      const speed = randRange(opts.minSpeed || 40, opts.maxSpeed || 160);
      this.particles.push({
        x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: opts.life || randRange(0.3, 0.7), maxLife: opts.life || 0.6,
        color: opts.color || '#38bdf8', size: opts.size || randRange(2, 4), gravity: opts.gravity || 0,
        shape: opts.shape || 'circle',
      });
    }
  }
  update(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.life -= dt;
      if (p.life <= 0) { this.particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += (p.gravity || 0) * dt;
      p.vx *= 0.96; p.vy *= 0.96;
    }
  }
}

// --- Floating damage numbers -------------------------------------------------
class DamageNumberSystem {
  constructor() { this.items = []; }
  add(x, y, amount, opts = {}) {
    // `opts.text` overrides the numeric readout (e.g. 'IMMUNE' for
    // invincible dungeon bosses) — everything else renders identically.
    this.items.push({ x, y, amount: Math.round(amount), text: opts.text || null, life: 0.8, maxLife: 0.8, crit: !!opts.crit, color: opts.color || '#fff', vy: -50 });
  }
  update(dt) {
    for (let i = this.items.length - 1; i >= 0; i--) {
      const d = this.items[i];
      d.life -= dt; d.y += d.vy * dt; d.vy *= 0.92;
      if (d.life <= 0) this.items.splice(i, 1);
    }
  }
}

// --- Damage calculation ------------------------------------------------------
const DamageSystem = {
  rollCrit(critChance) { return rng() < clamp(critChance, 0, 0.95); },
  computeHit(baseDamage, { critChance = 0, critMult = 1.5 } = {}) {
    const isCrit = DamageSystem.rollCrit(critChance);
    return { amount: isCrit ? baseDamage * critMult : baseDamage, isCrit };
  },
};

// --- Loot rolling -------------------------------------------------------------
const LootSystem = {
  rollMaterials(lootIds, luckBonus = 0) {
    const drops = {};
    for (const id of lootIds) {
      if (rng() < 0.85 + luckBonus) {
        drops[id] = (drops[id] || 0) + Math.ceil(randRange(1, 3));
      }
    }
    return drops;
  },
  rollEquipmentTier(baseChance = 0.02, luckBonus = 0) {
    if (rng() > baseChance + luckBonus) return null;
    const weights = [
      { item: 'common', weight: 45 }, { item: 'uncommon', weight: 30 }, { item: 'rare', weight: 15 },
      { item: 'epic', weight: 7 }, { item: 'legendary', weight: 2.5 }, { item: 'mythic', weight: 0.5 },
    ];
    return weightedChoice(weights);
  },
};

return { SpatialGrid, CollisionSystem, ParticleSystem, DamageNumberSystem, DamageSystem, LootSystem };
})();

/* ---------- js/systems/progression.js ---------- */
const MOD_progression = (function () {
// js/systems/progression.js
// Turns save data (character upgrades + equipped gear + passive abilities)
// into the live `stats` object the Player entity uses every frame. This is
// the ONLY place stat scaling happens — combat/UI code should always read
// player.stats rather than re-deriving anything from save data directly.
//
// HOW TO EXTEND THIS FILE
//   - New base stat: add it to BASE_STATS below, give it a sensible default,
//     then it's automatically available as `player.stats.<name>` everywhere.
//   - New character-upgrade stat: add an entry to UPGRADE_EFFECTS (label +
//     per-point amount) AND a matching line in computeStats() that adds
//     `up.<key> * UPGRADE_EFFECTS.<key>.per` to `s.<name>`. UIManager's
//     Character panel renders UPGRADE_EFFECTS generically, so no UI changes
//     needed — just make sure the save's default `upgrades` object
//     (js/managers/SaveSystem.js defaultSave()) has a matching key starting
//     at 0, or existing saves will read `undefined` for it.
//   - New gear stat: just use a new key in an ARMOR/WEAPONS entry's `stats`
//     object (js/data/gameData.js) — computeStats() copies any key through
//     automatically. It only affects gameplay if something reads
//     `player.stats.<thatKey>` elsewhere (weapon firing, ability effects,
//     building buffs...).
//   - New passive ability: add the ABILITIES entry (type: 'passive') in
//     gameData.js, then add a matching case to applyPassive()'s `map` below.
const { EQUIPMENT, TIERS, tierIndex, getById, BUFFS } = MOD_gameData;
const { pointsForLevel } = MOD_utils;

// The stat sheet before any upgrades/gear/passives are applied. Every key
// here becomes a real stat on player.stats — add new stats here first.
const BASE_STATS = {
  maxHp: 100, defense: 4, atk: 8, fireRate: 1.0, crit: 0.05, critMult: 1.5,
  regen: 0.4, abilityPower: 1.0, maxResource: 100, move: 190, range: 1.0,
  lootChance: 0, pierce: 0, armorPen: 0, buildingPct: 0, productionPct: 0,
};

// Effect of one upgrade rank on a given stat. `label` is shown verbatim in
// the Character panel; `per` is how much of the stat one rank buys. Cost is
// NOT stored here — it scales with the stat's current level via
// upgradeCost() below, so there's one place to change the cost curve.
const UPGRADE_EFFECTS = {
  hp: { label: 'Max HP', per: 12 },
  defense: { label: 'Defense', per: 2 },
  atk: { label: 'Attack', per: 2 },
  fireRate: { label: 'Attack Speed', per: 0.03 },
  crit: { label: 'Crit Chance', per: 0.01 },
  critMult: { label: 'Crit Damage', per: 0.05 },
  regen: { label: 'Regeneration', per: 0.15 },
  abilityPower: { label: 'Ability Power', per: 0.04 },
  resource: { label: 'Resource Capacity', per: 8 },
  move: { label: 'Move Speed', per: 4 },
};

function computeStats(saveData) {
  const s = { ...BASE_STATS };
  const up = saveData.character.upgrades;
  s.maxHp += up.hp * UPGRADE_EFFECTS.hp.per;
  s.defense += up.defense * UPGRADE_EFFECTS.defense.per;
  s.atk += up.atk * UPGRADE_EFFECTS.atk.per;
  s.fireRate += up.fireRate * UPGRADE_EFFECTS.fireRate.per;
  s.crit += up.crit * UPGRADE_EFFECTS.crit.per;
  s.critMult += up.critMult * UPGRADE_EFFECTS.critMult.per;
  s.regen += up.regen * UPGRADE_EFFECTS.regen.per;
  s.abilityPower += up.abilityPower * UPGRADE_EFFECTS.abilityPower.per;
  s.maxResource += up.resource * UPGRADE_EFFECTS.resource.per;
  s.move += up.move * UPGRADE_EFFECTS.move.per;

  // Equipped gear
  const loadout = saveData.loadout;
  const slots = ['main', 'secondary', 'helmet', 'armor', 'gloves', 'boots', 'accessory1', 'accessory2'];
  for (const slot of slots) {
    const defId = loadout[slot];
    if (!defId) continue;
    const item = findInventoryItem(saveData, defId, slot);
    const def = getById(EQUIPMENT, item ? item.defId : defId);
    if (!def) continue;
    const tier = item ? item.tier : def.tier;
    const tierMult = TIERS[tierIndex(tier)].mult;
    const level = item ? item.level : 1;
    const lvlMult = 1 + (level - 1) * 0.08;
    if (def.stats) {
      for (const [k, v] of Object.entries(def.stats)) {
        s[k] = (s[k] || 0) + v * tierMult * lvlMult;
      }
    }
  }

  // Passive abilities
  for (const abId of loadout.abilitiesPassive || []) {
    applyPassive(s, abId);
  }

  // Active Buffs bought with Gems (Game.buyBuff()) — only ones still
  // running (remaining seconds > 0; Game.updateActiveBuffs() removes
  // expired entries from save.activeBuffs, but guard here too in case
  // stats get recomputed between that cleanup and this call).
  for (const [buffId, remaining] of Object.entries(saveData.activeBuffs || {})) {
    if (remaining <= 0) continue;
    const buff = getById(BUFFS, buffId);
    if (!buff) continue;
    for (const [key, value] of Object.entries(buff.effect)) s[key] = (s[key] || 0) + value;
  }
  return s;
}

function findInventoryItem(saveData, defId, slot) {
  return saveData.inventory.items.find(i => i.uid === defId) || null;
}

function applyPassive(s, abilityId) {
  // Add a new passive by adding a key here matching its ABILITIES `id`.
  const map = {
    pa_atkspeed: () => { s.fireRate += 0.1; },
    pa_crit: () => { s.crit += 0.05; },
    pa_armorpen: () => { s.armorPen += 0.2; },
    pa_regen: () => { s.regen += 0.8; },
    pa_pierce: () => { s.pierce += 1; },
    pa_buildpower: () => { s.buildingPct += 0.15; },
    pa_matprod: () => { s.productionPct += 0.2; },
    pa_lootchance: () => { s.lootChance += 0.15; },
  };
  if (map[abilityId]) map[abilityId]();
}

// How many upgrade points it costs to raise a stat from `currentLevel` to
// the next rank. Follows the staircase pattern (see pointsForLevel() in
// core/utils.js): raising a stat TO level 1 costs 1, to levels 2-3 costs 2
// each, to levels 4-6 costs 3 each, to 7-10 costs 4 each, and so on — so a
// stat sitting at Lv.3 costs 3 points to push to Lv.4.
// This is the single source of truth for upgrade cost: UIManager's Character
// panel calls it for both the button label and the affordability check, and
// Game.spendUpgradePoint() calls it again to actually charge the points.
// (UPGRADE_EFFECTS entries no longer carry a static `cost` — this replaces it.)
function upgradeCost(statKey, currentLevel) {
  return pointsForLevel(currentLevel + 1);
}

return { UPGRADE_EFFECTS, computeStats, upgradeCost };
})();

/* ---------- js/systems/combat.js ---------- */
const MOD_combat = (function () {
// js/systems/combat.js
// The three "how do things fight" systems: weapon firing patterns, ability
// effects, and building behavior. All three are dispatched from data (a
// `behavior`/`effect`/`category` string in gameData.js) rather than having
// separate code paths per weapon/ability/building — see the HOW TO EXTEND
// note above each section below for exactly where to add a new one.
const { Projectile } = MOD_entities;
const { angleTo, dist, clamp, randRange } = MOD_utils;
const { TIERS, tierIndex, getById, WEAPONS, ABILITIES } = MOD_gameData;
const { DamageSystem } = MOD_systems;

function weaponScale(weaponDef, tier, level) {
  const tierMult = TIERS[tierIndex(tier)].mult;
  const lvlMult = 1 + (level - 1) * 0.08;
  return tierMult * lvlMult;
}

// Fires the player's equipped main/secondary weapon at the nearest enemy.
// ctx = { player, target, spawnProjectile, particles, weaponState, dt }
function fireWeapon(weaponDef, tier, level, owner, target, ctx) {
  const mult = weaponScale(weaponDef, tier, level);
  const damage = weaponDef.damage * mult * (owner.stats ? (owner.stats.atk / 8) : 1);
  const critChance = weaponDef.crit + (owner.stats ? owner.stats.crit - 0.05 : 0);
  const critMult = weaponDef.critMult + (owner.stats ? owner.stats.critMult - 1.5 : 0);
  const angle = angleTo(owner.x, owner.y, target.x, target.y);
  const pierce = weaponDef.pierce + (owner.stats ? owner.stats.pierce : 0);
  const range = weaponDef.range * (owner.stats ? owner.stats.range : 1);

  const makeProj = (a, extra = {}) => {
    const hit = DamageSystem.computeHit(damage, { critChance, critMult });
    ctx.spawnProjectile(new Projectile({
      x: owner.x, y: owner.y, angle: a, speed: weaponDef.projSpeed || 600,
      damage: hit.amount, dmgType: weaponDef.dmgType, owner: 'player', crit: hit.isCrit,
      pierce, splash: weaponDef.splash || 0, splashFalloff: weaponDef.splashFalloff || 0.5,
      range, radius: 6, visual: weaponDef.projectile, bounces: weaponDef.bounces || 0, ...extra,
    }));
  };

  // HOW TO ADD A NEW WEAPON BEHAVIOR
  // Reusing 'single'/'spread'/'beam'/'charge'/'chain' is pure data (just set
  // `behavior` on the WEAPONS entry in gameData.js). For a genuinely new
  // firing pattern, add a case here that calls makeProj() one or more times
  // with whatever angle/extra overrides you need (makeProj already applies
  // damage/crit/pierce/splash/range from the weapon def + owner's stats).
  // NOTE: chain weapons are actually special-cased in Game.updatePlayerCombat()
  // (js/core/Game.js), which calls resolveChain() directly instead of routing
  // through here — the 'chain' case below exists for building-fired or future
  // non-player callers of fireWeapon() and expects ctx.resolveChain to exist.
  switch (weaponDef.behavior) {
    case 'spread': {
      const n = weaponDef.pellets || 5;
      for (let i = 0; i < n; i++) {
        const off = (i - (n - 1) / 2) * (weaponDef.spread / n);
        makeProj(angle + off);
      }
      break;
    }
    case 'chain': {
      // Instant chain-lightning: resolved immediately rather than as a projectile.
      ctx.resolveChain(owner, target, weaponDef, damage, critChance, critMult);
      break;
    }
    case 'charge':
    case 'beam':
    case 'single':
    default:
      makeProj(angle);
      break;
  }
}

function resolveChain(owner, firstTarget, weaponDef, damage, critChance, critMult, ctx) {
  let current = firstTarget;
  const hitSet = new Set();
  for (let i = 0; i < (weaponDef.chainCount || 3); i++) {
    if (!current) break;
    hitSet.add(current.id);
    const hit = DamageSystem.computeHit(damage * Math.pow(0.85, i), { critChance, critMult });
    const dealt = current.takeDamage(hit.amount, weaponDef.dmgType);
    ctx.dmgNumbers.add(current.x, current.y - 16, dealt, { crit: hit.isCrit, color: hit.isCrit ? '#ffb020' : '#38bdf8' });
    ctx.particles.emit(current.x, current.y, { color: '#38bdf8', count: 6 });
    if (i < (weaponDef.chainCount || 3) - 1) {
      const candidates = ctx.collision.enemiesInRadius(current.x, current.y, weaponDef.chainRange || 180)
        .filter(e => !hitSet.has(e.id));
      candidates.sort((a, b) => dist(current.x, current.y, a.x, a.y) - dist(current.x, current.y, b.x, b.y));
      current = candidates[0] || null;
    }
  }
}

// --- Ability effects -------------------------------------------------------
// ctx = { player, enemies, collision, particles, dmgNumbers, spawnProjectile,
//         buildings, bus, w, h }
function executeAbility(ability, ctx) {
  const p = ctx.player;
  const power = p.stats.abilityPower || 1;
  // HOW TO ADD A NEW ACTIVE ABILITY EFFECT
  // Add the ABILITIES entry in gameData.js with a unique `effect` string,
  // then add a matching `case` below. `ctx` gives you everything you'll
  // typically need: player, enemies, collision (for radius queries),
  // particles/dmgNumbers (for feedback), spawnProjectile, bus (for
  // telegraph/shake events the Renderer/UI pick up), and w/h (battlefield
  // size). Multiply damage by `power` (== player.stats.abilityPower) so the
  // Ability Power stat/upgrade actually affects it.
  switch (ability.effect) {
    case 'orbitalStrike':
    case 'meteor': {
      const target = ctx.aimPoint || { x: p.x, y: p.y - 120 };
      const doStrike = () => {
        ctx.particles.emit(target.x, target.y, { color: '#ffb020', count: 30, minSpeed: 100, maxSpeed: 260, life: 0.6 });
        for (const e of ctx.collision.enemiesInRadius(target.x, target.y, ability.radius)) {
          const dealt = e.takeDamage(ability.damage * power, 'explosive');
          ctx.dmgNumbers.add(e.x, e.y - 16, dealt, { color: '#ffb020' });
        }
        ctx.bus.emit('shake', { amount: 8 });
      };
      if (ability.delay) { ctx.bus.emit('telegraph', { x: target.x, y: target.y, radius: ability.radius, time: ability.delay }); setTimeout(doStrike, ability.delay * 1000); }
      else doStrike();
      break;
    }
    case 'emp': {
      for (const e of ctx.collision.enemiesInRadius(p.x, p.y, ability.radius)) {
        e.addStatus({ type: 'stun', duration: ability.stunTime });
      }
      ctx.particles.emit(p.x, p.y, { color: '#38bdf8', count: 26 });
      break;
    }
    case 'freeze': {
      for (const e of ctx.collision.enemiesInRadius(p.x, p.y, ability.radius)) {
        e.addStatus({ type: 'freeze', duration: ability.duration, value: ability.slowPct });
      }
      ctx.particles.emit(p.x, p.y, { color: '#8be9ff', count: 26 });
      break;
    }
    case 'lightningStorm': {
      const targets = [...ctx.enemies].filter(e => !e.dead).sort(() => Math.random() - 0.5).slice(0, ability.strikes);
      for (const t of targets) {
        const dealt = t.takeDamage(ability.damage * power, 'electric');
        ctx.dmgNumbers.add(t.x, t.y - 16, dealt, { color: '#8be9ff' });
        ctx.particles.emit(t.x, t.y, { color: '#8be9ff', count: 10 });
      }
      break;
    }
    case 'heal': {
      p.hp = clamp(p.hp + p.stats.maxHp * ability.amount, 0, p.stats.maxHp);
      ctx.particles.emit(p.x, p.y, { color: '#3ddc84', count: 20 });
      break;
    }
    case 'shield': {
      p.shield += ability.amount * power;
      break;
    }
    case 'rapidfire': {
      p.addStatus({ type: 'rapidfire', duration: ability.duration, fireRateMult: ability.fireRateMult });
      break;
    }
    case 'berserk': {
      p.addStatus({ type: 'berserk', duration: ability.duration, atkMult: ability.atkMult, defMult: ability.defMult });
      break;
    }
    case 'deployTurret': {
      ctx.deployTurret(ability);
      break;
    }
    case 'bombardment': {
      let wave = 0;
      const dropWave = () => {
        const tx = p.x + randRange(-160, 160), ty = p.y + randRange(-220, -60);
        ctx.particles.emit(tx, ty, { color: '#ffb020', count: 20 });
        for (const e of ctx.collision.enemiesInRadius(tx, ty, ability.radius)) {
          const dealt = e.takeDamage(ability.damage * power, 'explosive');
          ctx.dmgNumbers.add(e.x, e.y - 16, dealt, { color: '#ffb020' });
        }
        wave++;
        if (wave < ability.waves) setTimeout(dropWave, 260);
      };
      dropWave();
      break;
    }
    case 'timeslow': {
      for (const e of ctx.enemies) e.addStatus({ type: 'slow', duration: ability.duration, value: ability.slowPct });
      break;
    }
    default: break;
  }
}

// --- Buildings ---------------------------------------------------------
// ctx = { player, collision, spawnProjectile, particles, dmgNumbers, materials(add fn) }
// HOW TO ADD A NEW BUILDING CATEGORY
// Reusing 'attack'/'buff'/'heal'/'material' is pure data (BUILDINGS entry in
// gameData.js). A genuinely new category needs a new `else if` branch below;
// buff-category buildings are the odd one out — they do nothing here and
// are instead read passively by getBuildingBuffs() whenever something needs
// to know the player's current buffs (see updatePlayerCombat() in Game.js).
function updateBuilding(b, dt, ctx) {
  if (b.hp <= 0) return;
  const def = b.def;
  const tierMult = TIERS[tierIndex(b.tier)].mult;
  const lvlMult = 1 + (b.level - 1) * 0.15;

  if (def.category === 'attack') {
    b.fireCooldown -= dt;
    if (b.fireCooldown <= 0) {
      const target = ctx.collision.findNearestEnemy(b.x, b.y, def.range, ctx.enemies);
      if (target) {
        b.fireCooldown = 1 / (def.fireRate * lvlMult);
        const angle = angleTo(b.x, b.y, target.x, target.y);
        const dmg = def.damage * tierMult * lvlMult;
        ctx.spawnProjectile(new Projectile({
          x: b.x, y: b.y, angle, speed: 620, damage: dmg, dmgType: def.dmgType,
          owner: 'player', pierce: def.pierce || 0, splash: def.splash || 0,
          range: def.range * 1.1, radius: 5, visual: 'buildingBolt',
        }));
      }
    }
  } else if (def.category === 'heal') {
    if (def.healPerSec) {
      const p = ctx.player;
      if (dist(b.x, b.y, p.x, p.y) <= def.range) {
        p.hp = clamp(p.hp + def.healPerSec * lvlMult * dt, 0, p.stats.maxHp);
      }
    }
    if (def.shieldPerSec) {
      const p = ctx.player;
      if (dist(b.x, b.y, p.x, p.y) <= def.range) {
        p.shield = clamp(p.shield + def.shieldPerSec * lvlMult * dt, 0, def.shieldCap);
      }
    }
    if (def.buildingRepairPerSec) {
      for (const other of ctx.buildings) {
        if (other === b || other.hp <= 0) continue;
        if (dist(b.x, b.y, other.x, other.y) <= def.range) {
          other.hp = clamp(other.hp + def.buildingRepairPerSec * lvlMult * dt, 0, other.maxHp);
        }
      }
    }
  } else if (def.category === 'material') {
    b.produceAcc += dt;
    while (b.produceAcc >= 1) {
      b.produceAcc -= 1;
      for (const [matId, rate] of Object.entries(def.produces)) {
        ctx.addMaterial(matId, rate * tierMult * lvlMult * (1 + (ctx.player.stats.productionPct || 0)));
      }
    }
  }
  // buff buildings are read passively by getBuildingBuffs() below — no per-tick work needed
}

function getBuildingBuffs(buildings, px, py) {
  // Add a new buff key by using it in a BUILDINGS entry's `buff` object
  // (gameData.js) — it's summed here automatically. To make a new key
  // actually do something, add a matching entry to the `buffs` default
  // object below and read it wherever it should apply (updatePlayerCombat()
  // in Game.js currently reads atkPct/critPct/critMultPct/fireRatePct).
  const buffs = { atkPct: 0, critPct: 0, critMultPct: 0, fireRatePct: 0, defensePct: 0 };
  for (const b of buildings) {
    if (!b || b.hp <= 0 || b.def.category !== 'buff') continue;
    if (dist(b.x, b.y, px, py) <= b.def.range) {
      const buff = b.def.buff;
      for (const [k, v] of Object.entries(buff)) buffs[k] = (buffs[k] || 0) + v;
    }
  }
  return buffs;
}

return { fireWeapon, resolveChain, executeAbility, updateBuilding, getBuildingBuffs };
})();

/* ---------- js/managers/StageManager.js ---------- */
const MOD_StageManager = (function () {
// js/managers/StageManager.js
// Drives stage -> wave -> spawn-queue progression. All scaling is computed
// from the stage number procedurally so stage 1, 100 and 10,000 all "just
// work" without hard-coded tables.
//
// HOW TO EXTEND THIS FILE
//   - New enemy: add its id + the stage it should start appearing at to
//     UNLOCK_STAGE below (forgetting this is the #1 reason a new enemy
//     never spawns — availableEnemyIds() only offers ids listed here).
//   - Tune overall pacing: WAVES_PER_STAGE (waves per stage) and the curve
//     functions inside difficultyScale() (hp/dmg/speed/count/eliteChance/
//     specialChance/spawnInterval, all as smooth functions of stage number,
//     not a lookup table — keep them smooth so very high stages don't need
//     special-casing).
//   - New elite-modifier field: add the field to an ELITE_MODIFIERS entry in
//     gameData.js, then read it in buildSpawnScale() below (multiplier
//     fields like *Mult are applied automatically in the loop; anything
//     else — like armorAdd/regenAdd/shieldAdd — needs an explicit line).
//   - New boss selection rule: pickBossDef() below decides which boss spawns
//     for a given stage; it's independent from the ENEMIES unlock system.
//   - Boss cadence: every stage's LAST wave (wave WAVES_PER_STAGE) triggers
//     a boss fight instead of advancing straight to the next stage — see
//     the `this.wave > WAVES_PER_STAGE` branch in update(). The stage only
//     actually advances once the boss dies (Game.js calls
//     notifyBossDefeated()). isMajorBossStage() picks out every 50th stage
//     for the tougher "major" flavor; every other stage still gets a
//     regular boss, just far more often than before.
const { ENEMIES, ELITE_MODIFIERS, BOSSES } = MOD_gameData;
const { clamp, choice, weightedChoice, randInt, rng } = MOD_utils;

const WAVES_PER_STAGE = 8;

// Enemy pool unlock thresholds — new archetypes phase in as stages climb so
// early game stays simple and late game gets combinatorially harder.
// *** Add every new ENEMIES entry's id here, or it will never spawn. ***
const UNLOCK_STAGE = {
  e_walker: 1, e_runner: 1, e_swarm: 1,
  e_tank: 2, e_rifle: 3, e_armored: 4, e_charger: 5,
  e_gunner: 6, e_sniper: 7, e_shield: 8, e_healer: 9,
  e_bladefiend: 10, e_rocketeer: 12, e_plasma: 14, e_buffer: 16,
  e_berserker: 18, e_teleporter: 20, e_summoner: 22, e_splitter: 25,
  e_exploder: 28, e_regenerator: 32,
};

function isMajorBossStage(stage) { return stage % 50 === 0; }

// The endless-scaling curve. Every number here is a smooth function of
// `stage`, not a table — that's what lets the game "technically support"
// stage 10,000 without special-casing. Tweak the coefficients to change
// pacing; keep the shape (diminishing/capped growth for speed and count,
// unbounded for hp/dmg) so the game doesn't become unwinnable or trivial at
// the extremes.
function difficultyScale(stage) {
  const n = Math.max(1, stage);
  const hp = 1 + n * 0.09 + Math.pow(n, 1.28) * 0.012;
  const dmg = 1 + n * 0.06 + Math.pow(n, 1.15) * 0.009;
  const speed = 1 + Math.min(1.1, n * 0.012);
  // Both `count` (enemies per wave, multiplied into startWave()'s baseCount
  // below) and `spawnInterval` (seconds between spawns) control how dense a
  // wave feels — raised together so early stages have noticeably more
  // enemies on screen at once, not just a slightly longer wave.
  const count = 1 + Math.min(3.2, Math.pow(n, 0.42) * 0.55);
  const eliteChance = clamp(0.03 + n * 0.0035, 0, 0.55);
  const specialChance = clamp(0.02 + n * 0.002, 0, 0.35);
  const spawnInterval = clamp(0.75 - n * 0.005, 0.12, 0.75);
  return { hp, dmg, speed, count, eliteChance, specialChance, spawnInterval };
}

function availableEnemyIds(stage) {
  return Object.keys(UNLOCK_STAGE).filter(id => stage >= UNLOCK_STAGE[id]);
}

function rollElite(scale) {
  const n = randInt(1, stage_ELITE_CAP(scale));
  const mods = [];
  const pool = [...ELITE_MODIFIERS];
  for (let i = 0; i < n; i++) {

class StageManager {
  constructor(bus) {
    this.bus = bus;
    this.stage = 1;
    this.wave = 1;
    this.waveTimer = 0;
    this.spawnTimer = 0;
    this.enemiesRemainingInWave = 0;
    this.enemiesAliveFromWave = 0;
    this.waveActive = false;
    this.bossActive = false;
    this.betweenStageTimer = 0;
    this.stageIntroTimer = 2.2;
  }

  reset() {
    this.stage = 1; this.wave = 1; this.waveTimer = 0; this.spawnTimer = 0;
    this.enemiesRemainingInWave = 0; this.enemiesAliveFromWave = 0; this.waveActive = false;
    this.bossActive = false; this.stageIntroTimer = 2.2;
  }

  get scale() { return difficultyScale(this.stage); }

  startWave() {
    const scale = this.scale;
    this.waveActive = true;
    const baseCount = 7 + this.wave * 1.8;
    this.enemiesRemainingInWave = Math.round(baseCount * scale.count);
    this.enemiesAliveFromWave = 0;
    this.spawnTimer = 0;
    this.bus.emit('waveStart', { stage: this.stage, wave: this.wave, count: this.enemiesRemainingInWave });
  }

  pickEnemyDef() {
    const pool = availableEnemyIds(this.stage);
    const id = choice(pool);
    return ENEMIES.find(e => e.id === id);
  }

  buildSpawnScale(elite) {
    const scale = this.scale;
    const out = { hp: scale.hp, dmg: scale.dmg, speed: scale.speed, atkCdMult: 1, xpMult: 1 + this.stage * 0.02 };
    if (elite && elite.length) {
      out.elite = true; out.eliteMods = elite;
      for (const m of elite) {
        out.hp *= m.hpMult; out.dmg *= m.dmgMult; out.speed *= m.speedMult;
        if (m.armorAdd) out.armorAdd = (out.armorAdd || 0) + m.armorAdd;
        if (m.regenAdd) out.regenAdd = (out.regenAdd || 0) + m.regenAdd;
        if (m.shieldAdd) out.shieldAdd = (out.shieldAdd || 0) + m.shieldAdd;
        if (m.atkCdMult) out.atkCdMult *= m.atkCdMult;
      }
    }
    return out;
  }

  // Called every frame; returns array of {def, scale} to spawn this tick.
  update(dt) {
    const toSpawn = [];
    if (this.stageIntroTimer > 0) { this.stageIntroTimer -= dt; return toSpawn; }

    if (this.bossActive) return toSpawn;

    if (!this.waveActive && this.enemiesAliveFromWave <= 0) {
      this.betweenStageTimer -= dt;
      if (this.betweenStageTimer <= 0) {
        this.betweenStageTimer = 1.4;
        if (this.wave > WAVES_PER_STAGE) {
          // Every stage's last wave culminates in a boss fight (see the
          // header comment above) — the stage doesn't advance until the
          // boss actually dies (notifyBossDefeated(), called from Game.js).
          this.bossActive = true;
          this.bus.emit('bossStart', { stage: this.stage, major: isMajorBossStage(this.stage) });
        } else {
          this.startWave();
        }
      }
      return toSpawn;
    }

    if (this.enemiesRemainingInWave > 0) {
      this.spawnTimer -= dt;
      if (this.spawnTimer <= 0) {
        this.spawnTimer = this.scale.spawnInterval;
        const scale = this.scale;
        const elite = rng() < scale.eliteChance ? rollElite(scale) : [];
        const def = this.pickEnemyDef();
        toSpawn.push({ def, scale: this.buildSpawnScale(elite) });

        this.enemiesAliveFromWave++;

    } else if (this.waveActive && this.enemiesAliveFromWave <= 0) {
      this.waveActive = false;
      this.wave++; // once this exceeds WAVES_PER_STAGE, the branch above triggers the boss next tick
    }
    return toSpawn;
  }

  notifyEnemyDied() { this.enemiesAliveFromWave = Math.max(0, this.enemiesAliveFromWave - 1); }

  notifyBossDefeated() {
    this.bossActive = false;

    this.stageIntroTimer = 2.2;
    this.bus.emit('stageStart', { stage: this.stage });
  }

  pickBossDef() {
    // Reads BOSSES from gameData.js. To change which boss appears when,
    // this is the only place that logic lives — the stage/wave loop above
    // just calls this once bossActive fires and doesn't care how it picks.
    const majors = BOSSES.filter(b => b.major);
    const normals = BOSSES.filter(b => !b.major);
    if (isMajorBossStage(this.stage)) return choice(majors);
    // Cycle through normal bosses in order, one per stage, wrapping around
    // — every stage gets a boss now, so this just steps through the list
    // rather than being keyed off stage/10 the way it was when bosses were
    // only every 10th stage.
    return normals[(this.stage - 1) % normals.length];
  }

//     telegraph/shake events).

//         spawnEnemyAt(defId, x, y, scale), bus, w, h, onPlayerDamaged(amount) }

    return new Enemy(def, x, y, scale);

  updateEnemy(e, dt, ctx) {

    e.updateStatus(dt);
    if (e.isStunned) return;
    const speed = e.speed * e.slowFactor;

    if (e.regenPerSec) e.hp = Math.min(e.maxHp, e.hp + e.regenPerSec * dt);

    if (e.isBoss) { this.updateBoss(e, dt, ctx, speed); return; }

          dmgType: 'physical', range: 800, visual: 'bullet', radius: 6,
        }));

      }
      case 'gravityWell': {

        ctx.bus.emit('gravityWell', { x: boss.x, y: boss.y, radius: 180, pull: 140 });

      case 'laserSweep': {
        boss.atkTimer = boss.atkCd * 1.4;

        ctx.spawnProjectile(new Projectile({
          x: boss.x, y: boss.y, angle: ang, speed: 900, damage: boss.damage * 1.4, owner: 'enemy',
          dmgType: 'energy', range: 1000, pierce: 10, visual: 'beam', radius: 12,
        }));
        break;
      }
      default: {
        boss.atkTimer = boss.atkCd;
        if (d <= 100) { const dealt = this.dealPlayerDamage(ctx, boss.damage, 'physical'); ctx.dmgNumbers.add(p.x, p.y - 20, dealt); }
      }
    }

    const phase = boss.phases[boss.phaseIndex];
    const summonId = phase.summonId || boss.def?.summonId;
    if (!summonId) return;
    const def = getById(ENEMIES, summonId);
    const count = phase.summonCount || 2;
    for (let i = 0; i < count; i++) {
      const a = (Math.PI * 2 / count) * i;
      ctx.spawnEnemyAt(def, boss.x + Math.cos(a) * 70, boss.y + Math.sin(a) * 70, { hp: 1, dmg: 1, speed: 1, xpMult: 1 });
    }
  }
}

return { EnemyManager };
})();

const MOD_SaveSystem = (function () {
// js/managers/SaveSystem.js
// All persistence goes through this module. Today it's localStorage; a real
// backend could replace load()/save() with fetch() calls without touching
// any other file — every caller only knows about get/set/save/load.
//
// HOW TO EXTEND THIS FILE

//     one level, so a field added to e.g. `meta` picks up its default for
//     existing saves even though their stored `meta` object doesn't have it
//     yet — you don't need a migration for purely additive changes *within
//     an existing section*. Adding a brand new top-level section works too
//     (plain top-level spread already covers that case).
//   - New starter unlock: add the id to the relevant array under `unlocked`
//     in defaultSave() so a fresh save has access to it immediately.
//   - Breaking change to the save shape (renaming/removing a field, changing
//     a field's meaning): bump SAVE_VERSION and fill in migrateSave() to
//     transform an old save into the new shape — don't just silently drop
//     old data.
//   - Swapping localStorage for a real backend: change the bodies of
//     load()/save()/wipe() below (e.g. to `await fetch(...)`) — every other
//     file only ever calls `SaveSystem.load()`/`SaveSystem.save(state)`, so
//     nothing else needs to change. (Note: load()/save() are synchronous
//     today; making them async would mean updating their few call sites in
//     js/core/Game.js to `await`.)
const SAVE_KEY = 'hexdefense_save_v1';
const SAVE_VERSION = 1;

function defaultSave() {
  return {
    version: SAVE_VERSION,
    meta: {
      cores: 0,              // permanent currency, kept across deaths
      highestStage: 0,
      totalRuns: 0,
      totalKills: 0,
      totalBossKills: 0,
      platformSlots: 4,       // hex building platforms unlocked — see MAX_PLATFORM_SLOTS/platformSlotCost in gameData.js
      gems: 0,                // permanent currency, spent on Buffs (see activeBuffs below) — earned from Supply Drop claims
    },
    // Where the CURRENT run has gotten to — resets to stage 1 on death (see
    // Game.onPlayerDeath()), but otherwise persists across page reloads so
    // closing the tab mid-run and coming back doesn't lose stage progress.
    // Only the stage/wave *number* is saved, not in-flight enemies/wave
    // state — a resumed run starts at the beginning of that wave.
    run: { stage: 1, wave: 1 },
    // Permanent "collection log" — every equipment defId ever obtained
    // (drop or craft) maps to the highest tier it's ever been seen at, kept
    // even after the actual item is sold/dismantled. Powers the collapsible
    // Ledger section in the Inventory panel (UIManager.renderInventoryPanel()
    // / Game.recordLedger()) — without this, selling your only copy of
    // something would erase all record you'd ever found it.
    ledger: { equipment: {} },
    // Currently-running Buffs bought with Gems: buffId -> remaining seconds
    // of gameplay time (ticked down in Game.updateActiveBuffs(), removed
    // once it hits 0). See BUFFS in gameData.js for the catalog.
    activeBuffs: {},
    character: {
      // Starts at 1, not 0 — the requested points-per-level pattern is
      // "level 1 = 1 point", i.e. a level-1 character already has their
      // first point available, not zero. See pointsForLevel() in
      // core/utils.js for the full staircase (1,2,2,3,3,3,4,4,4,4,...).
      level: 1, xp: 0, upgradePoints: 1,
      upgrades: { hp: 0, defense: 0, atk: 0, fireRate: 0, crit: 0, critMult: 0, regen: 0, abilityPower: 0, resource: 0, move: 0 },
    },
    unlocked: {
      weapons: ['w_mg', 'w_sidearm'],
      armor: [],
      buildings: ['b_mg_turret', 'b_mine', 'b_medbay', 'b_amp_atk'],
      abilities: ['ab_heal', 'pa_atkspeed'],
      recipes: ['w_mg', 'w_sidearm', 'b_mg_turret', 'b_mine'],
      dungeons: ['d_scrapyard', 'd_reactor', 'd_catacomb', 'd_forge'], // all four are reward sources now — see DUNGEONS in gameData.js
    },
    loadout: {

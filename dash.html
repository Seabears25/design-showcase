<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Wind Thrift — Platform (single page)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ==========================================================================
   LEDGER.CSS
   A component framework for Second Wind Thrift's business platform.
   Structured the same way as lyht.css: root design tokens, a fluid grid,
   then components defined as a parent class with child elements styled
   through descendant selectors, and visual variants applied as extra
   classes alongside the base (e.g. class="btn btn-ghost"), plus small
   is-* state classes for JS-toggled states (is-active, is-checked).
   ========================================================================== */

:root {
  /* ---- Fluid type scale ---- */
  --fs-min: 16px;
  --fs-max: 3vw;
  --fs-body: 1rem;
  --fs-h: 1.5rem;
  --fs-subh: 1.125rem;
  --gr: 1.618; /* Golden ratio, kept from lyht's scale approach */
  --fs-h1: calc(var(--fs-h) * var(--gr));
  --fs-h2: calc(var(--fs-subh) * var(--gr));

  /* ---- Spacing scale ---- */
  --space-xxs: 4px;
  --space-xs: 8px;
  --space-s: 12px;
  --space-m: 16px;
  --space-l: 24px;
  --space-xl: 32px;
  --space-xxl: 64px;
  --space-xxxl: 128px;

  /* ---- Sizing ---- */
  --w-base: 60vw;
  --w-min: 200px;
  --w-max: 1200px;

  /* ---- Color: the "ledger" palette ----
     Named for what they're used for, not their hue, so a future
     re-theme only touches this block. */
  --ink: #23241F;        /* body text */
  --paper: #F0EADC;      /* canvas / card background */
  --paper-dim: #E4DBC5;  /* recessed surfaces, table heads */
  --shell: #202822;      /* dark chrome: sidebar, stamped buttons */
  --shell-soft: #2B342C; /* dark chrome hover/active */
  --mustard: #C99A2E;    /* primary accent */
  --mustard-soft: #E7C875;
  --clay: #A85A42;       /* secondary accent / warnings */
  --sage: #6B8068;       /* success / in-stock */
  --line: rgba(35, 36, 31, 0.14);
  --wht: #FFFFFF;

  /* ---- Radius ---- */
  --radius-s: 4px;
  --radius-m: 8px;
  --radius-l: 14px;

  /* ---- Shadow ---- */
  --shadow-flat: 0 1px 0 rgba(35, 36, 31, 0.06);
  --shadow-lift: 3px 4px 0 var(--mustard-soft);

  /* ---- Type families ----
     Display = slab serif (stamped-ledger feel), Body = humanist sans,
     Mono = utility/data (prices, SKUs, dates, meta). */
  --font-display: 'Zilla Slab', serif;
  --font-body: 'IBM Plex Sans', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;

  /* ---- Breakpoints ---- */
  --bp-mob: 480px;
  --bp-tab: 768px;
  --bp-sm: 1024px;
  --bp-md: 1200px;
}

/* ==========================================================================
   Grid — same mechanism as lyht's row/item system (kept because it's
   layout math, not aesthetic), gap driven by the ledger spacing scale.
   ========================================================================== */

.container {
  max-width: var(--w-max);
  margin: 0 auto;
  padding: 0 var(--space-l);
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: stretch;
  gap: var(--space-l);
}

.row-1 > * { width: 100%; }
.row-2 > * { width: calc(50% - var(--space-l)); }
.row-3 > * { width: calc(33.333% - var(--space-l)); }
.row-4 > * { width: calc(25% - var(--space-l)); }

.item-3  { width: calc(25% - var(--space-l)); }
.item-4  { width: calc(33.333% - var(--space-l)); }
.item-6  { width: calc(50% - var(--space-l)); }
.item-8  { width: calc(66.666% - var(--space-l)); }
.item-12 { width: 100%; }

.row > * { flex-grow: 1; min-width: 0; }

@media (max-width: 768px) {
  .row-1 > *, .row-2 > *, .row-3 > *, .row-4 > *, .row > * { width: 100%; }
}

/* ==========================================================================
   Base + Typography
   ========================================================================== */

body, html { margin: 0; padding: 0; }

body {
  background: var(--paper-dim);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: clamp(var(--fs-min), 1vw + 0.9rem, 18px);
  -webkit-font-smoothing: antialiased;
}

.h1, .h2, .h3 { font-family: var(--font-display); font-weight: 600; margin: 0 0 var(--space-s); line-height: 1.2; }
.h1 { font-size: clamp(1.75rem, 3vw + 1rem, var(--fs-h1)); }
.h2 { font-size: clamp(1.4rem, 2vw + 1rem, var(--fs-h2)); }
.h3 { font-size: 1.15rem; }

.text-lg { font-size: 1.125rem; }
.text-sm { font-size: 0.875rem; }
.text-xs { font-size: 0.75rem; }
.text-mono { font-family: var(--font-mono); }
.text-muted { color: rgba(35, 36, 31, 0.55); }

/* ==========================================================================
   .btn — base button, variants applied alongside the base class:
   class="btn btn-ghost", class="btn btn-sm", etc. Mirrors lyht's
   .button / .button-alt / .button-dashed pattern.
   ========================================================================== */

.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-xs);
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13.5px;
  padding: 9px 16px;
  border-radius: var(--radius-m);
  border: none;
  background: var(--ink);
  color: var(--paper);
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--mustard);
  transition: transform .12s ease, box-shadow .12s ease;
}
.btn:hover { transform: translateY(-1px); }

.btn-ghost {
  background: transparent;
  color: var(--ink);
  border: 1.5px dashed rgba(35, 36, 31, 0.3);
  box-shadow: none;
}
.btn-ghost:hover { border-color: var(--mustard); transform: none; }

.btn-sm { padding: 7px 12px; font-size: 12px; }
.btn-block { width: 100%; justify-content: center; }

/* ==========================================================================
   .card — generic panel. Children styled through named descendant
   classes rather than nth-child, so markup order can change freely.
   ========================================================================== */

.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-m);
  padding: 18px 20px;
  box-shadow: var(--shadow-flat);
}
.card .card-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--space-m); }
.card .card-head h2, .card .card-head .h2 { font-size: 16px; margin: 0; }
.card:hover { box-shadow: var(--shadow-lift); }

/* ==========================================================================
   .tag — the signature component: a price-tag shaped card with a
   punch-hole corner and a dashed perforation line. Same idea as
   lyht's .header (underlay/overlay/content layering pattern), just
   applied to a small card instead of a full-bleed banner.
   ========================================================================== */

.tag {
  position: relative;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px 14px 4px 4px;
  padding: 18px 16px 14px;
  clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%, 0 14px);
  box-shadow: var(--shadow-flat);
  cursor: grab;
  transition: transform .15s ease, box-shadow .15s ease;
}
.tag:hover { transform: translateY(-3px) rotate(-.6deg); box-shadow: var(--shadow-lift); }
.tag .tag-punch { position: absolute; top: 8px; left: 8px; width: 16px; height: 16px; color: rgba(35, 36, 31, .35); }
.tag .tag-icon { font-size: 22px; margin: 6px 0 10px; }
.tag .tag-name { font-family: var(--font-display); font-size: 15.5px; font-weight: 600; margin: 0 0 4px; }
.tag .tag-category { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .03em; text-transform: uppercase; color: var(--clay); }
.tag .tag-perf { border-top: 1px dashed var(--line); margin: 14px 0 10px; }
.tag .tag-foot { display: flex; align-items: center; justify-content: space-between; font-family: var(--font-mono); font-size: 10.5px; color: rgba(35, 36, 31, .45); }

.tag-ghost {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  border: 1.5px dashed rgba(35, 36, 31, .28);
  background: transparent; clip-path: none; border-radius: var(--radius-l);
  color: rgba(35, 36, 31, .55); cursor: pointer; min-height: 150px;
}
.tag-ghost:hover { border-color: var(--mustard); color: var(--ink); }

/* ==========================================================================
   .pill — status indicator. Variants: pill-good, pill-warn, pill-muted.
   ========================================================================== */

.pill {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 9.5px; letter-spacing: .02em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 20px;
  background: rgba(35, 36, 31, .07); color: rgba(35, 36, 31, .55);
}
.pill-good  { background: rgba(107, 128, 104, .16); color: #3D5C3A; }
.pill-warn  { background: rgba(201, 154, 46, .16); color: #8A6A1E; }
.pill-muted { color: rgba(35, 36, 31, .45); }

/* ==========================================================================
   .chip — filter/selector chip. Toggled state uses .is-active, not a
   variant class, since it's JS-driven rather than a fixed style choice.
   ========================================================================== */

.chip {
  font-family: var(--font-mono);
  font-size: 11.5px; letter-spacing: .02em;
  padding: 6px 12px; border-radius: 20px;
  border: 1px solid var(--line);
  background: var(--paper); color: rgba(35, 36, 31, .65);
  cursor: pointer;
}
.chip-ghost { background: transparent; }
.chip.is-active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ==========================================================================
   .nav — sidebar navigation. Same descendant-scoping idea as lyht's
   .navbar .nav-links li, just applied to a vertical rail.
   ========================================================================== */

.nav { display: flex; flex-direction: column; gap: 2px; list-style: none; margin: 0; padding: 0; }
.nav .nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 10px; border-radius: 7px;
  font-size: 13.5px; color: rgba(240, 234, 220, .72); cursor: pointer;
}
.nav .nav-item:hover { background: var(--shell-soft); color: var(--paper); }
.nav .nav-item.is-active { background: var(--shell-soft); color: var(--mustard-soft); box-shadow: inset 2px 0 0 var(--mustard); }
.nav .nav-icon { width: 18px; text-align: center; }

/* ==========================================================================
   .form — floating-label inputs, restyled from lyht's form but same
   descendant pattern (.form input, .form label) and the same
   primary/ghost variant convention.
   ========================================================================== */

.form { display: flex; flex-direction: column; gap: var(--space-l); }
.form .form-group { position: relative; width: 100%; }
.form input, .form textarea, .form select {
  width: 100%; box-sizing: border-box;
  padding: 12px 16px; border-radius: var(--radius-m);
  border: 1.5px solid var(--line); background: var(--paper);
  font-family: var(--font-body); font-size: 14px; color: var(--ink);
  outline: none; transition: border-color .2s ease;
}
.form input:focus, .form textarea:focus, .form select:focus { border-color: var(--mustard); }
.form label {
  position: absolute; top: 50%; left: 16px; transform: translateY(-50%);
  color: rgba(35, 36, 31, .5); font-size: 14px; pointer-events: none;
  transition: all .2s ease; background: var(--paper); padding: 0 4px;
}
.form input:focus + label, .form input:not(:placeholder-shown) + label {
  top: 0; font-size: 11px; color: var(--clay);
}
.form input.ghost, .form textarea.ghost { background: transparent; border-style: dashed; }

/* ==========================================================================
   .table — ledger-style data table.
   ========================================================================== */

.table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--paper); }
.table thead th {
  text-align: left; font-family: var(--font-mono);
  font-size: 10.5px; letter-spacing: .03em; text-transform: uppercase;
  color: rgba(35, 36, 31, .5); background: var(--paper-dim);
  padding: 10px 14px; border-bottom: 1px solid var(--line);
}
.table tbody tr { border-bottom: 1px dashed var(--line); }
.table tbody tr:hover { background: rgba(201, 154, 46, .06); }
.table td { padding: 11px 14px; }

/* ==========================================================================
   .tabs — same structural naming as lyht's tab-container / tabs /
   tab-title / tab-content, restyled to the ledger palette.
   ========================================================================== */

.tab-container { display: flex; flex-direction: column; width: 100%; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs .tab-title {
  padding: 8px 16px; cursor: pointer; font-size: 12.5px;
  font-family: var(--font-mono); color: rgba(35, 36, 31, .55);
  border-radius: var(--radius-m) var(--radius-m) 0 0;
}
.tabs .tab-title.is-active { background: var(--paper); color: var(--ink); font-weight: 600; }
.tab-content { padding: var(--space-l) 0; }
.tab-content .tab-pane { display: none; }
.tab-content .tab-pane.is-active { display: block; }

@media (max-width: 768px) {
  .tabs { flex-direction: column; }
}

/* ==========================================================================
   .stat — small metric tile, used in ledger-style stat rows.
   ========================================================================== */

.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius-m); overflow: hidden; }
.stat { background: var(--paper); padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; }
.stat .stat-label { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; color: rgba(35, 36, 31, .5); }
.stat .stat-value { font-family: var(--font-display); font-size: 22px; font-weight: 600; }



/* This file is an EXTENSION layer on top of ledger.css — only styles for
   things the framework doesn't cover (app shell, page-specific layouts,
   one-off components like inventory item cards, the calendar grid, chat
   bubbles). Anything that duplicated a ledger.css component (.btn, .pill,
   .tag, .chip, .stat, .table, .nav) has been removed in favor of the
   framework version; components were updated to use those class names. */

:root{
  --shell-line: rgba(240,234,220,0.12);
}
*{box-sizing:border-box;}

.shell{
  display:flex;
  min-height:100vh;
}

/* ---------- Sidebar shell (app chrome — not part of the generic .nav) ---------- */
.shell-nav{
  width:240px;
  flex-shrink:0;
  background:var(--shell);
  color:var(--paper);
  display:flex;
  flex-direction:column;
  padding:22px 16px;
  transition:width .2s ease, padding .2s ease;
  position:relative;
}
.shell-nav .nav{flex:1;}
.shell-brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:6px 8px 22px;
  border-bottom:1px solid var(--shell-line);
  margin-bottom:14px;
  position:relative;
}
.collapse-btn{
  position:absolute;
  right:-12px;top:2px;
  width:24px;height:24px;
  border-radius:50%;
  border:1px solid var(--shell-line);
  background:var(--shell-soft);
  color:var(--paper);
  font-size:13px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s ease;
  z-index:2;
}
.collapse-btn:hover{background:var(--mustard);color:var(--shell);border-color:var(--mustard);}

/* ---- Collapsed state ---- */
.shell-nav.is-collapsed{width:68px;padding:22px 10px;}
.shell-nav.is-collapsed .shell-brand{
  justify-content:center;padding:6px 0 22px;border-bottom:1px solid var(--shell-line);
}
.shell-nav.is-collapsed .brand-text{display:none;}
.shell-nav.is-collapsed .collapse-btn{transform:rotate(180deg);}
.shell-nav.is-collapsed .nav-item{justify-content:center;padding:9px 0;}
.shell-nav.is-collapsed .nav-item.is-active{box-shadow:none;background:var(--shell-soft);}
.shell-nav.is-collapsed .nav-label,
.shell-nav.is-collapsed .nav-badge{display:none;}
.shell-nav.is-collapsed .shell-foot{justify-content:center;padding:9px 0;}
.shell-nav.is-collapsed .nav-icon{width:auto;}

.brand-mark{
  width:36px;height:36px;
  border-radius:8px;
  background:var(--mustard);
  color:var(--shell);
  font-family:var(--font-display);
  font-weight:700;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;
}
.brand-text{display:flex;flex-direction:column;line-height:1.25;}
.brand-text strong{font-family:var(--font-display);font-size:15px;font-weight:600;}
.brand-text small{color:rgba(240,234,220,0.55);font-size:11.5px;letter-spacing:.02em;}

/* .nav base styling (item hover/active/icon) now comes from ledger.css .nav —
   only the badge and the label (for collapse-hiding) are app-specific. */
.nav-label{}
.nav-badge{
  margin-left:auto;
  background:var(--mustard);
  color:var(--shell);
  font-family:var(--font-mono);
  font-size:10.5px;
  font-weight:500;
  padding:1px 6px;
  border-radius:20px;
}
.shell-foot{
  display:flex;align-items:center;gap:11px;
  padding:9px 10px;
  margin-top:10px;
  border-top:1px solid var(--shell-line);
  color:rgba(240,234,220,0.55);
  font-size:13px;
}

@media (max-width:900px){
  .shell{flex-direction:column;}
  .shell-nav{width:100%;flex-direction:row;overflow-x:auto;}
  .shell-nav .nav{flex-direction:row;}
  .shell-foot{display:none;}
}

/* ---------- Canvas / top bar ---------- */
.canvas{flex:1;display:flex;flex-direction:column;background:var(--paper);min-width:0;}
.canvas-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 32px;
  border-bottom:1px solid var(--line);
  background:var(--paper);
}
.crumb{font-size:13px;color:rgba(35,36,31,0.5);display:flex;gap:8px;align-items:center;}
.crumb strong{color:var(--ink);font-weight:600;}
.crumb-sep{opacity:.4;}
.top-actions{display:flex;align-items:center;gap:12px;}
.search-tag{
  display:flex;align-items:center;gap:8px;
  background:var(--paper-dim);
  border:1px solid var(--line);
  border-radius:20px;
  padding:7px 14px;
  width:230px;
}
.search-icon{opacity:.5;font-size:13px;}
.search-tag input{
  border:none;background:transparent;outline:none;
  font-family:var(--font-body);
  font-size:13px;color:var(--ink);width:100%;
}
.search-tag--wide{width:280px;}

/* ---------- Button variants ledger.css doesn't define ---------- */
.btn-stamp{transform:rotate(-0.4deg);}
.btn-charge{padding:13px;font-size:15px;}
.stamp-plus{font-size:15px;line-height:1;}

/* ---------- Page shell ---------- */
.library{padding:28px 32px 60px;}
.library-head{margin-bottom:20px;}
.library-head h1{
  font-family:var(--font-display);
  font-size:26px;font-weight:600;margin:0 0 6px;
}
.library-head p{margin:0;color:rgba(35,36,31,0.6);font-size:13.5px;max-width:520px;}

.filter-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:22px;
  padding-bottom:14px;
  border-bottom:1px dashed var(--line);
}
.chip-set{display:flex;flex-wrap:wrap;gap:8px;}
.chip-set--muted{opacity:.85;}
.view-toggle{display:flex;gap:4px;}
.view-btn{
  width:28px;height:28px;border-radius:6px;border:1px solid var(--line);
  background:var(--paper);color:rgba(35,36,31,0.5);cursor:pointer;
}
.view-btn.is-active{background:var(--paper-dim);color:var(--ink);}

.tag-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(192px,1fr));
  gap:20px;
}
/* .tag / .tag-ghost core shape now comes from ledger.css. These are the
   inner meta/action elements the framework doesn't define. */
.tag-new-plus{font-size:22px;line-height:1;color:var(--mustard);}
.tag-uses{
  font-family:var(--font-mono);
  font-size:10.5px;color:rgba(35,36,31,0.45);
}
.tag-actions{display:flex;gap:4px;}
.tag-action{
  width:22px;height:22px;border-radius:5px;border:none;
  background:transparent;color:rgba(35,36,31,0.45);
  font-size:11px;cursor:pointer;
}
.tag-action:hover{background:var(--paper-dim);color:var(--ink);}
.tag-drag{cursor:grab;}

/* .stat-row / .stat come from ledger.css; just add the section spacing
   and the note styling the framework doesn't cover. */
.stat-row{margin-bottom:22px;}
.stat-note{font-size:11px;font-family:var(--font-mono);}
.stat-note--sage{color:var(--sage);}
.stat-note--clay{color:var(--clay);}

/* ---------- Inventory item cards ---------- */
.item-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:20px;
}
.item-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
  box-shadow:var(--shadow-flat);
  transition:transform .15s ease, box-shadow .15s ease;
}
.item-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);}
.item-card--sold{opacity:.6;}

.item-photo{
  position:relative;
  height:118px;
  display:flex;align-items:center;justify-content:center;
  font-size:34px;
}
.item-photo--a{background:#DCD3B8;}
.item-photo--b{background:#D8C9BC;}
.item-photo--c{background:#C9D0C2;}
.item-photo--d{background:#D6CDD9;}
.item-photo-icon{filter:saturate(0.85);}

/* .pill from ledger.css handles the badge itself; position it in-context */
.item-photo .pill{position:absolute;top:8px;right:8px;}

.price-tag{
  position:absolute;left:10px;bottom:-1px;
  background:var(--mustard);
  color:var(--shell);
  font-family:var(--font-display);font-weight:700;
  font-size:13px;
  padding:4px 10px 5px 12px;
  border-radius:3px 8px 0 0;
  display:flex;align-items:baseline;gap:6px;
  transform:translateY(1px);
}
.price-tag-was{
  font-family:var(--font-mono);
  font-weight:400;font-size:10.5px;
  text-decoration:line-through;
  opacity:.65;
}

.item-body{padding:12px 14px 14px;}
.item-name{
  font-family:var(--font-display);
  font-size:14.5px;font-weight:600;margin:0 0 4px;line-height:1.25;
}

function SalesChart() {
  const max = Math.max(...SALES_BY_DAY.map((d) => d.value));
  const barW = 34, gap = 22, chartH = 140, baseX = 10;
  const width = baseX * 2 + SALES_BY_DAY.length * (barW + gap) - gap;
  const bars = SALES_BY_DAY.map((d, i) => {
    const h = Math.round((d.value / max) * chartH);
    const x = baseX + i * (barW + gap);
    const y = chartH - h + 20;
    return '<g><rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + h + '" rx="4" class="' +
      (d.isToday ? 'bar bar--today' : 'bar') + '"></rect>' +
      '<text x="' + (x + barW / 2) + '" y="' + (chartH + 38) + '" class="bar-label" text-anchor="middle">' + d.day + '</text></g>';
  }).join('');
  const svgMarkup = '<svg viewBox="0 0 ' + width + ' ' + (chartH + 44) + '" class="sales-chart">' + bars + '</svg>';
  return Div({ class: 'panel' },
    Div({ class: 'panel-head' }, H2({}, 'This week'), Span({ class: 'panel-sub' }, '$1,940 this week')),
    Div({ class: 'chart-mount' })({ onmount: (dom) => { dom.innerHTML = svgMarkup; } })
  );
}

  { text: 'Publish "Weekend Markdown Preview"', assignee: 'Devon', due: 'Tomorrow', done: false, frequency: 'oneoff', frequencyLabel: 'One-off' },
  { text: 'Reconcile consignor payouts', assignee: 'Jordan', due: '1st of month', done: false, frequency: 'monthly', frequencyLabel: 'Monthly' },
  { text: 'Deep clean fitting rooms', assignee: 'Maya', due: 'Last Sun', done: true, frequency: 'monthly', frequencyLabel: 'Monthly' }
];

function TeamPage() {
  const freqKey = { 'Daily': 'daily', 'Weekly': 'weekly', 'Monthly': 'monthly', 'One-off': 'oneoff' };
  const visibleTasks = state.taskFilter === 'All' ? TASKS : TASKS.filter((t) => t.frequency === freqKey[state.taskFilter]);
  return Section({ class: 'library' },
    PageHead('Team', 'Shifts, tasks, and chat in one place — no more group texts.'),
    StatRow(TEAM_STATS),
    Div({ class: 'panel panel--wide' },
      Div({ class: 'panel-head' }, H2({}, 'This week'), Span({ class: 'panel-sub' }, 'Jul 13 – Jul 19')),
      Div({ class: 'cal-grid' },
        Div({ class: 'cal-row cal-row--head' },
          Div({ class: 'cal-staff-col' }),
          For(CAL_DAYS, (d) => Div({ class: 'cal-day-head' }, d))
        ),
        For(STAFF_ROWS, (row) =>
          Div({ class: 'cal-row' },
            Div({ class: 'cal-staff-col' }, Span({ class: 'cust-avatar cust-avatar--sm' }, row.initials), Span({ class: 'cal-staff-name' }, row.name)),
            For(row.cells, (cell) =>
              Div({ class: 'cal-cell' },
                If(cell.shift, Span({ class: 'cal-chip cal-chip--shift cal-chip--' + row.tint }, cell.shift)),
                If(cell.task, Span({ class: 'cal-chip cal-chip--task' }, cell.task))
              )
            )
          )
        )
      )
    ),
    Div({ class: 'dash-grid dash-grid--team' },
      Div({ class: 'panel panel--chat' },
        Div({ class: 'panel-head' }, H2({}, 'Team chat'), Span({ class: 'panel-sub' }, '#shop-floor')),
        Div({ class: 'chat-thread' }, For(MESSAGES, (m) =>
          Div({ class: 'chat-msg' + (m.self ? ' chat-msg--self' : '') },
            If(!m.self, Span({ class: 'cust-avatar cust-avatar--sm' }, m.initials)),
            Div({ class: 'chat-bubble' },
              If(!m.self, Span({ class: 'chat-author' }, m.author)),
              P({ class: 'chat-text' }, m.text),
              Span({ class: 'chat-time' }, m.time)
            )
          )
        )),
        Div({ class: 'chat-input-row' },
          Input({ type: 'text', class: 'chat-input', placeholder: 'Message the team…' }),
          Button({ class: 'btn btn-sm' }, 'Send')
        )
      ),
      Div({ class: 'panel panel--tasks' },
        Div({ class: 'panel-head' }, H2({}, 'Tasks'), Button({ class: 'btn btn-ghost btn-sm' }, '+ Add task')),
        Div({ class: 'chip-set task-filter-row' }, For(TASK_FILTERS, (f) =>
          Span({ class: 'chip chip-ghost' + (f === state.taskFilter ? ' is-active' : '') }, f)(() => setFilter('taskFilter', f))
        )),
        Ul({ class: 'task-list' }, For(visibleTasks, (t) =>
          Li({ class: 'task-row' + (t.done ? ' task-row--done' : '') },
            Span({ class: 'task-check' + (t.done ? ' is-checked' : '') }, t.done ? '✓' : ''),
            Div({ class: 'task-body' },
              Div({ class: 'task-text-row' },
                Span({ class: 'task-text' }, t.text),
                Span({ class: 'task-freq task-freq--' + t.frequency }, t.frequencyLabel)
              ),
              Span({ class: 'task-meta' }, t.assignee + ' · ' + t.due)
            )
          )
        ))
      )
    )
  );
}

];

function blockPreview(block) {
  switch (block.type) {
    case 'hero':
      return Div({ class: 'cv-hero' },
        Span({ class: 'cv-hero-mark' }, 'SW'),
        Div({}, Strong({}, block.data.name), P({}, block.data.tagline)),
        Button({ class: 'btn btn-sm' }, 'Visit shop')
      );
    case 'hours':
      return Div({ class: 'cv-hours' }, For(block.data.rows, (r) =>
        Div({ class: 'cv-hours-row' }, Span({}, r.day), Span({ class: 'mono-cell' }, r.time))
      ));
    case 'showcase':
      return Div({ class: 'cv-showcase' }, For(block.data.items, (it) =>
        Div({ class: 'cv-showcase-item item-photo--' + it.tint }, Span({}, it.icon), Span({ class: 'cv-showcase-price' }, it.price))
      ));
    case 'testimonial':
      return Div({ class: 'cv-testimonial' }, P({}, '\u201C' + block.data.quote + '\u201D'), Span({ class: 'cv-testimonial-author' }, '— ' + block.data.author));
    case 'booking':
      return Div({ class: 'cv-booking' }, Span({}, block.data.label), Button({ class: 'btn btn-sm' }, 'Book now'));
    case 'map':
      return Div({ class: 'cv-map' }, Span({}, '📍'), Span({}, block.data.address));
    default:
      return Div({}, '');
  }
}

function WebsitePage() {
  return Section({ class: 'library' },
    PageHead('Website', 'Built from your component library. Edit a block here or manage the source in Components.'),
    StatRow(WEBSITE_STATS),
    Div({ class: 'dash-grid dash-grid--site' },
      Div({ class: 'panel panel--pages' },
        Div({ class: 'panel-head' }, H2({}, 'Pages'), Button({ class: 'btn btn-ghost btn-sm' }, '+ Page')),
        Ul({ class: 'page-list' }, For(SITE_PAGES, (p) =>
          Li({ class: 'page-row' + (p.isActive ? ' is-active' : '') },
            Div({ class: 'page-row-main' }, Span({ class: 'page-name' }, p.name), Span({ class: 'page-updated' }, p.updated)),
            Span({ class: 'pill ' + (p.status === 'Draft' ? 'pill-warn' : 'pill-good') }, p.status)
          )
        ))
      ),
      Div({ class: 'panel panel--canvas' },
        Div({ class: 'panel-head' },
          Div({}, H2({}, 'Editing: Home'), Span({ class: 'panel-sub' }, 'Drag blocks from the Component Library to add more')),

        ),
        Div({ class: 'site-canvas' },
          For(PAGE_BLOCKS, (block) =>
            Div({ class: 'cv-block' },
              Div({ class: 'cv-block-tab' },
                Span({ class: 'cv-block-drag' }, '⠿'),
                Span({ class: 'cv-block-label' }, block.label),
                Div({ class: 'cv-block-actions' }, Button({ class: 'tag-action', title: 'Edit' }, '✎'), Button({ class: 'tag-action', title: 'Remove' }, '✕'))
              ),

            )

}

function App() {
  const pages = {
    dashboard: DashboardPage, website: WebsitePage, components: ComponentsPage,
    inventory: InventoryPage, pos: POSPage, crm: CRMPage, blog: BlogPage, team: TeamPage
  };
  return Div({ class: 'shell' },
    Sidebar(),
    Main({ class: 'canvas' },
      Topbar(),
      Case(state.view, pages)
    )
  );
}

start(App, document.getElementById('root'));

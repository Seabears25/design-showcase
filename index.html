<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joey Lawson — Dev &amp; Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14151a;
    --ink-2: #1b1c22;
    --ink-3: #22232b;
    --bone: #e8e3d6;
    --bone-dim: #a19d90;
    --brass: #d3a24c;
    --brass-line: rgba(211, 162, 76, 0.28);
    --teal: #5c9490;
    --rust: #c06a4a;
    --hair: rgba(232, 227, 214, 0.09);
  }

  * { box-sizing: border-box; }

  html { -webkit-font-smoothing: antialiased; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--bone);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
  }

  a { color: inherit; text-decoration: none; }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 32px;
  }

  /* ---------- hero ---------- */

  .hero {
    padding: 96px 0 64px;
    animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .hero { animation: none; }
  }

  .hero-name {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(2.6rem, 6vw, 4.4rem);
    letter-spacing: -0.01em;
    margin: 0 0 18px;
    color: var(--bone);
  }

  .hero-tagline {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.15rem, 2.4vw, 1.45rem);
    color: var(--brass);
    max-width: 42ch;
    margin: 0 0 20px;
  }

  .hero-intro {
    max-width: 58ch;
    color: var(--bone-dim);
    font-size: 1.02rem;
    margin: 0 0 36px;
  }

  .hero-rule {
    width: 64px;
    height: 2px;
    background: var(--brass);
    border: none;
  }

  /* ---------- section ---------- */

  .section {
    padding: 8px 0 96px;
  }

  .section-title {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.5rem;
    margin: 0 0 36px;
    color: var(--bone);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 28px;
  }

  /* ---------- card ---------- */

  .card {
    display: flex;
    flex-direction: column;
    background: var(--ink-2);
    border: 1px solid var(--hair);
    border-radius: 4px;
    overflow: hidden;
    transition: border-color 0.25s ease, transform 0.25s ease;
  }

  a.card:hover {
    transform: translateY(-3px);
  }

  .card-media {
    aspect-ratio: 4 / 3;
    width: 100%;
    background: var(--ink-3);
    border-bottom: 1px solid var(--hair);
  }

  .card-media--placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    border-bottom-width: 2px;
    border-bottom-style: solid;
    background-image: repeating-linear-gradient(
      135deg,
      rgba(232, 227, 214, 0.035) 0px,
      rgba(232, 227, 214, 0.035) 1px,
      transparent 1px,
      transparent 14px
    );
  }

  .card-mark {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 2.4rem;
    opacity: 0.9;
  }

  .card-body {
    padding: 20px 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .card-cat {
    font-size: 0.82rem;
    font-weight: 600;
  }

  .card-title {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.28rem;
    margin: 0;
    color: var(--bone);
  }

  .card-desc {
    font-size: 0.92rem;
    color: var(--bone-dim);
    margin: 0;
    flex: 1;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }

  .tag {
    font-size: 0.74rem;
    padding: 3px 9px;
    border: 1px solid var(--hair);
    border-radius: 3px;
    color: var(--bone-dim);
  }

  /* ---------- footer ---------- */

  .site-footer {
    border-top: 1px solid var(--hair);
    padding: 32px 0 56px;
    color: var(--bone-dim);
    font-size: 0.9rem;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .site-footer a {
    color: var(--bone-dim);
    border-bottom: 1px solid transparent;
  }

  .site-footer a:hover {
    color: var(--brass);
    border-bottom-color: var(--brass-line);
  }

  .footer-links {
    display: flex;
    gap: 20px;
  }

  a:focus-visible, .card:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="./elment.js"></script>
<script type="text/javaScript">
/* ============================================================
   EDIT ME — just add/remove/reorder objects in this array.
   Everything below reads from it automatically.

   Fields:
     title       (required) project name
     category    (required) 'Development' | 'Design' | 'Writing'
                 — controls the accent color, see CATEGORY_COLORS
     description (required) one or two sentences
     image       (optional) URL to a real image — leave '' for
                 the generated placeholder (initials on a
                 hatched panel in the category color)
     tags        (optional) array of short strings
     link        (optional) URL — makes the whole card clickable
   ============================================================ */
  const projects = [
    {
      title: 'Basic Dash',
      category: 'Design',
      description: 'A Basic Dashboard Design using the Elment.js Front-End',
      image: '',
      tags: ['JavaScript', 'Dash', 'Design'],
      link: 'https://seabears25.github.io/design-showcase/dash.html'
    },
    {
      title: 'Lyht Styled Dash',
      category: 'Design',
      description: 'A Basic Dashboard Design using the Elment.js and Lyht.css Front-End',
      image: '',
      tags: ['JavaScript', 'Dash', 'Design'],
      link: 'https://seabears25.github.io/design-showcase/dash-lyht.html'
    },
    {
      title: 'Tech landing',
      category: 'Design',
      description: 'A Basic Dashboard Design using the Elment.js and Lyht.css Front-End',
      image: '',
      tags: ['JavaScript', 'Dash', 'Design'],
      link: 'https://seabears25.github.io/design-showcase/tech.html'
    },
    {
      title: 'elment.js',
      category: 'Development',
      description: 'A dependency-free JS framework — no HTML strings, no build step, just function calls.',
      image: '',
      tags: ['JavaScript', 'Framework', 'No-Build'],
      link: 'https://seabears25.github.io/Elment.js/'
    },
    {
      title: 'Lhyt.css',
      category: 'Development',
      description: 'A Parent handles Child behavior CSS Framework',
      image: '',
      tags: ['UI Design', 'Dev', 'CSS'],
      link: 'https://seabears25.github.io/Lyht-UI/'
    }
  ];

  const CATEGORY_COLORS = {
    Development: 'var(--teal)',
    Design: 'var(--brass)',
    Writing: 'var(--rust)'
  };

  function initials(title) {
    return title
      .split(' ')
      .filter(Boolean)
      .slice(0, 2)
      .map(w => w[0].toUpperCase())
      .join('');
  }

  function ProjectCard(item) {
    const color = CATEGORY_COLORS[item.category] || 'var(--brass)';

    const media = item.image
      ? Div({
          class: 'card-media',
          style: {
            backgroundImage: 'url(' + item.image + ')',
            backgroundSize: 'cover',
            backgroundPosition: 'center'
          }
        })
      : Div(
          { class: 'card-media card-media--placeholder', style: { borderBottomColor: color } },
          Div({ class: 'card-mark', style: { color: color } }, initials(item.title))
        );

    const body = Div(
      { class: 'card-body' },
      Div({ class: 'card-cat', style: { color: color } }, item.category),
      H3({ class: 'card-title' }, item.title),
      P({ class: 'card-desc' }, item.description),
      Div({ class: 'card-tags' }, For(item.tags || [], t => Span({ class: 'tag' }, t)))
    );

    return item.link
      ? A({ class: 'card', href: item.link, target: '_blank', rel: 'noopener' }, media, body)
      : Div({ class: 'card' }, media, body);
  }

  function App() {
    return Html(
      Header(
        { class: 'wrap hero' },
        H1({ class: 'hero-name' }, 'Joey Lawson'),
        P({ class: 'hero-tagline' }, 'Code, design, and story — usually all three on the same project.'),
        P(
          { class: 'hero-intro' },
          'A working selection of development, interface design, and long-form fiction.'
        ),
        Hr({ class: 'hero-rule' })
      ),
      Section(
        { class: 'wrap section' },
        H2({ class: 'section-title' }, 'Selected Work'),
        Div({ class: 'grid' }, For(projects, p => ProjectCard(p)))
      ),
      Footer(
        { class: 'wrap site-footer' },
        Span({}, '\u00A9 ' + new Date().getFullYear() + ' Joey Lawson'),
        Div(
          { class: 'footer-links' },
          A({}, 'joey.jlws@gmail.com'),
          A({ href: 'https://github.com/Seabears25', target: '_blank'}, 'GitHub'),
          A({ href: 'https://www.facebook.com/profile.php?id=61591737003062', targert: '_blank'}, 'FaceBook')
        )
      )
    );
  }

  start(App, document.getElementById('app'));

</script>
</body>
</html>
